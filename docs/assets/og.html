<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onramp social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@600;700;800&family=Onest:wght@400;500&display=swap">
<style>
  /* 1200 x 630 social card. Capture the #card element. */
  html, body { margin: 0; background: #0e1012; }
  #card { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #0e1012; color: #efede7;
    background-image: radial-gradient(rgba(238, 236, 230, 0.07) 1px, transparent 1px); background-size: 18px 18px;
    font-family: "Onest", system-ui, sans-serif; }
  .left { position: absolute; left: 72px; top: 64px; width: 640px; display: grid; gap: 26px; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: "Hanken Grotesk", sans-serif; font-weight: 800; font-size: 34px; }
  .brand img { width: 52px; height: 52px; }
  h1 { margin: 18px 0 0; font-family: "Hanken Grotesk", sans-serif; font-weight: 800; font-size: 92px; line-height: 0.96; letter-spacing: -0.035em; }
  p { margin: 0; font-size: 27px; line-height: 1.4; color: #a9aca5; max-width: 600px; }
  .cmd { position: absolute; left: 72px; bottom: 60px; font-family: "Geist Mono", monospace; font-size: 23px; color: #e6e4de; background: #050607; border: 1px solid #2a2f34; border-radius: 12px; padding: 14px 22px; }
  .cmd { display: flex; align-items: center; padding: 10px 10px 10px 22px; }
  .cmd span { color: #7e837d; white-space: pre; }
  .cmd .copy { margin-left: 22px; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; font-size: 17px; color: #e6e4de; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 8px 14px; }
  svg.road { position: absolute; right: 0; top: 0; }
  .sign { position: absolute; background: #0d7550; color: #f4f8f5; border-radius: 10px; padding: 12px 18px 13px; box-shadow: inset 0 0 0 2px #0d7550, inset 0 0 0 4px rgba(255, 255, 255, 0.9); font-family: "Hanken Grotesk", sans-serif; font-weight: 700; font-size: 22px; display: grid; gap: 2px; }
  .sign small { font-family: "Hanken Grotesk", sans-serif; font-size: 15px; opacity: 0.85; font-weight: 600; }
  .here { position: absolute; font-family: "Hanken Grotesk", sans-serif; font-weight: 700; font-size: 16px; background: #f6c24f; color: #1a1406; border-radius: 5px; padding: 4px 9px; }
  .check { margin-left: 14px; font-family: "Hanken Grotesk", sans-serif; font-weight: 600; font-size: 18px; color: #a9aca5; display: flex; align-items: center; gap: 10px; border: 1px solid #2a2f34; border-radius: 999px; padding: 5px 14px 5px 12px; letter-spacing: 0; }
</style>
</head>
<body>
<div id="card">
  <svg class="road" width="480" height="630" viewBox="0 0 480 630" aria-hidden="true">
    <path d="M300 -20 C 180 120, 400 230, 250 360 S 220 560, 330 660" fill="none" stroke="#31373c" stroke-width="86" stroke-linecap="round"/>
    <path d="M300 -20 C 180 120, 400 230, 250 360 S 220 560, 330 660" fill="none" stroke="#22262a" stroke-width="76" stroke-linecap="round"/>
    <path d="M300 -20 C 180 120, 400 230, 250 360 S 220 560, 330 660" fill="none" stroke="#f6c24f" stroke-width="4" stroke-dasharray="18 16"/>
    <circle cx="262" cy="96" r="15" fill="#0d7550" stroke="#f4f8f5" stroke-width="4"/>
    <circle cx="318" cy="246" r="15" fill="#0d7550" stroke="#f4f8f5" stroke-width="4"/>
    <circle cx="252" cy="392" r="17" fill="#f6c24f" stroke="#ffffff" stroke-width="4"/>
    <circle cx="262" cy="528" r="15" fill="#22262a" stroke="#f4f8f5" stroke-width="4"/>
  </svg>
  <div class="sign" style="right: 236px; top: 66px;"><small>Exit 01</small>The gist</div>
  <div class="sign" style="right: 22px; top: 214px;"><small>Exit 06</small>How it flows</div>
  <div class="here" style="right: 248px; top: 352px;">You are here</div>
  <div class="sign" style="right: 24px; top: 380px;"><small>Exit 08</small>File by file</div>

  <div class="left">
    <div class="brand"><img src="logo.svg" alt="">Onramp<span class="check">an agent skill for any coding agent</span></div>
    <h1>Understand any codebase.</h1>
    <p>A route through the code, sized to your time. Every claim checked against the code.</p>
  </div>
  <div class="cmd"><span>$ </span>npx skills add SanyamWadhwa07/onramp<b class="copy"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 3.5V3a1.5 1.5 0 0 0-1.5-1.5H3A1.5 1.5 0 0 0 1.5 3v6.5A1.5 1.5 0 0 0 3 11h.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Copy</b></div>
</div>
</body>
</html>
