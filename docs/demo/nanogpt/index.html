memory: two extra numbers per weight, which is why the notebook estimates a GPT-2 124M checkpoint with optimizer state at 3 × the weights' size [[transformer_sizing.ipynb:134-139|params_and_buffers_bytes = params_bytes + 2*params_bytes]].\n\nThe **W** is decoupled weight decay: each step also shrinks every decayed weight towards zero by `learning_rate × weight_decay × weight`, which discourages any one weight from growing large.\n\nnanoGPT's rule for what to decay is two list comprehensions: every tensor with 2 or more dimensions (linear-layer weights and the embedding) is decayed; every 1-D tensor (biases, LayerNorm gains) is not [[model.py:268-275|if p.dim() >= 2]]. For the baby GPT, start-up prints 26 decayed tensors with 10,740,096 numbers and 13 non-decayed tensors with 4,992 [[model.py:276-279|num decayed parameter tensors]].\n\nOn CUDA it asks for the **fused** AdamW kernel when PyTorch offers one, which updates all tensors in a single GPU call [[model.py:280-285|use_fused = fused_available and device_type == 'cuda']].\n\nThe baby config raises `beta2` to 0.99 because each iteration sees few tokens [[config/train_shakespeare_char.py:31|beta2 = 0.99]]. At 64 × 256 = 16,384 tokens per step the gradients are noisy, and a longer average of their squares is steadier.","checkpoint":{"q":"Which of these parameters gets weight decay in nanoGPT?","choices":["`transformer.ln_f.weight`, a LayerNorm gain","`h.0.attn.c_proj.bias`","`transformer.wte.weight`, the token embedding","None; weight_decay only lowers the learning rate"],"answer":2,"explain":"The rule is purely by shape: 2-D tensors are decayed [[model.py:270|p.dim() >= 2]]. The embedding is a 2-D matrix; gains and biases are 1-D."}},{"id":"concepts-lr-schedule","chapter":"concepts","title":"The learning-rate schedule: warmup, then cosine","tier":"standard","minutes":4,"goals":["ship","own","rebuild"],"summary":"The learning rate climbs linearly from almost zero to its maximum over `warmup_iters` steps, follows half a cosine wave down to `min_lr` by `lr_decay_iters`, and then stays there.","body":"By the end you can predict the learning rate at any iteration.\n\n`get_lr(it)` has three cases [[train.py:230-242|def get_lr(it):]]:\n\n1. **Warmup**, while `it \u003c warmup_iters`: `learning_rate × (it + 1) / (warmup_iters + 1)`. At the start the weights are random and the gradients point in wild directions; small steps keep AdamW's running averages from being dominated by that noise. The `+ 1` makes the very first step non-zero, a fix from December 2024 (`dc81cb3`).\n2. **After the schedule**, once `it > lr_decay_iters`: `min_lr`.\n3. **In between**: `coeff = 0.5 × (1 + cos(π × progress))` runs smoothly from 1 to 0, and the rate is `min_lr + coeff × (learning_rate − min_lr)`.\n\nThe loop writes the value into the optimizer at the top of each iteration, unless `decay_lr = False`, in which case it stays at `learning_rate` [[train.py:257-260|for param_group in optimizer.param_groups:]].\n\nConcrete numbers. GPT-2 defaults: 2,000 warmup steps to 6e-4, then cosine down to 6e-5 at step 600,000. The comments cite Chinchilla for `lr_decay_iters ≈ max_iters` and `min_lr ≈ learning_rate / 10` [[train.py:64-68|should be ~= learning_rate/10 per Chinchilla]]. Baby GPT: 100 warmup steps to 1e-3, down to 1e-4 at step 5,000 [[config/train_shakespeare_char.py:27-33|min_lr = 1e-4]]. Finetuning: a constant 3e-5, because the weights already work and large steps would undo them [[config/finetune_shakespeare.py:23-25|finetune at constant LR]].\n\nA common mistake is shortening `max_iters` without shortening `lr_decay_iters`. The run then stops while the rate is still high, before the low-rate phase. The README's CPU recipe sets both to 2,000 for that reason [[README.md:88|correspondingly usually decay the learning rate to around max_iters]].","checkpoint":{"q":"With the baby config, what is the learning rate at iteration 50?","choices":["1e-3","About 5e-4","1e-4","0"],"answer":1,"explain":"Iteration 50 is inside the 100-step warmup, so it is 1e-3 × 51 / 101 ≈ 5.05e-4 [[train.py:233-234|return learning_rate * (it + 1) / (warmup_iters + 1)]]."}},{"id":"concepts-sampling","chapter":"concepts","title":"Sampling: how the model writes, one token at a time","tier":"core","minutes":4,"summary":"`generate` repeats one step: run the model on the text so far, take the scores for the next token, sharpen or flatten them with temperature, keep the top k, draw one token at random, append it.","body":"By the end you can explain what `--temperature` and `--top_k` do and why two samples differ.\n\n`GPT.generate` is a loop of `max_new_tokens` steps [[model.py:305-330|def generate(self, idx, max_new_tokens, temperature=1.0, top_k=None):]]:\n\n1. **Crop** the running sequence to its last `block_size` tokens; the model cannot see further back [[model.py:313-314|idx_cond = idx if idx.size(1) \u003c= self.config.block_size]].\n2. **Score** with one forward pass. Without targets, `forward` computes logits for the last position only, the only ones needed [[model.py:188-191|only forward the lm_head on the very last position]].\n3. **Temperature**: divide the logits by `temperature` [[model.py:318|logits = logits[:, -1, :] / temperature]]. Below 1 the gaps between scores widen and the favourite wins more often; above 1 they shrink and unlikely tokens get a chance. `sample.py` uses 0.8 [[sample.py:17|temperature = 0.8]].\n4. **Top-k**: every score below the k-th highest becomes −∞, so only k tokens can be drawn [[model.py:320-322|-float('Inf')]]. `sample.py` uses k = 200.\n5. **Draw**: softmax turns scores into probabilities and `torch.multinomial` picks one token at random in proportion [[model.py:324-326|idx_next = torch.multinomial(probs, num_samples=1)]].\n6. **Append** and repeat.\n\nStep 5's randomness is why the 10 default samples differ from each other; the fixed seed of 1337 is why rerunning `sample.py` reproduces the same 10 [[sample.py:19-27|torch.manual_seed(seed)]].\n\nEach step reruns the whole model on up to `block_size` tokens, recomputing everything for the earlier positions. Production systems cache those intermediate results (a \"KV cache\"); nanoGPT does not, which keeps `generate` to a dozen lines and makes long generations slower.\n\nFor the 65-character model, `top_k = 200` exceeds the vocabulary, so `min(top_k, vocab)` keeps all 65 [[model.py:321|min(top_k, logits.size(-1))]], a fix from `91d0251`.","checkpoint":{"q":"You run `sample.py` twice with the same flags and get identical text. Why?","choices":["top_k removes the randomness","The seed is fixed at 1337, so the random draws repeat","Temperature 0.8 is deterministic","The model caches its outputs between runs"],"answer":1,"explain":"`sample.py` seeds PyTorch's random generator before sampling [[sample.py:26-27|torch.manual_seed(seed)]], so `torch.multinomial` makes the same draws. Pass `--seed=` with another number for different text."}},{"id":"concepts-init","chapter":"concepts","title":"Initialisation: where the weights start","tier":"deep","minutes":4,"goals":["own","rebuild"],"summary":"All weights start as small random numbers (standard deviation 0.02), and the two projections in each block that write into the residual stream start even smaller, scaled by 1/√(2 × n_layer). A fresh model's loss should therefore be close to ln(vocab_size).","body":"By the end you can say what a fresh model's loss should be and what the special initialisation is for.\n\n`GPT.__init__` calls `self.apply(self._init_weights)`, which visits every module. Linear layers get weights from a normal distribution with mean 0 and standard deviation 0.02, and zero biases; embeddings get the same normal distribution [[model.py:162-168|def _init_weights(self, module):]]. Small weights give small logits, so the first softmax is nearly uniform and the first loss is close to ln(65) ≈ 4.17 for characters, or ln(50,304) ≈ 10.8 for GPT-2's vocabulary. If your first evaluation prints much more than that, look here first.\n\nThen a second pass finds every parameter named `c_proj.weight`, the output projections of attention and of the MLP, and re-draws it with standard deviation 0.02 / √(2 × n_layer) [[model.py:142-145|if pn.endswith('c_proj.weight'):]]. For the baby GPT that is 0.02 / √12 ≈ 0.0058. Each block adds two outputs into the residual stream, so a 6-layer model sums 12 of them; shrinking each one keeps their total from growing with depth. The comment credits the GPT-2 paper, and Karpathy's commit reports the effect was large: \"it makes a ton of difference and works much better than default\" (`f29a9ff`).\n\nThe weight tie used to matter here. `wte.weight` is set to `lm_head`'s tensor [[model.py:133-138|self.transformer.wte.weight = self.lm_head.weight]], and commit `43b37fd` chose that direction so that \"the final layer init is preserved\". At the time, PyTorch's default embedding initialisation (standard deviation 1) would otherwise have ended up in the output layer. Today `_init_weights` gives both modules the same 0.02, so the direction no longer changes anything. That last point is inferred from the dates: `43b37fd` is from 14 January 2023, the custom initialisation `f29a9ff` from 27 January."},{"id":"flows-end-to-end","chapter":"flows","title":"Follow the data: from Shakespeare's text to generated text","tier":"core","minutes":6,"show":[{"view":"flow","id":"shakespeare-end-to-end"}],"summary":"Text becomes ids on disk, ids become batches, batches train a GPT that is saved to `ckpt.pt`, and `sample.py` reloads it, encodes a prompt with the same vocabulary and decodes what the model writes.","body":"By the end you can name every function the quick start runs, in order. Step through the flow below for the code; this lesson is the thread that ties the steps together.\n\n**The vocabulary is the thread.** `prepare.py` invents it (65 characters, sorted) and saves it in `meta.pkl` [[data/shakespeare_char/prepare.py:54-61|'stoi': stoi,]]. `train.py` reads only its size, to shape the embedding table and the output layer [[train.py:137-155|meta_vocab_size if meta_vocab_size is not None else 50304]]. `sample.py` needs the full tables, to turn your prompt into ids and the output back into text. It finds them through the dataset name the checkpoint stored in its `config` [[sample.py:56-60|load_meta = os.path.exists(meta_path)]]. If `meta.pkl` is missing, `sample.py` falls back to GPT-2's tokenizer [[sample.py:69-74|No meta.pkl found, assuming GPT-2 encodings]]; GPT-2 ids run up to 50,256, so they do not fit a 65-row embedding table and the first forward pass fails.\n\n**The checkpoint is the hand-off.** Training writes one dict to `out-shakespeare-char/ckpt.pt` [[train.py:277-286|'model_args': model_args,]]. Its `model_args` let `sample.py` rebuild the identical architecture before loading the weights [[sample.py:37-46|gptconf = GPTConfig(**checkpoint['model_args'])]]; without them, the weights would have nowhere to go.\n\n**Two uses of one model.** In training, the model sees 64 windows of 256 characters and returns a loss. In sampling, it sees one growing sequence and returns scores for the last position only. It is the same `forward`, with and without targets [[model.py:184-193|if targets is not None:]].\n\n**Saving is selective here.** The Shakespeare config turns off `always_save_checkpoint`, because a 1 MB dataset overfits: validation loss bottoms out and climbs while training loss keeps falling, and you want the bottom [[config/train_shakespeare_char.py:9-10|we expect to overfit on this small dataset, so only save when val improves]].","checkpoint":{"q":"You copy `out-shakespeare-char/ckpt.pt` to a machine that has the repo but never ran `prepare.py`. What happens when you sample from it?","choices":["It works; the checkpoint contains everything","`sample.py` finds no `data/shakespeare_char/meta.pkl`, falls back to GPT-2 encodings, and the ids do not fit the 65-token model","It retrains the model","It downloads Shakespeare again"],"answer":1,"explain":"The checkpoint stores the dataset name, not the vocabulary [[sample.py:58-60|meta_path = os.path.join('data', checkpoint['config']['dataset'], 'meta.pkl')]]. Copy `meta.pkl` along with `ckpt.pt`."}},{"id":"flows-forward-pass","chapter":"flows","title":"One forward pass, with the shapes","tier":"core","minutes":6,"show":[{"view":"flow","id":"gpt-forward"}],"summary":"Ids of shape (B, T) become vectors of shape (B, T, C), keep that shape through every block, and leave as scores of shape (B, T, vocab_size). Cross-entropy against the targets turns them into one number, the loss.","body":"By the end you can track the tensor shapes through `GPT.forward` for the baby GPT. Step through the flow below for the code; this lesson keeps the numbers.\n\nThe training call is `model(X, Y)` with X and Y of shape `(64, 256)`, integers from 0 to 64 [[train.py:299-300|logits, loss = model(X, Y)]].\n\n- `idx`, the token ids: 64 × 256\n- `tok_emb + pos_emb`: 64 × 256 × 384\n- after each of the 6 blocks: still 64 × 256 × 384\n- q, k and v inside attention: 64 × 6 × 256 × 64 (batch, head, position, head size)\n- attention weights: 64 × 6 × 256 × 256\n- the MLP's hidden layer: 64 × 256 × 1,536\n- `logits`: 64 × 256 × 65\n- `loss`: one number\n\nThree things to notice.\n\n**The width never changes between blocks.** That is what lets you stack any number of them, and what makes the residual adds possible [[model.py:180-182|for block in self.transformer.h:]].\n\n**The attention table grows with T².** At GPT-2 size, T = 1,024 and 12 heads give 12.6M scores per sequence per layer. That is why the fused Flash kernel, which never stores the table, matters.\n\n**The loss flattens everything.** `logits.view(-1, 65)` and `targets.view(-1)` turn 64 × 256 predictions into 16,384 separate classification problems, and `F.cross_entropy` averages them [[model.py:186-187|logits.view(-1, logits.size(-1))]]. Every position in every window is a training example, which is why one batch carries so much signal.\n\nAt sampling time the same function runs with `targets=None` and returns logits of shape `(1, 1, 65)`: one sequence, last position only [[model.py:188-191|note: using list [-1] to preserve the time dim]].","checkpoint":{"q":"In the baby GPT, what is the shape of `logits` during training?","choices":["(64, 65)","(64, 256, 384)","(64, 256, 65)","(16384,)"],"answer":2,"explain":"`lm_head` maps each of the 64 × 256 positions from 384 channels to 65 scores [[model.py:133|self.lm_head = nn.Linear(config.n_embd, config.vocab_size, bias=False)]]. It is flattened to (16384, 65) only inside the loss call."}},{"id":"flows-train-step","chapter":"flows","title":"One training iteration, in order","tier":"core","minutes":7,"show":[{"view":"flow","id":"train-step"}],"summary":"An iteration sets the learning rate, sometimes evaluates and saves, runs forward and backward `gradient_accumulation_steps` times, clips the gradient, takes one AdamW step and frees the gradients. Everything else in `train.py` is setup for this loop.","body":"By the end you can explain the order of operations inside `while True:` and why it is that order. Step through the flow below for each line; the order is the lesson.\n\nThree words first. A **micro-step** is one forward and backward pass on one small batch; with **gradient accumulation**, several micro-steps add their gradients together before a single weight update, as if they were one big batch. **Autocast** runs the maths in 16-bit floats where that is safe, for speed. **AdamW** is the optimizer: the rule that turns gradients into weight changes.\n\n1. **Learning rate first** [[train.py:257-260|lr = get_lr(iter_num) if decay_lr else learning_rate]], so the step about to happen uses this iteration's value.\n2. **Evaluate before training**, on iterations divisible by `eval_interval` (250 for the baby GPT) [[train.py:263-264|losses = estimate_loss()]]. Iteration 0 is evaluated too, which gives you the untrained loss; saving is skipped at iteration 0.\n3. **Accumulate.** Each micro-step runs the forward pass under autocast, divides the loss, fetches the next batch, then runs backward [[train.py:292-305|scaler.scale(loss).backward()]]. The fetch sits *between* forward and backward on purpose: the GPU is still busy with queued work, so the CPU's slicing costs nothing. With `gradient_accumulation_steps = 1`, as in the baby config, the loop runs once.\n4. **Clip, then step.** Gradients are unscaled, their combined length is capped at 1.0, and AdamW updates the weights [[train.py:306-312|torch.nn.utils.clip_grad_norm_(model.parameters(), grad_clip)]]. Clipping before the step means one freak batch cannot throw the weights far.\n5. **Free memory.** `zero_grad(set_to_none=True)` drops the gradient tensors instead of filling them with zeros [[train.py:314|optimizer.zero_grad(set_to_none=True)]].\n6. **Log.** Every `log_interval` iterations it prints loss, milliseconds and MFU. `loss.item()` makes the CPU wait for the GPU, so it only happens on log iterations [[train.py:320-323|note: this is a CPU-GPU sync point]].\n\nWhat is *not* in the loop matters too. There are no epochs, no shuffling pass and no early stopping: it ends when `iter_num > max_iters` [[train.py:331-333|termination conditions]]. Dropout stays on throughout; only `estimate_loss` switches the model to eval mode, and back again when it is done [[train.py:218-227|model.train()]].","checkpoint":{"q":"Why does `get_batch('train')` come between the forward pass and `backward()`?","choices":["`backward()` needs the next batch","The GPU is still working through the queued forward pass, so loading the next batch on the CPU overlaps with it and costs no extra time","To shuffle the data","DDP requires it"],"answer":1,"explain":"The comment says it: \"immediately async prefetch next batch while model is doing the forward pass on the GPU\" [[train.py:302-303|immediately async prefetch next batch]]. Commit `3fd4c0c` puts the saving at \"about 1ms lol\"."}},{"id":"flows-load-gpt2","chapter":"flows","title":"Loading GPT-2's weights from Hugging Face","tier":"standard","minutes":6,"goals":["ship","own"],"show":[{"view":"flow","id":"load-gpt2"}],"summary":"`GPT.from_pretrained` builds an empty nanoGPT with GPT-2's exact shape, downloads OpenAI's checkpoint through `transformers`, and copies every tensor across by name, transposing the four kinds of weight OpenAI stored as Conv1D.","body":"By the end you know why nanoGPT can load OpenAI's weights at all, and the one trick it needs.\n\nIt works because `model.py` copies GPT-2's design down to the parameter names: `transformer.h.0.attn.c_attn.weight` means the same tensor in both implementations, as do `ln_1`, `mlp.c_fc` and `lm_head`. The import is a dictionary walk, not a translation. Step through the flow below; these are the parts that need care.\n\n**The shape is fixed by name.** You choose `gpt2`, `gpt2-medium`, `gpt2-large` or `gpt2-xl`, and that sets layers, heads and width [[model.py:216-221|'gpt2':         dict(n_layer=12, n_head=12, n_embd=768)]]. Vocabulary 50,257, context 1,024 and biases are forced, since that is how OpenAI trained them. Only dropout may be overridden [[model.py:209-211|only dropout can be overridden see more notes below]].\n\n**Not everything in a state dict is a weight.** Both sides contain attention-mask buffers (`.attn.bias`, `.attn.masked_bias`). They are filtered out, and then the two key counts must match exactly [[model.py:242-248|assert len(sd_keys_hf) == len(sd_keys)]].\n\n**The transpose.** OpenAI's original code used a `Conv1D` module that stores its weight as (in, out), while `nn.Linear` stores (out, in). For the four kinds of matrix that went through Conv1D, nanoGPT copies the transpose; everything else is copied as is, with a shape assertion on every tensor [[model.py:245-259|we have to transpose these weights when we import them]].\n\n**After loading.** `train.py` copies the forced values back into `model_args`, so a later `resume` rebuilds the right shape [[train.py:186-188|read off the created config params]], and it can shorten the context with `crop_block_size` if you asked for a smaller `block_size`.\n\nWhere it is used: `config/eval_gpt2*.py` for baselines, `config/finetune_shakespeare.py` for finetuning, and `sample.py --init_from=gpt2-xl` to generate directly.","checkpoint":{"q":"You add a new learnable tensor to `CausalSelfAttention`, then run with `init_from='gpt2'`. Where does it fail?","choices":["In tiktoken","At the assertion that nanoGPT and Hugging Face have the same number of keys","In the optimizer","Nowhere; the new tensor just stays random"],"answer":1,"explain":"The key lists are compared before any copying [[model.py:248|mismatched keys]]. A new parameter adds one key per layer on nanoGPT's side only."}},{"id":"data-bin-memmap","chapter":"data","title":"Token files and the memmap batch sampler","tier":"standard","minutes":5,"goals":["ship","own","rebuild"],"show":[{"view":"data"}],"summary":"`train.bin` and `val.bin` are headerless arrays of uint16 ids. `get_batch` maps the file into memory, picks `batch_size` random offsets, and copies out windows as inputs and one-token-shifted targets.","body":"By the end you can read and write nanoGPT's data format yourself and say what one batch costs.\n\n**Format.** There is no format: `np.array(ids, dtype=np.uint16).tofile(path)` writes 2 bytes per token, back to back [[data/shakespeare_char/prepare.py:48-52|val_ids.tofile(os.path.join(os.path.dirname(__file__), 'val.bin'))]]. Nothing in the file records the dtype; you have to know it. `np.fromfile` or `np.memmap` with `dtype=np.uint16` reads it back. OpenWebText is too big to build as one list in memory, so its script creates the output file as a writable memmap of the final size and fills it shard by shard [[data/openwebtext/prepare.py:59-74|arr = np.memmap(filename, dtype=dtype, mode='w+', shape=(arr_len,))]].\n\n**Reading a batch.** `get_batch(split)` does four things.\n\n1. Opens the right file as a read-only memmap: a file you can index like an array, where the OS reads only the pages you touch [[train.py:119-122|data = np.memmap(os.path.join(data_dir, 'val.bin'), dtype=np.uint16, mode='r')]].\n2. Draws `batch_size` random start positions anywhere below `len(data) - block_size` [[train.py:123|ix = torch.randint(len(data) - block_size, (batch_size,))]].\n3. Copies `data[i:i+block_size]` for x and `data[i+1:i+1+block_size]` for y, converts them to int64 (what `nn.Embedding` and `cross_entropy` expect) and stacks them [[train.py:124-125|astype(np.int64)]].\n4. On CUDA, pins the CPU memory so the copy to the GPU can run asynchronously [[train.py:126-128|pin arrays x,y, which allows us to move them to GPU asynchronously]].\n\n**Cost.** One GPT-2 micro-batch touches 12 windows of 1,025 tokens, about 24 KB of a 17 GB file. Windows start anywhere, mid-word and across document boundaries; in OpenWebText the end-of-text token marks those boundaries.\n\n**Why reopen it every call.** Keeping one memmap open let resident memory grow towards the size of the whole file over a long run; reopening it per batch fixed that at negligible cost [[train.py:117-118|We recreate np.memmap every batch to avoid a memory leak]] (`5156fef`)."},{"id":"data-checkpoint","chapter":"data","title":"The checkpoint dict and resuming a run","tier":"standard","minutes":5,"goals":["ship","own"],"summary":"`ckpt.pt` is one dict: model weights, AdamW state, the architecture (`model_args`), the iteration, the best validation loss and every setting. `init_from='resume'` rebuilds the run from it; `sample.py` uses only the weights and the architecture (and the dataset name).","body":"By the end you know what is in `ckpt.pt`, what resuming restores, and two oddities to watch for.\n\n**What is saved.** At an evaluation that passes the save test, the main process writes [[train.py:277-284|'best_val_loss': best_val_loss,]]:\n\n- `model`: every weight, as a state dict (name → tensor).\n- `optimizer`: AdamW's two running averages for every weight, plus its step counts. This is the bulky part. For GPT-2 124M the notebook estimates 1.49 GB for weights plus optimizer, against a real file of 1,542,470,366 bytes [[transformer_sizing.ipynb:136-140|measured_bytes = 1542470366]].\n- `model_args`: the seven `GPTConfig` values.\n- `iter_num` and `best_val_loss`.\n- `config`: every simple setting, from `dataset` to `learning_rate` [[train.py:76-78|config = {k: globals()[k] for k in config_keys}]].\n\n**Resuming.** `--init_from=resume` loads the file, forces the six shape values (`n_layer`, `n_head`, `n_embd`, `block_size`, `bias`, `vocab_size`) to match the checkpoint while letting `dropout` follow your flags, loads the weights and the optimizer state, and continues counting from `iter_num` [[train.py:158-180|for k in ['n_layer', 'n_head', 'n_embd', 'block_size', 'bias', 'vocab_size']:]]. It then sets `checkpoint = None`; before that fix (`4ac2e8c`), the loaded tensors stayed alive and resuming could run out of GPU memory [[train.py:200-202|checkpoint = None # free up memory]].\n\n**Oddity 1: `_orig_mod.`.** With `torch.compile` on, saved keys look like `_orig_mod.transformer.h.0.…`. Both loaders strip the prefix, under a comment admitting the cause was unknown [[train.py:172-177|unwanted_prefix = '_orig_mod.']]. The likely cause: `raw_model` is the compiled wrapper, which keeps the real model in an attribute named `_orig_mod` (inferred).\n\n**Oddity 2: the \"best\" loss.** With `always_save_checkpoint = True`, the default, every evaluation saves and overwrites `best_val_loss` with the current value, better or worse [[train.py:274-275|if losses['val'] \u003c best_val_loss or always_save_checkpoint:]]. Only with `False`, as in both Shakespeare configs, does `ckpt.pt` hold the best model.","checkpoint":{"q":"You resume with `--init_from=resume --n_layer=24` from a 12-layer checkpoint. How many layers does the model have?","choices":["24","12: resume overwrites the shape settings with the checkpoint's model_args","A type error stops the run","Whatever train.py's default is"],"answer":1,"explain":"The six shape keys are copied from the checkpoint over whatever you passed [[train.py:164-167|force these config attributes to be equal otherwise we can't even resume training]]; only settings like dropout follow your flags."}},{"id":"files-model-py","chapter":"files","title":"model.py, top to bottom","tier":"standard","minutes":5,"goals":["ship","own"],"show":[{"view":"file","path":"model.py"}],"summary":"`model.py` reads in the order it builds: small layers first, then the config, then `GPT` with its forward pass and five utilities. Knowing which block of lines is which tells you where any change goes.","body":"By the end you can open `model.py` and jump to the right 20 lines for any question. Line ranges, and what you would change there:\n\n- **18–27** `LayerNorm`: change the normalisation, for example to RMSNorm.\n- **29–76** `CausalSelfAttention`: positions inside attention, caching, masking.\n- **78–92** `MLP`: the activation or the 4× width.\n- **94–106** `Block`: how the two sub-layers are arranged.\n- **108–116** `GPTConfig`: add an architectural setting.\n- **118–168** `GPT.__init__` and `_init_weights`: modules, weight tying, initialisation.\n- **170–193** `GPT.forward`: the loss or the outputs.\n- **195–261** `crop_block_size` and `from_pretrained`: loading other checkpoints.\n- **263–287** `configure_optimizers`: weight-decay groups or another optimizer.\n- **289–303** `estimate_mfu`: the GPU that MFU is measured against.\n- **305–330** `generate`: the sampling strategy.\n\nFour facts that cut across the table:\n\n- Nothing in `model.py` reads files, settings or environment variables. Everything arrives through `GPTConfig` or method arguments, which is why `bench.py` can drive it with random data [[bench.py:44-48|alternatively, if fixed data is desired to not care about data loading]].\n- `configure_optimizers` takes `device_type` only to decide on fused AdamW [[model.py:280-285|use_fused = fused_available and device_type == 'cuda']].\n- `estimate_mfu` divides by an A100's 312 TFLOPS [[model.py:299-302|A100 GPU bfloat16 peak flops is 312 TFLOPS]]; on any other GPU the percentage is relative to an A100.\n- `generate` is wrapped in `@torch.no_grad()` [[model.py:305-306|@torch.no_grad()]], so calling it mid-training builds no gradient graph. Call `model.eval()` first, as its docstring advises, or dropout stays on while you sample."},{"id":"files-train-py","chapter":"files","title":"train.py, section by section","tier":"standard","minutes":6,"goals":["ship","own"],"show":[{"view":"file","path":"train.py"}],"summary":"`train.py` is a script of eight sections run in order: defaults, overrides, device and DDP setup, the batch function, model creation, optimizer and compile, two helpers, and the loop. Only three of its pieces are functions.","body":"By the end you know where in `train.py` to make a change and what the change can depend on.\n\n1. **Defaults** (lines 33–74): every setting as a global, with GPT-2 124M values [[train.py:33-34|default config values designed to train a gpt2 (124M) on OpenWebText]].\n2. **Overrides** (76–78): `configurator.py` runs, then `config` is snapshotted.\n3. **Setup** (81–112): DDP or single process, tokens per iteration, `out_dir`, seed, TF32, the autocast context [[train.py:101-102|tokens per iteration will be]].\n4. **Batches** (114–131): `get_batch`, the whole data pipeline.\n5. **Model** (133–193): read `meta.pkl`, then one of three branches, `scratch`, `resume` or `gpt2*`, then an optional crop and `.to(device)` [[train.py:146-149|if init_from == 'scratch':]].\n6. **Optimizer, compile, DDP** (195–212). The optimizer is created from the plain model before `torch.compile` and DDP wrap it; the wrappers share the same parameter tensors, so it keeps working afterwards.\n7. **Helpers** (214–247): `estimate_loss`, `get_lr`, optional `wandb.init`.\n8. **Loop** (249–333), and `destroy_process_group()` at the end for DDP.\n\nBecause it is a script, the helpers read globals directly: `estimate_loss` uses `model`, `eval_iters`, `ctx` and `get_batch` from module scope [[train.py:214-228|def estimate_loss():]]. That is convenient, and it means you cannot import `train.py` from another file without running a training job.\n\n**Adding a setting** is one line in section 1. If its default is an int, float, bool or string, it becomes overridable with `--name=value` and is saved in every checkpoint's `config` automatically [[train.py:76|isinstance(v, (int, float, bool, str))]]. A setting whose default is `None` or a list is left out of `config`, and a `None` default cannot be overridden from the command line at all."},{"id":"files-supporting-scripts","chapter":"files","title":"The supporting files: what to open for which job","tier":"deep","minutes":4,"goals":["ship","own"],"show":[{"view":"files","paths":["sample.py","configurator.py","bench.py","data/shakespeare_char/prepare.py","data/shakespeare/prepare.py","data/openwebtext/prepare.py","transformer_sizing.ipynb","scaling_laws.ipynb"]}],"summary":"Everything outside `model.py` and `train.py` is short and single-purpose: a sampler, a settings snippet, a benchmark, three data recipes, seven config files and two notebooks of arithmetic.","body":"By the end you know which small file to open for a given job.\n\n- **Generate text**: `sample.py`, 89 lines. All its knobs are globals at the top: `init_from`, `out_dir`, `start`, `num_samples`, `max_new_tokens`, `temperature`, `top_k`, `seed`, `device` [[sample.py:12-22|max_new_tokens = 500]].\n- **Understand an override error**: `configurator.py`, 47 lines, executed rather than imported.\n- **Measure speed**: `bench.py`, 117 lines. A GPT-2 124M-shaped model, 10 warm-up and 20 timed steps, ms/iter and MFU at the end, CUDA only [[bench.py:100-117|time per iteration:]].\n- **Prepare your own data**: copy `data/shakespeare_char/` for character-level text, `data/shakespeare/` for small data with GPT-2 tokens, or `data/openwebtext/` for a large Hugging Face dataset.\n- **Pick settings**: `config/` holds 7 assignment files. `train_shakespeare_char.py`, `train_gpt2.py` and `finetune_shakespeare.py` are full recipes; the four `eval_gpt2*.py` files differ only in `init_from` and a comment [[config/eval_gpt2_xl.py:8|init_from = 'gpt2-xl']].\n- **Estimate cost before training**: `transformer_sizing.ipynb` (parameters, checkpoint size, FLOPs, days of training) and `scaling_laws.ipynb` (compute-optimal model size). Nothing runs them; they are worked arithmetic with saved outputs.\n\nWhat is missing is also information: no `requirements.txt` or `setup.py` (the README's `pip install` line is the dependency list), no tests, and no CI configuration."},{"id":"built-milestones","chapter":"built","title":"Rebuild it yourself: the order to write nanoGPT","tier":"standard","minutes":7,"goals":["rebuild","gist"],"show":[{"view":"milestones"}],"summary":"Build it in the order data flows: a prepare script, a batch sampler, the four layer classes, the GPT, the training loop, sampling, and only then the speed and scale features. Each milestone ends with something you can run and check.","body":"By the end you have a plan for writing your own nanoGPT, with a check at every stage. The milestones below each come with a hands-on task.\n\nThe order follows the dependencies. Data comes first because nothing in it depends on the model. The model comes before the loop because the loop calls it. Speed features come last because none of them changes *what* is learned: `torch.compile`, mixed precision, Flash attention, fused AdamW and DDP can each be switched off and the code still trains [[train.py:70-74|compile = True]]. The repo's history agrees: the first commit already had a working model, loop and sampler (`fe80428`), and much of the speed work (Flash attention, fused AdamW, vocabulary padding) came about five weeks later.\n\nThree checks catch most mistakes early.\n\n1. **Shapes.** Every block maps `(B, T, C)` to `(B, T, C)`. Assert it.\n2. **Initial loss.** A fresh model should score about ln(vocab_size), 4.17 for 65 characters. Far above means bad initialisation. Far below means the model can see its targets, usually a broken causal mask [[model.py:68|masked_fill]].\n3. **Overfit one batch.** Train on a single fixed batch for a few hundred steps; the loss should head towards zero. If it does not, the bug is in the loop or the gradients, not the data.\n\nReference numbers while you build: the baby GPT is 6 layers × 6 heads × 384 channels with dropout 0.2 [[config/train_shakespeare_char.py:21-25|dropout = 0.2]], and the README's results to compare against are 1.4697 validation loss on a GPU or about 1.88 with the small CPU settings.\n\nFor a guided version, the README points to Karpathy's \"Zero To Hero\" video series, whose GPT episode builds this model step by step [[README.md:226|Zero To Hero series]].","checkpoint":{"q":"Your from-scratch character model's very first validation loss is 0.3. What is the most likely bug?","choices":["The learning rate is too high","The causal mask is broken, so positions can see the tokens they should predict","The vocabulary is too small","Dropout is too high"],"answer":1,"explain":"An untrained model cannot beat a uniform guess, ln(65) ≈ 4.17, unless the answer leaks into the input. In GPT the only thing that hides the future is the mask [[model.py:68|float('-inf')]], or `is_causal=True` on the fused path."}},{"id":"built-history","chapter":"built","title":"How nanoGPT grew: nine busy weeks, then fixes","tier":"deep","minutes":5,"goals":["own","gist"],"show":[{"view":"timeline"}],"summary":"Most of nanoGPT was written between 28 December 2022 and mid-February 2023, in public, with commit messages that explain each change. After that it took contributor fixes until it was marked deprecated in November 2025.","body":"By the end you can read the git log as a design document, and you know which parts are oldest.\n\nThe first commit is titled \"first very bad commit\" and already contains the shape of today's repo: a 267-line `model.py`, a 191-line `train.py`, `sample.py` and the OpenWebText preparation (`fe80428`). Within two days came the configurator, a benchmark script, DDP and resuming. `torch.compile` was turned on by default on day three, for \"almost 1.8X improvement in throughput\" (`5a725d9`).\n\nJanuary 2023 made it usable by others. Character-level Shakespeare and the baby-GPT config arrived on 11 January (`d17350a`), and the next commit begins \"oh no nanoGPT is trending\" (`bb49751`). Weight tying, gradient accumulation and multi-node instructions followed.\n\nLate January to early February was the speed push, each change with a measurement in its message: grad clipping (`3cb3fc0`), the GPT-2 initialisation, optional biases at \"about 6% faster\" (`e808a67`), Flash attention (`ae06d0b`), fused AdamW (`e170e40`), prefetching (`3fd4c0c`) and the vocabulary padding to 50,304 for \"about 25% faster\" (`77e7e04`) [[model.py:111|vocab_size: int = 50304]].\n\nFrom March 2023 the log is mostly merged pull requests (across the whole history, 36 people besides Karpathy wrote 48 commits): device handling, Windows and macOS fixes, the `np.memmap` leak (`5156fef`) and a non-zero first learning rate (`dc81cb3`) [[train.py:233-234|return learning_rate * (it + 1) / (warmup_iters + 1)]].\n\nThe last commit, on 12 November 2025, adds the deprecation note [[README.md:9|nanoGPT has a new and improved cousin called]] (`3adf61e`).\n\nReading tip: `git log --format='%h %s' -- train.py` gives you the reason behind almost every line, because Karpathy wrote his reasoning, doubts included, into the messages."},{"id":"why-simplicity","chapter":"why","title":"Why it is built this way: fewer lines over convention","tier":"standard","minutes":5,"goals":["gist","own","rebuild"],"show":[{"view":"decisions"}],"summary":"Most of nanoGPT's unusual choices trade conventional structure for fewer lines: globals instead of a config object, `exec` instead of argparse, memmap slicing instead of a DataLoader, an attribute toggle instead of `no_sync()`. Each is documented in a commit or a comment, often with the author's own doubts.","body":"By the end you can explain the repo's odd-looking choices as deliberate, and say what each costs.\n\nThe goal is in the README: plain, readable code, with `train.py` as \"a ~300-line boilerplate training loop\" and `model.py` as \"a ~300-line GPT model definition\" [[README.md:13|The code itself is plain and readable]]. Every decision below serves that line count.\n\n**Settings as globals.** Instead of a config class or argparse, defaults are module variables and `configurator.py` is `exec`'d into them. The docstring calls it \"Probably a terrible idea\" and gives the reason: no `config.` prefix on every variable [[configurator.py:12-14|I just really dislike configuration]].\n\n**No DataLoader.** Batches are random slices of one memmapped file, prefetched while the GPU works. The commit asks \"who needs a dataloader?\" (`3fd4c0c`) [[train.py:114|poor man's data loader]].\n\n**No context manager for DDP accumulation.** The loop sets `require_backward_grad_sync` directly, because `no_sync()` \"bloats the code and forces us to repeat code\" [[train.py:294-298|the official way to do this is with model.no_sync() context manager]].\n\n**One file per role.** The whole model is in `model.py` and the whole loop in `train.py`; there is no `utils.py`, no trainer class, no callbacks. To change behaviour you edit the loop.\n\nThe common cost: these choices make the code easy to read and hard to reuse. You cannot import `train.py`, configure it from another program or test parts of it in isolation. That fits a repository meant to be read and forked. The decision records below list each choice with its evidence and trade-off, marked documented or inferred.","checkpoint":{"q":"Why does `train.py` set `model.require_backward_grad_sync` instead of using DDP's `no_sync()` context manager?","choices":["`no_sync()` does not exist in PyTorch","To avoid wrapping and duplicating the forward/backward code in a `with` block; the comment says `no_sync()` only toggles this same attribute","It is measurably faster","To support CPU training"],"answer":1,"explain":"The comment explains it: Karpathy read the context manager's source, saw it only toggles this variable, and set it directly [[train.py:295-297|looking at the source of that context manager, it just toggles this variable]]."}},{"id":"why-speed","chapter":"why","title":"Why it is fast: the measured speed changes","tier":"deep","minutes":6,"goals":["own","rebuild"],"summary":"nanoGPT's speed comes from a short list of changes, most with a measurement in the commit: torch.compile (~250 → 135 ms/iter), Flash attention, vocabulary padding to 50,304 (~25%), no biases (~6%), fused AdamW, TF32, and overlapping data loading with GPU work.","body":"By the end you can name each speed trick, where it is in the code, and what it bought.\n\n- **`torch.compile`**: one line, `model = torch.compile(model)` [[train.py:204-208|model = torch.compile(model) # requires PyTorch 2.0]]. The README measured ~250 ms to 135 ms per iteration [[README.md:209|cutting down iteration time from ~250ms / iter to 135ms / iter]].\n- **Flash attention**: the fused `scaled_dot_product_attention` kernel never stores the T × T score table [[model.py:62-64|efficient attention using Flash Attention CUDA kernels]] (`ae06d0b`).\n- **Vocabulary padding**: 50,257 → 50,304, a multiple of 64, \"about 25% faster\" because the output layer was \"consuming about 40% of latency\" (`77e7e04`) [[model.py:111|padded up to nearest multiple of 64 for efficiency]].\n- **No biases**: `bias = False` in `train.py`, measured \"about 6% faster\" with \"identical results\" (`e808a67`, `0e90ee9`) [[train.py:56|do we use bias inside LayerNorm and Linear layers?]].\n- **Fused AdamW** on CUDA (`e170e40`) [[model.py:280-284|fused_available = 'fused' in inspect.signature(torch.optim.AdamW).parameters]].\n- **bfloat16 autocast and TF32** [[train.py:107-112|torch.backends.cudnn.allow_tf32 = True]].\n- **Prefetching**: the next batch is sliced while the GPU runs the forward pass (`3fd4c0c`).\n- **Last-position-only logits** at inference (`8f85b83`).\n\n**How to measure your own change.** `bench.py` runs the training step alone and prints time per iteration and MFU [[bench.py:112-117|MFU: {mfu*100:.2f}%]]. MFU (model FLOPs utilization) compares the FLOPs your model needs per second, estimated as 6N + 12·L·H·Q·T per token from the PaLM paper, with an A100's 312 TFLOPS peak [[model.py:289-303|see PaLM paper Appendix B as ref]]. The sizing notebook measured 37% on one A100 for an early configuration, [[transformer_sizing.ipynb:307|fraction of A100 used: 37.14%]], and says it would prefer \"somewhere around 50%+\" [[transformer_sizing.ipynb:330|somewhere around 50%+]].\n\nNot every switch is free: `bias=False` makes from-scratch models a different shape from OpenAI's, and `compile` adds about a minute at start-up [[train.py:206|compiling the model... (takes a ~minute)]].","checkpoint":{"q":"Why does padding the vocabulary from 50,257 to 50,304 make training faster, even though it adds work?","choices":["It reduces the number of tokens","GPU matrix kernels run fastest on dimensions that are multiples of 64, and the output layer is the single largest matrix multiply","It shrinks the embedding table","It turns on Flash attention"],"answer":1,"explain":"The commit (`77e7e04`) says the last layer consumed about 40% of latency because of its very high channel count; 50,304 is 64 × 786 [[model.py:111|GPT-2 vocab_size of 50257, padded up to nearest multiple of 64]]."}},{"id":"care-gotchas","chapter":"care","title":"Handle with care: the traps you will hit first","tier":"core","minutes":4,"show":[{"view":"risks"}],"summary":"Run scripts from the repo root, add `--device=cpu --compile=False` without an NVIDIA GPU, write floats with a decimal point in flags, and know that the default checkpointing overwrites `ckpt.pt` at every evaluation. There are no tests, and the repo is no longer maintained.","body":"By the end you can avoid the five problems newcomers hit most, and you know where the rest are listed.\n\n1. **Working directory.** `train.py` opens `configurator.py` and `data/\u003cdataset>/` by relative path [[train.py:77|exec(open('configurator.py').read())]]. Run every script from the repo root.\n2. **Hardware defaults.** `device = 'cuda'` and `compile = True` [[train.py:72-74|compile = True]]. On a laptop, a Mac or Windows, pass `--device=cpu` (or `mps`) and `--compile=False`.\n3. **Typed flags.** `--learning_rate=1` fails: the value parses as an int and the default is a float [[configurator.py:41-42|assert type(attempt) == type(globals()[key])]]. Write `1.0`.\n4. **Checkpoint overwrites.** With the default `always_save_checkpoint = True`, every evaluation overwrites `ckpt.pt` and resets `best_val_loss` to the latest value, even if it is worse [[train.py:274-275|if losses['val'] \u003c best_val_loss or always_save_checkpoint:]]. For anything you care about, set it to `False` (the Shakespeare configs do) or save under new names.\n5. **Character prompts.** The Shakespeare character model knows 65 characters; a prompt with any other (most digits, accents, braces) crashes `sample.py` with a `KeyError` [[sample.py:67|stoi[c] for c in s]].\n\nTwo background facts. There are **no automated tests**; correctness rests on inline asserts and on the published loss numbers. And the project is **deprecated** in favour of nanochat [[README.md:9|It is very likely you meant to use/find nanochat instead]], so PyTorch warnings such as the `torch.cuda.amp.GradScaler` deprecation will not be fixed upstream.\n\nThe full risk list below adds the smaller ones: approximate logged numbers, `bench.py` needing CUDA, the GPU count that must divide 40, OpenWebText's disk needs and a GELU variant that differs slightly from OpenAI's.","checkpoint":{"q":"You train with `max_iters=20000` and leave `always_save_checkpoint` at its default. The loss diverges at iteration 18,000. What is in `ckpt.pt` at the end?","choices":["The best model seen during the run","The weights from the last evaluation, after the divergence","Nothing; diverged runs are not saved","One checkpoint per evaluation"],"answer":1,"explain":"With the default, every evaluation saves to the same path [[train.py:286|torch.save(checkpoint, os.path.join(out_dir, 'ckpt.pt'))]], so the last save wins. Set `always_save_checkpoint = False` to keep the best."}},{"id":"care-reading-numbers","chapter":"care","title":"Reading the numbers train.py prints","tier":"standard","minutes":5,"goals":["own","ship"],"summary":"Trust the `step` lines, which average `eval_iters` batches per split. The `iter` lines show a one-micro-batch loss estimate, a time that includes evaluation on eval iterations, and an MFU measured against an A100.","body":"By the end you can tell which printed number to use for which decision.\n\n**`step N: train loss X, val loss Y`.** Printed every `eval_interval` iterations by the main process. Each value is the mean over `eval_iters` random batches (200 by default) in eval mode, without dropout [[train.py:216-228|losses = torch.zeros(eval_iters)]]. This is your comparison number between runs. It is still an estimate: batches are random, so two evaluations of the same weights differ slightly. The eval configs raise `eval_iters` to 500 for steadier baselines [[config/eval_gpt2.py:5|use more iterations to get good estimate]].\n\n**`iter N: loss X, time Tms, mfu M%`.** Printed every `log_interval` iterations.\n\n- *loss* is the loss of the last micro-batch only, multiplied back by `gradient_accumulation_steps`, and computed with dropout on. The code calls it an approximation [[train.py:321-323|approximating the true total loss (exact would have been a sum)]]. Expect it to jump around.\n- *time* is wall-clock time since the previous iteration. On iterations that also ran `estimate_loss`, it includes the evaluation [[train.py:316-319|dt = t1 - t0]].\n- *mfu* is a running average, starting after 5 iterations [[train.py:324-326|let the training loop settle a bit]], of FLOPs achieved against a hard-coded A100 peak. On a different GPU, or on CPU, the percentage is not meaningful as is.\n\n**Start-up lines.** `tokens per iteration will be: …` confirms your effective batch [[train.py:101-102|tokens per iteration will be]]. `number of parameters: …M` excludes the position embedding. `num decayed parameter tensors …` shows the weight-decay split. `using fused AdamW: …` says whether the fast optimizer path is on.\n\n**What \"good\" looks like.** For the baby GPT, val loss should fall from about 4.2 towards 1.47. For GPT-2 124M on OpenWebText, about 2.85 after 600,000 iterations; OpenAI's own checkpoint scores about 3.11 there.","checkpoint":{"q":"Your `iter` loss jumps by ±0.1 from line to line, while the `step` val losses fall smoothly. Which should you use to compare two runs?","choices":["The `iter` loss, because it is printed more often","The `step` val loss, averaged over `eval_iters` batches with dropout off","MFU","Time per iteration"],"answer":1,"explain":"`estimate_loss` averages many batches per split in eval mode [[train.py:219-226|out[split] = losses.mean()]]; the `iter` loss is one micro-batch with dropout on."}},{"id":"practice-exercises","chapter":"practice","title":"Your first changes, from easy to hard","tier":"standard","minutes":4,"goals":["ship","rebuild"],"show":[{"view":"exercises"}],"summary":"Seven exercises take you from turning sampling dials to adding rotary embeddings and the repo's first regression test. Each names the files to touch and how to know it worked.","body":"By the end you have a sequence of real changes to make, each building on the previous one.\n\nDo them in order; each one exercises a different part of the code.\n\n1. **Sampling dials** (easy): no code, only flags on `sample.py`. You learn what temperature and top-k do to real output.\n2. **Your own text** (easy): a new `data/\u003cname>/` folder copied from the character dataset. You learn the data contract: `train.bin`, `val.bin`, `meta.pkl`.\n3. **Best and latest checkpoints** (medium): a few lines in the evaluation block of `train.py`. You fix the `best_val_loss` overwrite listed under Handle with care.\n4. **Gradient-norm logging** (medium): one of the README's open to-dos [[README.md:211-220|Additional logging around network health]]. You learn the clip and step part of the loop.\n5. **Tolerant character sampling** (medium): `sample.py`'s encoder. You learn the tokenizer hand-off between scripts.\n6. **Rotary position embeddings** (hard): another README to-do, inside `CausalSelfAttention`. You learn attention's shapes well enough to change them.\n7. **A regression test against Hugging Face's GPT-2** (hard): the first file in a `tests/` folder. You learn `from_pretrained` and leave the repo safer than you found it.\n\nFor every change, keep one fixed baseline: the Shakespeare config with a fixed seed and the same number of iterations. Compare the `step` val loss lines, not the `iter` lines."}],"decisions":[{"title":"Settings are plain globals, overridden by exec-ing a configurator","choice":"Each script declares its settings as module-level variables, then runs `exec(open('configurator.py').read())`, which executes config files and applies `--key=value` flags straight into `globals()` [[configurator.py:20-45|globals()[key] = attempt]].","why":"Karpathy wanted to avoid configuration frameworks and an `args.` or `config.` prefix on every variable [[configurator.py:12-14|I just really dislike configuration]]. The commit that moved it into its own file calls the result \"very gross by standard convention but also quite simple and functional. *ducks*\" (`d562b3e`).","tradeoff":"No help text, no validation beyond a type check, scripts must run from the repo root, and editors cannot tell which globals a config file changes. In exchange, a config file is just Python and every setting is visible at the top of `train.py`.","evidence":"`5d2b480` (\"a lightweight configurator that may be a terrible mistake lol\"), `d562b3e`, docstring [[configurator.py:1-15|Poor Man's Configurator. Probably a terrible idea.]]","source":"documented"},{"title":"No DataLoader: random windows from a memmap, prefetched during the GPU step","choice":"`get_batch` samples `batch_size` random offsets into one flat token file and slices them [[train.py:114-131|poor man's data loader]]. The next batch is fetched right after the forward pass is queued [[train.py:302-303|immediately async prefetch next batch]].","why":"The commit message: \"who needs a dataloader? overlap the prefetching of the next batch with GPU compute, hiding the data loading latency entirely. this saves about 1ms lol\" (`3fd4c0c`).","tradeoff":"Sampling is with replacement, so there are no exact epochs and some windows are seen twice before others are seen once. With 9 billion tokens that hardly matters; on a tiny dataset it adds noise.","evidence":"`3fd4c0c`","source":"documented"},{"title":"Re-open the memmap on every batch","choice":"`get_batch` creates a new `np.memmap` each call instead of keeping one open [[train.py:117-122|We recreate np.memmap every batch to avoid a memory leak]].","why":"A long-lived memmap kept every page it had touched resident, so RAM use grew to the size of the dataset over a run. The fix's author measured the overhead of reopening as negligible (`5156fef`).","tradeoff":"A system call per batch, in exchange for flat memory. `bench.py` still opens it once [[bench.py:33-36|train_data = np.memmap(]], which is fine for a 30-step benchmark.","evidence":"`5156fef` (\"fix np.memmap memory leak\"), the Stack Overflow link in the comment.","source":"documented"},{"title":"Pad the vocabulary from 50,257 to 50,304","choice":"From-scratch models use 50,304 output classes, the next multiple of 64, even though only 50,257 ids ever appear [[model.py:111|vocab_size: int = 50304]].","why":"\"the biggest deal smallest optimization i've made in recent past, about 25% faster. this is because the last layer is a major latency bottleneck consuming about 40% of latency due to the very high channel count\" (`77e7e04`). GPU matrix kernels are fastest when dimensions are multiples of 64.","tradeoff":"47 output rows that are never a target; the model learns to give them near-zero probability. Loading GPT-2 weights forces 50,257 instead, so those models do not get the speed-up [[model.py:222-223|config_args['vocab_size'] = 50257]].","evidence":"`77e7e04`","source":"documented"},{"title":"Tie the input embedding and the output layer","choice":"`transformer.wte.weight` is assigned the `lm_head.weight` tensor, so one matrix serves both [[model.py:138|self.transformer.wte.weight = self.lm_head.weight]].","why":"It matches GPT-2 and saves about 38.6M parameters at GPT-2 size (`7c82885`). The direction of the assignment matters: \"making sure that the final layer init is preserved, and becomes the token embedding instead of the other way around. otherwise the loss can be all messed up from a bad init\" (`43b37fd`).","tradeoff":"`torch.compile` prints a warning about tied weights that the code marks as not understood yet [[model.py:134-137|not 100% sure what this is, so far seems to be harmless]].","evidence":"`7c82885`, `43b37fd`","source":"documented"},{"title":"No biases by default in train.py, but GPT-2-compatible biases are kept as an option","choice":"`GPTConfig` defaults to `bias=True` like GPT-2 [[model.py:116|bias: bool = True]], while `train.py` defaults to `bias = False` [[train.py:56|bias = False]].","why":"\"measuring bias=False to be about 6% faster\" (`e808a67`), then \"based on my experiments these biases are indeed not needed. code runs faster, identical results. keeping the option just because it deviates from the gpt-2 setup\" (`0e90ee9`).","tradeoff":"Two defaults to keep in mind. A model you train from scratch is not shaped like an OpenAI GPT-2 checkpoint unless you pass `--bias=True`.","evidence":"`2892858`, `e808a67`, `0e90ee9`","source":"documented"},{"title":"Flash attention when available, a manual fallback otherwise","choice":"`CausalSelfAttention` checks for `F.scaled_dot_product_attention` and only builds the explicit causal-mask buffer when it is missing [[model.py:44-50|flash attention make GPU go brrrrr but support is only in PyTorch >= 2.0]].","why":"PyTorch 2.0's fused kernel is much faster and never stores the T×T matrix; the fallback keeps older PyTorch working and keeps the textbook version of attention readable in the file (`ae06d0b`).","tradeoff":"Two code paths to keep equivalent. A dropout bug in the fused path briefly disabled Flash when dropout > 0 (`1e87509`) until a PyTorch-side fix let it be re-enabled (`6170531`).","evidence":"`ae06d0b`, `1e87509`, `6170531`","source":"documented"},{"title":"Simulate a 0.5M-token batch with gradient accumulation","choice":"The default is `gradient_accumulation_steps = 5 * 8` micro-batches of 12 sequences of 1024 tokens [[train.py:48-50|gradient_accumulation_steps = 5 * 8]]; under DDP each of N processes runs 40/N of them [[train.py:92-95|gradient_accumulation_steps //= ddp_world_size]].","why":"GPT-2-style training expects about 0.5M tokens per step (`001c1e7`). Writing it as 5 × 8 means one GPU and eight GPUs get the same effective batch (`978d4fe`, `086ebe1`).","tradeoff":"On one GPU a single iteration does 40 forward/backward passes, so it looks slow. The number of GPUs must divide 40, or the assert fires.","evidence":"`cf99914`, `001c1e7`, `086ebe1`, `978d4fe`, comment [[config/train_gpt2.py:9-13|12 batch size * 1024 block size * 5 gradaccum * 8 GPUs = 491,520]]","source":"documented"},{"title":"Toggle require_backward_grad_sync instead of using no_sync()","choice":"During accumulation, DDP's gradient all-reduce is switched on only for the last micro-step by setting an attribute directly [[train.py:293-298|model.require_backward_grad_sync = (micro_step == gradient_accumulation_steps - 1)]].","why":"The comment: the official `no_sync()` context manager \"bloats the code and forces us to repeat code\", and it only toggles this same variable.","tradeoff":"Relies on a DDP internal attribute rather than the public API, which could change in a future PyTorch.","evidence":"Code comment [[train.py:295-297|I really dislike that this bloats the code]]","source":"documented"},{"title":"GPT-2 initialisation, including scaled residual projections","choice":"All linear and embedding weights start from a normal distribution with std 0.02, and the two residual output projections per layer (`c_proj`) use 0.02 / sqrt(2 × n_layer) [[model.py:140-145|std=0.02/math.sqrt(2 * config.n_layer)]].","why":"\"ok i tried bringing back original init again and this time it makes a ton of difference and works much better than default\" (`f29a9ff`). Each layer adds two outputs to the residual stream; shrinking them keeps the stream's variance from growing with depth (inferred explanation of the GPT-2 paper's rule).","tradeoff":"None in practice; it is the standard GPT-2 recipe.","evidence":"`23a0bfa`, `f29a9ff`","source":"documented"},{"title":"Weight decay by tensor shape, not by module type","choice":"Every parameter with 2 or more dimensions is decayed; every 1-D parameter (biases, LayerNorm gains) is not [[model.py:268-275|Any parameters that is 2D will be weight decayed, otherwise no.]].","why":"`7fe4a09` (\"simplify configure_optimizers by a lot\") replaced about 40 lines of module whitelists and blacklists with these two list comprehensions.","tradeoff":"The old code deliberately excluded the tied embedding/output matrix from decay; the new rule decays it, since it is 2-D. This changed behaviour quietly. Inferred from the diff of `7fe4a09`; the commit message does not mention it.","evidence":"`7fe4a09`","source":"inferred"},{"title":"Clip gradients at norm 1.0","choice":"`grad_clip = 1.0` by default, applied after unscaling [[train.py:306-309|scaler.unscale_(optimizer)]].","why":"\"grad clipping seems to slightly speed up training in the beginning but i can't see a big difference later … adding it for now because it is standard, and i think more necessary as the model becomes larger. practitioners may consider turning it off for minor efficiency gains\" (`3cb3fc0`).","tradeoff":"Costs a little compute each step; `--grad_clip=0.0` turns it off.","evidence":"`3cb3fc0`, `924a087` (careful ordering with the GradScaler)","source":"documented"},{"title":"Only compute the last position's logits when sampling","choice":"Without targets, `forward` applies `lm_head` to the final position only [[model.py:188-191|only forward the lm_head on the very last position]].","why":"\"inference time mini-optimization low-hanging fruit … we can apply lm_head on only the very last token\" (`8f85b83`). The output layer is the most expensive single matmul (50,304 wide), and sampling only needs the last row.","tradeoff":"`forward` without targets cannot give you per-position logits for, say, scoring a whole sentence; pass targets or change the code.","evidence":"`8f85b83`","source":"documented"},{"title":"Strip the _orig_mod. prefix when loading checkpoints","choice":"Both `train.py` (resume) and `sample.py` rename any state-dict key starting with `_orig_mod.` [[train.py:172-177|honestly no idea how checkpoints sometimes get this prefix]].","why":"The code says the cause was not known. Most likely it is `torch.compile`: the compiled wrapper stores the real model as `_orig_mod`, and `raw_model` points at that wrapper when saving [[train.py:253|raw_model = model.module if ddp else model]]. The variable `unoptimized_model` that would avoid it is assigned and never used [[train.py:207|unoptimized_model = model]]. This explanation is inferred.","tradeoff":"Harmless, but the same patch is copied in two scripts, and any other tool that loads `ckpt.pt` must repeat it.","evidence":"`ec9b1f8` (\"add a patch to fix mysterious unwanted prefix in state dict? maybe remove later\"), `2b9e168`","source":"inferred"},{"title":"Character-level support as a special case in sample.py","choice":"`sample.py` decides between two tokenizers: the `meta.pkl` character tables if the checkpoint's dataset folder has one, otherwise GPT-2 BPE [[sample.py:56-74|ok let's assume gpt-2 encodings by default]].","why":"\"The current implementation is a bit hacky and basically assumes just these two possibilities. In the future we may want to support more general encoders or decoders.\" (`d17350a`)","tradeoff":"A third tokenizer means editing `sample.py`; the TODO is still there [[sample.py:65|TODO want to make this more general]].","evidence":"`d17350a`","source":"documented"}],"exercises":[{"title":"Turn the sampling dials","level":"easy","goal":"See what temperature and top-k actually do, using the model you trained in the quick start. Both are plain globals in `sample.py` [[sample.py:16-19|top_k = 200]] and are applied in `generate` [[model.py:317-322|logits = logits[:, -1, :] / temperature]].","files":["sample.py","model.py"],"hints":["Keep `--seed=1337` fixed so only the dial changes.","Try `--temperature=0.1`, `0.8`, `1.5`, then `--top_k=1` and `--top_k=5`.","Use `--num_samples=1 --max_new_tokens=200` to keep the output short."],"done_when":"You can explain, with an example from your own output, why low temperature repeats itself and high temperature invents words, and why `--top_k=1` gives the same text on every run regardless of seed."},{"title":"Train on your own text","level":"easy","goal":"Add a new character-level dataset by copying the Shakespeare one, and train a baby GPT on it.","files":["data/shakespeare_char/prepare.py","config/train_shakespeare_char.py","train.py"],"hints":["Copy `data/shakespeare_char/` to `data/mytext/`, put your text in `input.txt` there, and delete the download block.","Add `encoding='utf-8'` to the `open` calls if your text is not plain ASCII.","Train with `python train.py config/train_shakespeare_char.py --dataset=mytext --out_dir=out-mytext`; the vocab size comes from your `meta.pkl` automatically [[train.py:137-144|attempt to derive vocab_size from the dataset]]."],"done_when":"`train.py` prints `found vocab_size = …` with your vocabulary size, the validation loss falls below ln(vocab size), and `python sample.py --out_dir=out-mytext` prints text in the style of your file."},{"title":"Keep the best and the latest checkpoint separately","level":"medium","goal":"Fix the `best_val_loss` overwrite: always save `ckpt_last.pt`, and save `ckpt.pt` only when validation loss really improves.","files":["train.py"],"hints":["The logic to change is the `if losses['val'] \u003c best_val_loss or always_save_checkpoint:` block [[train.py:274-286|if iter_num > 0:]].","Compute `improved = losses['val'] \u003c best_val_loss` first, update `best_val_loss` only when it is true.","`sample.py` reads `ckpt.pt`, so the best model stays the default for sampling."],"done_when":"In a Shakespeare run with `--dropout=0.0` (the config's own comment expects this small dataset to overfit), `ckpt.pt` stops changing once val loss rises while `ckpt_last.pt` keeps updating, and the saved `best_val_loss` equals the lowest val loss printed."},{"title":"Log the gradient norm","level":"medium","goal":"Add one of the README's to-dos, \"additional logging around network health\" [[README.md:219|Additional logging around network health]], by printing the gradient norm every log line.","files":["train.py"],"hints":["`torch.nn.utils.clip_grad_norm_` already returns the total norm before clipping [[train.py:307-309|torch.nn.utils.clip_grad_norm_(model.parameters(), grad_clip)]]; keep its return value.","Add it to the `print` at the end of the iteration and to the `wandb.log` dict.","Count how often it exceeds `grad_clip` to see how often clipping actually fires."],"done_when":"Each `iter` line shows a `gnorm` value, you can see it is large in the first few hundred steps and settles later, and setting `--grad_clip=0.0` still prints it (compute the norm yourself in that case)."},{"title":"Make character sampling tolerate unknown characters","level":"medium","goal":"Stop `sample.py` from crashing with `KeyError` when a prompt contains a character outside the training vocabulary.","files":["sample.py"],"hints":["The encoder is a one-line lambda [[sample.py:66-68|encode = lambda s:]].","Decide on a policy: drop unknown characters with a printed warning, or fail with a clear message listing them.","Test with `--start=\"Hello 2025!\"` on the Shakespeare model; `2`, `0` and `5` are not in its vocabulary."],"done_when":"The prompt above either generates text after a one-line warning naming the dropped characters, or exits with a message naming them, instead of a traceback."},{"title":"Replace learned position embeddings with rotary embeddings","level":"hard","goal":"Implement another README to-do [[README.md:217|Incorporate other embeddings (rotary, alibi)]]: remove `wpe` and rotate queries and keys by position inside attention (RoPE).","files":["model.py"],"hints":["Positions are currently added once at the input [[model.py:174-179|pos_emb = self.transformer.wpe(pos)]]; with RoPE they are applied to q and k in every attention layer, after the head split [[model.py:56-59|k = k.view(B, T, self.n_head, C // self.n_head).transpose(1, 2)]].","Precompute cos/sin tables of shape (block_size, head_size/2) once in `__init__` and register them as buffers.","`from_pretrained` and `crop_block_size` both assume `wpe` exists; guard them or limit your change to from-scratch training.","Compare against the baseline with the same seed and config."],"done_when":"The Shakespeare baby GPT trains with RoPE, `sum(p.numel() for p in model.parameters())` drops by block_size × n_embd (256 × 384 = 98,304), and you have a plot of val loss for both versions over the same 5,000 iterations. (The printed count already excludes `wpe` [[model.py:157-160|n_params -= self.transformer.wpe.weight.numel()]], so `get_num_params` needs the same guard.)"},{"title":"Write a regression test against Hugging Face GPT-2","level":"hard","goal":"Add the repo's first test: load `gpt2` through `GPT.from_pretrained` and check its logits match `transformers`' `GPT2LMHeadModel` on the same input.","files":["model.py"],"hints":["Put the test in a new `tests/` folder; load both models in float32 on CPU and call `.eval()` on both.","Pass targets (or a dummy) to nanoGPT's forward so it returns logits for every position, not just the last [[model.py:184-193|if targets is not None:]].","Compare logits on a short tokenized sentence with `torch.allclose`. Expect small differences: nanoGPT uses exact `nn.GELU()` [[model.py:83|self.gelu    = nn.GELU()]], while OpenAI's GPT-2 used the tanh approximation, so pick a tolerance from what you observe (or compare argmax tokens).","Then deliberately break the transpose list in `from_pretrained` [[model.py:245|transposed = ]] and confirm the test fails."],"done_when":"`python -m pytest tests/` passes on a clean checkout and fails when you remove one entry from `transposed`."}],"files":[{"path":"model.py","area":"Model","role":"The whole GPT in one file: layers, the GPT class, GPT-2 weight import, optimizer grouping, MFU estimate and the sampling loop.","summary":"Five small classes build up the network: `LayerNorm`, `CausalSelfAttention`, `MLP`, `Block` (one transformer layer) and `GPT` (embeddings, a stack of blocks, a final norm and the output layer). `GPTConfig` holds the seven numbers that define a model. The `GPT` class also carries the utilities the scripts need: `from_pretrained` for OpenAI's weights, `configure_optimizers` for AdamW, `estimate_mfu` for logging and `generate` for sampling. It follows OpenAI's GPT-2 layout closely enough that the checkpoints load tensor for tensor [[model.py:1-8|the official GPT-2 TensorFlow implementation released by OpenAI]].","symbols":[{"name":"LayerNorm","at":"[[model.py:18-27|class LayerNorm(nn.Module):]]","does":"LayerNorm with an optional bias."},{"name":"CausalSelfAttention","at":"[[model.py:29-76|class CausalSelfAttention(nn.Module):]]","does":"Multi-head attention that only looks left; uses Flash attention when PyTorch has it."},{"name":"MLP","at":"[[model.py:78-92|class MLP(nn.Module):]]","does":"Per-position feed-forward network, 4× wide, GELU."},{"name":"Block","at":"[[model.py:94-106|class Block(nn.Module):]]","does":"One transformer layer: pre-norm attention and MLP, each with a residual add."},{"name":"GPTConfig","at":"[[model.py:108-116|class GPTConfig:]]","does":"block_size, vocab_size, n_layer, n_head, n_embd, dropout, bias; defaults are GPT-2 small."},{"name":"GPT.__init__","at":"[[model.py:120-148|self.apply(self._init_weights)]]","does":"Builds the modules, ties embedding and output weights, applies GPT-2 initialisation, prints the parameter count."},{"name":"GPT.forward","at":"[[model.py:170-193|def forward(self, idx, targets=None):]]","does":"Ids to logits, plus cross-entropy loss when targets are given."},{"name":"GPT.crop_block_size","at":"[[model.py:195-204|def crop_block_size(self, block_size):]]","does":"Shrinks the context window of an existing model."},{"name":"GPT.from_pretrained","at":"[[model.py:206-261|def from_pretrained(cls, model_type, override_args=None):]]","does":"Builds a GPT-2-shaped model and copies Hugging Face weights into it."},{"name":"GPT.configure_optimizers","at":"[[model.py:263-287|def configure_optimizers(self, weight_decay, learning_rate, betas, device_type):]]","does":"AdamW with weight decay on 2-D tensors only; fused on CUDA."},{"name":"GPT.estimate_mfu","at":"[[model.py:289-303|def estimate_mfu(self, fwdbwd_per_iter, dt):]]","does":"Model FLOPs utilization against an A100's 312 TFLOPS."},{"name":"GPT.generate","at":"[[model.py:305-330|def generate(self, idx, max_new_tokens, temperature=1.0, top_k=None):]]","does":"Autoregressive sampling with temperature and top-k."}],"read_when":"You want to change the architecture, the loss, which parameters get weight decay, or how sampling picks tokens.","complexity":4,"gotchas":"`lm_head.weight` and `transformer.wte.weight` are the same tensor; editing one edits both [[model.py:138|self.transformer.wte.weight = self.lm_head.weight]]. The attention `bias` buffer (the causal mask) only exists when Flash attention is unavailable, which is why the weight-copy code filters it [[model.py:46-50|self.register_buffer(]]."},{"path":"train.py","area":"Training","role":"The training script: settings, single-GPU or DDP setup, batching, model creation, the loop, evaluation and checkpoints.","summary":"Read it top to bottom; it runs top to bottom. Lines 33–74 are the defaults as plain globals, line 77 lets `configurator.py` overwrite them. Then it detects DDP, sets up mixed precision, defines `get_batch`, builds the model in one of three ways (`scratch`, `resume`, `gpt2*`), creates the optimizer, compiles and wraps the model, and enters `while True:`. There are no functions besides `get_batch`, `estimate_loss` and `get_lr`, and no classes.","symbols":[{"name":"default config","at":"[[train.py:32-74|default config values designed to train a gpt2 (124M) on OpenWebText]]","does":"Every tunable setting with its GPT-2 default."},{"name":"DDP setup","at":"[[train.py:81-102|ddp = int(os.environ.get('RANK', -1)) != -1]]","does":"One process per GPU when launched by torchrun; divides gradient accumulation by world size."},{"name":"precision context","at":"[[train.py:104-112|ctx = nullcontext() if device_type == 'cpu' else torch.amp.autocast]]","does":"Seeds, TF32 and the autocast context used around every forward pass."},{"name":"get_batch","at":"[[train.py:114-131|def get_batch(split):]]","does":"Random windows from the memmapped `.bin` file, moved to the GPU asynchronously."},{"name":"model init","at":"[[train.py:146-193|elif init_from == 'resume':]]","does":"From scratch, from `ckpt.pt`, or from GPT-2 weights; optional context crop."},{"name":"optimizer, compile, DDP wrap","at":"[[train.py:195-212|model = DDP(model, device_ids=[ddp_local_rank])]]","does":"GradScaler, AdamW (restored on resume), `torch.compile`, DDP."},{"name":"estimate_loss","at":"[[train.py:214-228|def estimate_loss():]]","does":"Mean loss over `eval_iters` random batches per split."},{"name":"get_lr","at":"[[train.py:230-242|def get_lr(it):]]","does":"Warmup then cosine decay."},{"name":"training loop","at":"[[train.py:249-333|while True:]]","does":"Eval and checkpoint, accumulate gradients, clip, step, log."}],"read_when":"You want to change how batches are drawn, the schedule, checkpointing, logging, or multi-GPU behaviour.","complexity":4,"gotchas":"Run it from the repo root: it opens `configurator.py` and `data/\u003cdataset>` by relative path [[train.py:115|data_dir = os.path.join('data', dataset)]]. With the default `always_save_checkpoint = True`, `best_val_loss` is overwritten by the latest value even when it got worse [[train.py:274-275|if losses['val'] \u003c best_val_loss or always_save_checkpoint:]]."},{"path":"sample.py","area":"Inference","role":"Generate text from your checkpoint or from an OpenAI GPT-2 model.","summary":"Loads a model either from `out_dir/ckpt.pt` (`init_from='resume'`, the default) or from Hugging Face (`init_from='gpt2-xl'` and friends). It then chooses a tokenizer: the character tables from `meta.pkl` if the checkpoint's dataset folder has one, otherwise GPT-2's BPE through tiktoken. It encodes the `start` prompt (or a file via `FILE:`), calls `model.generate` `num_samples` times and prints each result.","symbols":[{"name":"settings","at":"[[sample.py:11-23|temperature = 0.8]]","does":"Prompt, sample count and length, temperature, top-k, device."},{"name":"model loading","at":"[[sample.py:34-54|if init_from == 'resume':]]","does":"Rebuild from checkpoint (stripping `_orig_mod.`) or load GPT-2."},{"name":"tokenizer choice","at":"[[sample.py:56-74|load_meta = os.path.exists(meta_path)]]","does":"Character tables from meta.pkl, or tiktoken GPT-2."},{"name":"generation","at":"[[sample.py:76-89|start_ids = encode(start)]]","does":"Encode the prompt and print `num_samples` decoded samples."}],"read_when":"You want to change prompting, decoding or how a model is loaded for inference.","complexity":2,"gotchas":"With the character model, any prompt character that was not in the training text raises a `KeyError` [[sample.py:67|stoi[c] for c in s]]. The tokenizer guess assumes only these two schemes, as the TODO admits [[sample.py:65|want to make this more general to arbitrary encoder/decoder]]."},{"path":"configurator.py","area":"Configuration","role":"Not a module: a snippet that `train.py`, `sample.py` and `bench.py` `exec` to overwrite their global settings from argv.","summary":"Every argument without `=` is treated as a config file and executed as Python in the caller's globals. Every `--key=value` argument must name an existing global; the value is parsed with `literal_eval` (falling back to a string) and must have the same type as the default. The docstring calls it \"Probably a terrible idea\" and explains the motive: no `config.` prefix on every variable.","symbols":[{"name":"config files","at":"[[configurator.py:20-28|exec(open(config_file).read())]]","does":"Runs a Python file of assignments."},{"name":"--key=value","at":"[[configurator.py:29-47|assert type(attempt) == type(globals()[key])]]","does":"Typed override of one existing global; unknown keys raise ValueError."}],"read_when":"An override is rejected, or you want to add a new setting to a script.","complexity":2,"gotchas":"Types must match exactly: `--learning_rate=1` is an int and fails against the float default; write `1.0`. Values containing `=` break the split [[configurator.py:32|key, val = arg.split('=')]]."},{"path":"bench.py","area":"Benchmarking","role":"A stripped-down training loop that measures time per iteration and MFU, optionally under the PyTorch profiler.","summary":"Builds a GPT-2 124M-shaped model with `bias=False`, uses either real OpenWebText batches or fixed random tokens, and runs 10 warm-up then 20 timed iterations. With `--profile=True` it writes a TensorBoard trace to `./bench_log` instead. There is no gradient accumulation, DDP, evaluation or checkpointing.","symbols":[{"name":"data choice","at":"[[bench.py:32-48|get_batch = lambda split: (x, y)]]","does":"Real memmapped OpenWebText or a fixed random batch."},{"name":"profiler run","at":"[[bench.py:66-94|with torch.profiler.profile(]]","does":"15 steps (5 wait, 5 warmup, 5 active) traced to TensorBoard."},{"name":"simple benchmark","at":"[[bench.py:96-117|for stage, num_steps in enumerate([10, 20]): # burnin, then benchmark]]","does":"Times 20 steps after 10 burn-in and prints ms/iter and MFU."}],"read_when":"You change the model or a speed setting and want to know if it got faster.","complexity":2,"gotchas":"CUDA only: it calls `torch.cuda.synchronize()` and `pin_memory()` unconditionally [[bench.py:99|torch.cuda.synchronize()]]. With `real_data=True` (the default) it needs `data/openwebtext/train.bin`; use `--real_data=False` otherwise."},{"path":"data/shakespeare_char/prepare.py","area":"Data","role":"Character-level tiny Shakespeare: download, build a 65-character vocabulary, write train/val `.bin` and `meta.pkl`.","summary":"The smallest complete data pipeline in the repo and the one the quick start uses. Each character is a token; the vocabulary is the sorted set of characters in the text. It writes 1,003,854 training and 111,540 validation tokens as `uint16`, and pickles the vocabulary so training and sampling can find it. The expected output is recorded as comments at the bottom.","symbols":[{"name":"vocabulary","at":"[[data/shakespeare_char/pr
