epare.py:23-35|def encode(s):]]","does":"`stoi`/`itos` tables and encode/decode helpers."},{"name":"export","at":"[[data/shakespeare_char/prepare.py:48-61|train_ids = np.array(train_ids, dtype=np.uint16)]]","does":"Writes train.bin, val.bin and meta.pkl."}],"read_when":"You want to train on your own text file at character level: copy this folder and change the input.","complexity":1,"gotchas":"It opens `input.txt` without `encoding='utf-8'` [[data/shakespeare_char/prepare.py:16-19|with open(input_file_path, 'r') as f:]], unlike `data/shakespeare/prepare.py`. Fine for this ASCII text; non-ASCII input on Windows may fail or decode wrongly."},{"path":"data/shakespeare/prepare.py","area":"Data","role":"Tiny Shakespeare tokenized with GPT-2's BPE, for finetuning GPT-2.","summary":"Same download and 90/10 split as the character version, but encodes with `tiktoken`'s GPT-2 encoding and writes no `meta.pkl`, so training uses the GPT-2 vocabulary. Result: 301,966 training and 36,059 validation tokens.","symbols":[{"name":"BPE encoding","at":"[[data/shakespeare/prepare.py:19-24|enc = tiktoken.get_encoding(]]","does":"Encodes both splits with GPT-2 BPE."}],"read_when":"You want to finetune a GPT-2 checkpoint on your own small text.","complexity":1},{"path":"data/openwebtext/prepare.py","area":"Data","role":"Download OpenWebText (about 8M documents), tokenize with GPT-2 BPE in parallel and write a 17 GB `train.bin`.","summary":"Uses Hugging Face `datasets` to download and split off 0.05% as validation, tokenizes every document with an end-of-text token appended, then writes all ids into one `np.memmap` file in 1024 contiguous shards. The comments record the outcome: about 9.0B training tokens and 4.4M validation tokens, and 54 GB of Hugging Face cache.","symbols":[{"name":"download and split","at":"[[data/openwebtext/prepare.py:21-27|train_test_split(test_size=0.0005, seed=2357, shuffle=True)]]","does":"Loads the dataset and carves out a validation split."},{"name":"process","at":"[[data/openwebtext/prepare.py:42-48|ids.append(enc.eot_token)]]","does":"BPE-encode one document and append token 50256."},{"name":"write","at":"[[data/openwebtext/prepare.py:58-74|batch = dset.shard(num_shards=total_batches, index=batch_idx, contiguous=True)]]","does":"Concatenate all ids into one uint16 memmap file."}],"read_when":"You want to pretrain on a different large Hugging Face dataset.","complexity":3,"gotchas":"`num_proc = 8` is hard-coded [[data/openwebtext/prepare.py:10-17|num_proc = 8]]; the comment suggests about half your CPU cores. The author's own comment wonders whether the end-of-text token should come first [[data/openwebtext/prepare.py:46|I think eot should be prepended not appended]]."},{"path":"config/train_shakespeare_char.py","area":"Configuration","role":"Settings for the baby character-level GPT: 6 layers, 6 heads, 384 channels, context 256, 5,000 iterations.","summary":"A list of assignments that `configurator.py` executes over `train.py`'s defaults. It shrinks the model, raises the learning rate to 1e-3 because the model is small, raises `beta2` to 0.99 because each iteration sees few tokens, adds dropout 0.2 because the dataset is small enough to overfit, and saves only when validation loss improves.","symbols":[{"name":"model size","at":"[[config/train_shakespeare_char.py:21-25|n_embd = 384]]","does":"The baby GPT's shape and dropout."},{"name":"optimizer","at":"[[config/train_shakespeare_char.py:27-33|beta2 = 0.99]]","does":"Learning rate, schedule length and warmup."}],"read_when":"You want a fast experiment to test a change.","complexity":1},{"path":"config/train_gpt2.py","area":"Configuration","role":"The GPT-2 (124M) reproduction: about 0.5M tokens per step, 600,000 steps, 300B tokens, wandb on.","summary":"Mostly restates `train.py`'s defaults so the run is self-documenting, with the arithmetic in comments: 12 × 1024 × 5 × 8 = 491,520 tokens per step, and 600,000 steps for 300B tokens. Launch with `torchrun --standalone --nproc_per_node=8`.","symbols":[{"name":"batch arithmetic","at":"[[config/train_gpt2.py:9-13|12 batch size * 1024 block size * 5 gradaccum * 8 GPUs = 491,520]]","does":"Effective batch of about 0.5M tokens."}],"read_when":"You plan a multi-GPU pretraining run.","complexity":1},{"path":"config/finetune_shakespeare.py","area":"Configuration","role":"Finetune GPT-2 XL on BPE Shakespeare: 20 iterations at a constant learning rate of 3e-5.","summary":"Starts from `init_from = 'gpt2-xl'`, uses 1 sequence × 32 accumulation steps per iteration (32,768 tokens, about 9 iterations per epoch), evaluates every 5 steps and saves only on improvement. The README says these were not tuned much [[README.md:166|I didn't tune them much though]].","symbols":[{"name":"init and schedule","at":"[[config/finetune_shakespeare.py:10-25|decay_lr = False]]","does":"Pretrained start, tiny batch, constant LR."}],"read_when":"You want to finetune a GPT-2 size on your own data.","complexity":1},{"path":"config/eval_gpt2.py","area":"Configuration","role":"Evaluate OpenAI's GPT-2 (124M) on OpenWebText and exit. Siblings `eval_gpt2_medium.py`, `eval_gpt2_large.py` and `eval_gpt2_xl.py` differ only in `init_from`.","summary":"Sets `eval_only = True` so `train.py` breaks out of the loop right after the first evaluation, using 500 evaluation batches for a steadier estimate. These produce the README's baseline table, from a val loss of 3.12 for gpt2 down to 2.54 for gpt2-xl [[README.md:149-154|1558M]].","symbols":[{"name":"eval only","at":"[[config/eval_gpt2.py:4-8|eval_only = True]]","does":"One evaluation from GPT-2 weights, then exit."}],"read_when":"You want a baseline loss for a pretrained model on your dataset.","complexity":1},{"path":"transformer_sizing.ipynb","area":"Analysis","role":"Back-of-the-envelope maths for GPT-2 124M: parameter count, checkpoint size, memory share, FLOPs per forward pass, MFU and training time.","summary":"Counts parameters by hand and matches PyTorch exactly at 124,337,664 [[transformer_sizing.ipynb:53|match: True]]. Estimates a 1.49 GB checkpoint (weights plus two AdamW buffers) against a measured 1,542,470,366 bytes [[transformer_sizing.ipynb:136-140|measured_bytes = 1542470366]]. Derives FLOPs per pass, checks them against the PaLM formula used in `estimate_mfu` (ratio 1.0001) [[transformer_sizing.ipynb:270|ratio: 1.0001]], and predicts 3.46 days on 8 A100s at 30% MFU [[transformer_sizing.ipynb:342|3.46 days]], close to the roughly 4 days it took [[transformer_sizing.ipynb:363|converged in roughly 4 days]].","symbols":[{"name":"params()","at":"[[transformer_sizing.ipynb:75|def params():]]","does":"Parameter count per component."},{"name":"flops()","at":"[[transformer_sizing.ipynb:215|def flops():]]","does":"FLOPs per forward and backward pass."},{"name":"palm_flops()","at":"[[transformer_sizing.ipynb:277-283|mf_per_token = 6*N + 12*L*H*Q*T]]","does":"The same formula as `GPT.estimate_mfu`."}],"read_when":"You want to know what a model size will cost before you train it.","complexity":2},{"path":"scaling_laws.ipynb","area":"Analysis","role":"An attempt to reproduce the Chinchilla scaling-law results, used as a rough guide to choosing model and data size for a compute budget.","summary":"Implements parameter and FLOP counts for GPT and Chinchilla models, the Chinchilla loss fit L(N, D), and a search for the compute-optimal model size given a FLOP budget. It says openly that the numbers do not match the paper exactly [[scaling_laws.ipynb:8|Can't get the numbers to match exactly]]; for one budget it finds 316M parameters where the paper says 400M [[scaling_laws.ipynb:569|400M params and 9.2B tokens]]. Not used by any script.","symbols":[{"name":"gpt_params","at":"[[scaling_laws.ipynb:50|def gpt_params(seq_len, vocab_size, d_model, num_heads, num_layers):]]","does":"Parameter count for a GPT config."},{"name":"chinchilla_flops","at":"[[scaling_laws.ipynb:178|def chinchilla_flops(]]","does":"FLOPs per Chinchilla Appendix F, with a correction from the authors."},{"name":"L(N, D)","at":"[[scaling_laws.ipynb:462-467|E = 1.69]]","does":"The Chinchilla Approach 3 loss fit."}],"read_when":"You are deciding how big a model to train for a given GPU budget.","complexity":3},{"path":"README.md","area":"Docs","role":"The user manual: install, quick start on GPU/CPU/Mac, GPT-2 reproduction, baselines, finetuning, sampling, troubleshooting.","summary":"The only documentation besides code comments. It gives every command in this guide's Run chapter and the reference numbers to compare against (1.4697 val loss for the baby GPT, about 2.85 for the 124M reproduction). The top note, added in November 2025, marks the repo deprecated in favour of nanochat.","symbols":[{"name":"quick start","at":"[[README.md:35-54|python train.py config/train_shakespeare_char.py]]","does":"Prepare, train and sample the character model."},{"name":"reproducing GPT-2","at":"[[README.md:107-121|torchrun --standalone --nproc_per_node=8 train.py config/train_gpt2.py]]","does":"OpenWebText on one 8× A100 node."},{"name":"troubleshooting","at":"[[README.md:222-224|--compile=False]]","does":"Turn off torch.compile where it is unsupported."}],"read_when":"You need an exact command or an expected loss.","complexity":1}],"flows":[{"id":"shakespeare-end-to-end","title":"Prepare Shakespeare, train a baby GPT, sample from it","trigger":"You run the README quick start: `python data/shakespeare_char/prepare.py`, then `python train.py config/train_shakespeare_char.py`, then `python sample.py --out_dir=out-shakespeare-char`.","summary":"Three scripts, three hand-offs through files: text becomes `train.bin`/`val.bin`/`meta.pkl`, training turns those into `ckpt.pt`, sampling turns `ckpt.pt` back into text.","steps":[{"title":"Download the text once","at":"[[data/shakespeare_char/prepare.py:12-20|tinyshakespeare/input.txt]]","explain":"If `input.txt` is missing next to the script, it fetches the 1 MB tiny-Shakespeare file from Karpathy's char-rnn repo, then reads it into one string."},{"title":"Build a 65-character vocabulary","at":"[[data/shakespeare_char/prepare.py:23-35|stoi = { ch:i for i,ch in enumerate(chars) }]]","explain":"Every distinct character, sorted, gets an id. `stoi` maps character to id and `itos` maps back."},{"title":"Split 90/10 and encode","at":"[[data/shakespeare_char/prepare.py:37-46|create the train and test splits]]","explain":"The first 90% of the text is training data and the last 10% validation, giving 1,003,854 and 111,540 tokens."},{"title":"Write token files and meta.pkl","at":"[[data/shakespeare_char/prepare.py:48-61|train_ids.tofile(os.path.join(os.path.dirname(__file__), 'train.bin'))]]","explain":"The ids are written as raw `uint16` bytes. The vocabulary goes into `meta.pkl` so later scripts can use it."},{"title":"train.py applies the config file","at":"[[train.py:76-78|exec(open('configurator.py').read())]]","explain":"The defaults at the top of `train.py` are overwritten by `config/train_shakespeare_char.py`, which sets the dataset, a 6-layer model and 5,000 iterations [[config/train_shakespeare_char.py:16-29|dataset = 'shakespeare_char']]."},{"title":"Read vocab_size from meta.pkl","at":"[[train.py:137-144|attempt to derive vocab_size from the dataset]]","explain":"Finding `data/shakespeare_char/meta.pkl`, it sets the vocab size to 65 instead of GPT-2's 50304."},{"title":"Build a fresh GPT","at":"[[train.py:146-157|if init_from == 'scratch':]]","explain":"`init_from` defaults to `'scratch'`, so it creates a randomly initialised `GPT` with 10.65M parameters."},{"title":"Loop: batch, forward, backward, step","at":"[[train.py:290-314|for micro_step in range(gradient_accumulation_steps):]]","explain":"Each iteration samples 64 random 256-character windows, computes the loss, backpropagates and updates the weights. The flow \"One training iteration\" traces this step by step."},{"title":"Evaluate every 250 steps and save on improvement","at":"[[train.py:262-286|if losses['val'] \u003c best_val_loss or always_save_checkpoint:]]","explain":"The config sets `always_save_checkpoint = False` [[config/train_shakespeare_char.py:9-10|always_save_checkpoint = False]], so `ckpt.pt` is only rewritten when validation loss beats the best so far."},{"title":"sample.py rebuilds the model from ckpt.pt","at":"[[sample.py:34-46|gptconf = GPTConfig(**checkpoint['model_args'])]]","explain":"The saved `model_args` recreate the same architecture, and the saved weights are loaded into it."},{"title":"Find meta.pkl through the checkpoint's config","at":"[[sample.py:56-68|Loading meta from]]","explain":"The checkpoint remembers `dataset = 'shakespeare_char'`, so `sample.py` loads that folder's `meta.pkl` and decodes with characters instead of GPT-2 tokens."},{"title":"Encode the prompt and generate","at":"[[sample.py:76-89|y = model.generate(x, max_new_tokens, temperature=temperature, top_k=top_k)]]","explain":"The default prompt is a single newline. It generates 10 samples of 500 new characters and prints each one decoded."},{"title":"One token at a time","at":"[[model.py:305-330|idx_next = torch.multinomial(probs, num_samples=1)]]","explain":"`generate` runs the model, takes the scores for the last position, applies temperature and top-k, draws one id at random, appends it, and repeats."}]},{"id":"gpt-forward","title":"One forward pass: from token ids to a loss","trigger":"`train.py` calls `model(X, Y)` with X and Y of shape (batch_size, block_size), e.g. (64, 256) for the Shakespeare config.","summary":"Token ids are looked up as vectors, refined by `n_layer` identical blocks of attention and MLP, turned into one score per vocabulary entry, and compared with the true next tokens.","steps":[{"title":"Check the length and make positions","at":"[[model.py:170-174|pos = torch.arange(0, t, dtype=torch.long, device=device)]]","explain":"A sequence longer than `block_size` is rejected. Positions are simply 0, 1, …, t-1."},{"title":"Look up token and position embeddings, add them","at":"[[model.py:176-179|x = self.transformer.drop(tok_emb + pos_emb)]]","explain":"Each id becomes an `n_embd`-long vector (384 numbers in the baby GPT), plus a vector for its position. The result has shape (B, T, n_embd)."},{"title":"Run every block in order","at":"[[model.py:180-181|for block in self.transformer.h:]]","explain":"6 blocks for the baby GPT, 12 for GPT-2 small. Each keeps the shape (B, T, n_embd)."},{"title":"Inside a block: attention, then MLP, each added back","at":"[[model.py:103-106|x = x + self.mlp(self.ln_2(x))]]","explain":"LayerNorm first, then the sub-layer, then add the result to the input (a residual connection)."},{"title":"Make queries, keys and values for all heads","at":"[[model.py:55-59|self.c_attn(x).split(self.n_embd, dim=2)]]","explain":"One linear layer produces all three at once (3 × n_embd wide); each is reshaped to (B, n_head, T, head_size)."},{"title":"Causal attention","at":"[[model.py:61-71|scaled_dot_product_attention(q, k, v, attn_mask=None]]","explain":"With PyTorch 2.0 the fused kernel does it with `is_causal=True`; otherwise the manual path computes scores, masks the future with -inf, softmaxes and mixes the values."},{"title":"Merge heads and project","at":"[[model.py:72-76|y = self.resid_dropout(self.c_proj(y))]]","explain":"The heads are placed side by side again and one more linear layer mixes them."},{"title":"The MLP","at":"[[model.py:87-92|x = self.gelu(x)]]","explain":"Widen to 4 × n_embd, GELU, narrow back, dropout."},{"title":"Final LayerNorm","at":"[[model.py:182|x = self.transformer.ln_f(x)]]","explain":"One last normalisation before reading out predictions."},{"title":"Scores for every vocabulary entry, then the loss","at":"[[model.py:184-187|loss = F.cross_entropy(logits.view(-1, logits.size(-1)), targets.view(-1), ignore_index=-1)]]","explain":"`lm_head` gives (B, T, vocab_size) logits. Cross-entropy averages over all B × T positions how surprised the model was by the real next token."},{"title":"When sampling, only the last position","at":"[[model.py:188-193|inference-time mini-optimization]]","explain":"Without targets, only the final position's logits are computed, since only that one is used to pick the next token."}]},{"id":"train-step","title":"One training iteration with gradient accumulation","trigger":"Each pass through the `while True:` loop in `train.py`.","summary":"Set the learning rate, maybe evaluate and checkpoint, run `gradient_accumulation_steps` forward/backward passes, clip, step AdamW, clear the gradients, log.","steps":[{"title":"Set this iteration's learning rate","at":"[[train.py:257-260|lr = get_lr(iter_num) if decay_lr else learning_rate]]","explain":"`get_lr` ramps up linearly for `warmup_iters`, then follows a cosine down to `min_lr` [[train.py:231-242|coeff = 0.5 * (1.0 + math.cos(math.pi * decay_ratio))]]. The value is written into every parameter group."},{"title":"Every eval_interval: measure and save","at":"[[train.py:262-288|losses = estimate_loss()]]","explain":"Only the main process does it. `estimate_loss` averages `eval_iters` random batches per split in eval mode [[train.py:214-228|def estimate_loss():]], then a checkpoint may be written."},{"title":"Micro-step loop; DDP syncs only on the last one","at":"[[train.py:292-298|model.require_backward_grad_sync = (micro_step == gradient_accumulation_steps - 1)]]","explain":"With DDP, gradients are averaged across GPUs only on the final micro-step, which saves all but one round of communication per iteration."},{"title":"Forward under autocast, divide the loss","at":"[[train.py:299-301|loss = loss / gradient_accumulation_steps]]","explain":"The forward pass runs in bfloat16/float16 where safe. Dividing by the number of micro-steps makes the summed gradients equal to the average over the big batch."},{"title":"Fetch the next batch while the GPU works","at":"[[train.py:302-303|immediately async prefetch next batch]]","explain":"GPU work is queued asynchronously, so the CPU slices the next batch from the memmap while the GPU is still busy."},{"title":"Backward, scaled for float16","at":"[[train.py:304-305|scaler.scale(loss).backward()]]","explain":"Gradients are added into each weight's `.grad`; repeating this over the micro-steps is the accumulation."},{"title":"Unscale and clip","at":"[[train.py:306-309|torch.nn.utils.clip_grad_norm_(model.parameters(), grad_clip)]]","explain":"If the gradient vector is longer than 1.0 it is shrunk to length 1.0. Unscaling first means the threshold applies to the real gradients."},{"title":"AdamW step","at":"[[train.py:310-312|scaler.step(optimizer)]]","explain":"The optimizer built by `configure_optimizers` updates every weight [[model.py:280-284|optimizer = torch.optim.AdamW(optim_groups, lr=learning_rate, betas=betas, **extra_args)]]; the scaler skips the step if float16 overflowed."},{"title":"Drop the gradients","at":"[[train.py:313-314|optimizer.zero_grad(set_to_none=True)]]","explain":"Setting them to `None` frees the memory until the next backward pass recreates them."},{"title":"Log loss, time and MFU","at":"[[train.py:316-327|lossf = loss.item() * gradient_accumulation_steps]]","explain":"The printed loss is the last micro-batch's loss multiplied back up, an approximation. MFU is smoothed over iterations after the first 5."},{"title":"Stop after max_iters","at":"[[train.py:328-333|if iter_num > max_iters:]]","explain":"There is no notion of epochs: training ends on an iteration count."}]},{"id":"load-gpt2","title":"Finetune GPT-2 XL on Shakespeare from OpenAI's weights","trigger":"`python data/shakespeare/prepare.py`, then `python train.py config/finetune_shakespeare.py`.","summary":"The config sets `init_from = 'gpt2-xl'`; `GPT.from_pretrained` builds an empty nanoGPT of the right shape, downloads the Hugging Face checkpoint and copies every tensor across, transposing four kinds of weight.","steps":[{"title":"Tokenize Shakespeare with GPT-2's tokenizer","at":"[[data/shakespeare/prepare.py:19-30|enc.encode_ordinary(train_data)]]","explain":"Unlike the character version there is no `meta.pkl`: the ids are GPT-2 BPE ids, 301,966 for training."},{"title":"The config asks for GPT-2 XL and a tiny, constant learning rate","at":"[[config/finetune_shakespeare.py:10-25|init_from = 'gpt2-xl']]","explain":"20 iterations of 32,768 tokens at a constant 3e-5, saving only when validation improves."},{"title":"train.py hands over to from_pretrained","at":"[[train.py:181-188|model = GPT.from_pretrained(init_from, override_args)]]","explain":"Only dropout is passed through; the architecture values are then read back from the loaded model so the checkpoint records them."},{"title":"Pick the shape by name","at":"[[model.py:215-225|config_args['vocab_size'] = 50257]]","explain":"`gpt2-xl` means 48 layers, 25 heads, 1600 channels. Vocab 50257, context 1024 and biases on are forced because that is how OpenAI trained them."},{"title":"Build an empty nanoGPT and list its tensors","at":"[[model.py:230-235|discard this mask / buffer, not a param]]","explain":"The causal-mask buffer is skipped because it is not a learned weight."},{"title":"Download the Hugging Face model","at":"[[model.py:237-239|model_hf = GPT2LMHeadModel.from_pretrained(model_type)]]","explain":"`transformers` fetches and caches the checkpoint; its mask buffers are filtered out too."},{"title":"Copy tensors, transposing the Conv1D ones","at":"[[model.py:241-259|sd[k].copy_(sd_hf[k].t())]]","explain":"OpenAI stored four kinds of linear weights transposed (as \"Conv1D\"). Every other tensor is copied as is, and every shape is asserted to match."},{"title":"Optionally shrink the context","at":"[[train.py:189-192|model.crop_block_size(block_size)]]","explain":"If you pass a `block_size` below 1024, `crop_block_size` cuts the position table [[model.py:195-204|def crop_block_size(self, block_size):]]. The finetune config keeps 1024, so nothing changes."},{"title":"Train as usual","at":"[[config/finetune_shakespeare.py:16-21|32,768 tokens/iter]]","explain":"1 sequence per micro-batch × 32 accumulation steps × 1024 tokens keeps memory per micro-step small. If you still run out of memory, the README suggests a smaller GPT-2 or a shorter `block_size` [[README.md:166|If you're running out of memory try decreasing the model size]]."},{"title":"Sample with GPT-2's decoder","at":"[[sample.py:69-74|No meta.pkl found, assuming GPT-2 encodings]]","explain":"`python sample.py --out_dir=out-shakespeare` finds no `meta.pkl` in `data/shakespeare`, so it encodes and decodes with tiktoken."}]}],"milestones":[{"title":"1. Text becomes a file of integers","goal":"Turn any text file into `train.bin`, `val.bin` and a vocabulary, exactly like the character-level Shakespeare script.","files":["data/shakespeare_char/prepare.py"],"concepts":["Token","Vocabulary size (vocab_size)"],"explain":"Start with data because everything else consumes it and nothing in it depends on the model. A sorted set of characters is the vocabulary, two dicts translate both ways, and `np.uint16(...).tofile` writes the ids [[data/shakespeare_char/prepare.py:23-52|vocab_size = len(chars)]]. Save the vocabulary with pickle so later steps can decode [[data/shakespeare_char/prepare.py:54-61|pickle.dump(meta, f)]].","try":"Write your own 40-line `prepare.py` for a text file you like (song lyrics, code, a book). Print the vocab size and token counts, then read `train.bin` back with `np.fromfile(path, dtype=np.uint16)` and decode the first 200 ids to check they round-trip."},{"title":"2. A batch sampler: inputs and next-token targets","goal":"Write `get_batch`: pick random windows from the memmapped file and return x and y, where y is x shifted by one.","files":["train.py"],"concepts":["Memory-mapped file (memmap)","Context length (block_size)"],"explain":"This one function defines the task: given tokens 0..t, predict token t+1, for every t at once [[train.py:116-131|y = torch.stack([torch.from_numpy((data[i+1:i+1+block_size]).astype(np.int64)) for i in ix])]]. There is no dataset class and no epochs; random offsets are enough.","try":"Call your `get_batch` with batch_size=4, block_size=16, decode x[0] and y[0] and confirm y is x moved one character left. Then time 1,000 calls to see that batching is not your bottleneck."},{"title":"3. The building blocks: LayerNorm, attention, MLP, Block","goal":"Implement the four small modules and check that a (B, T, C) tensor goes in and a (B, T, C) tensor comes out.","files":["model.py"],"concepts":["Causal self-attention","Attention head","MLP (feed-forward)","Residual stream","LayerNorm"],"explain":"Write the manual attention path first (scores, causal mask, softmax, weighted sum) [[model.py:66-71|att = att.masked_fill(self.bias[:,:,:T,:T] == 0, float('-inf'))]]; switch to `scaled_dot_product_attention` once it works. A block is two residual adds [[model.py:94-106|class Block(nn.Module):]].","try":"Test causality: run a Block on a random (1, 8, 32) input, change only the last position, and assert the outputs at positions 0..6 did not change."},{"title":"4. The GPT: embeddings, blocks, head, loss","goal":"Assemble `GPT` with token and position embeddings, a stack of blocks, a final LayerNorm, a tied output layer, GPT-2 initialisation and cross-entropy loss.","files":["model.py"],"concepts":["Embedding","Weight tying","Logits","Cross-entropy loss"],"explain":"The class is mostly wiring [[model.py:120-148|self.transformer = nn.ModuleDict(dict(]]. The forward pass ends in one call to `F.cross_entropy` [[model.py:170-193|def forward(self, idx, targets=None):]].","try":"Build the baby config (n_layer=6, n_head=6, n_embd=384, block_size=256, vocab 65, bias=False) and check it prints 10.65M parameters. Feed one random batch: before training, the loss should be close to ln(65) ≈ 4.17. If it is much higher, your initialisation is off."},{"title":"5. The training loop","goal":"AdamW with weight-decay groups, warmup plus cosine learning rate, periodic evaluation on both splits, and a checkpoint dict you can resume from.","files":["train.py","model.py","configurator.py","config/train_shakespeare_char.py"],"concepts":["AdamW","Learning-rate schedule","Checkpoint"],"explain":"Keep it to forward, backward, clip, step, zero [[train.py:290-314|scaler.scale(loss).backward()]], with `estimate_loss` every few hundred steps [[train.py:214-228|def estimate_loss():]] and `torch.save` of the dict in [[train.py:277-284|'model': raw_model.state_dict(),]].","try":"Train the CPU recipe from the README for 2,000 iterations and plot train and val loss. Then train the full baby GPT with `--dropout=0.0` and watch both curves: if val loss turns back up while train loss keeps falling, that is overfitting, which the config's comment expects on this small dataset."},{"title":"6. Sampling","goal":"Load the checkpoint, encode a prompt, and generate token by token with temperature and top-k.","files":["model.py","sample.py"],"concepts":["Temperature","Top-k sampling"],"explain":"`generate` is a 10-line loop: crop to the context, forward, take the last logits, scale, filter, softmax, draw, append [[model.py:305-330|def generate(self, idx, max_new_tokens, temperature=1.0, top_k=None):]]. `sample.py` is the glue around it [[sample.py:76-89|start_ids = encode(start)]].","try":"Generate from the same checkpoint with temperature 0.2, 0.8 and 1.5 and the same seed. Describe in one sentence what changes. Then try top_k=1 and explain why every sample is now identical."},{"title":"7. Scaling up: precision, compile, accumulation, DDP, GPT-2 weights","goal":"Add the pieces that only matter on real GPUs and real data: bf16/fp16 autocast with a GradScaler, `torch.compile`, gradient accumulation, DDP, the OpenWebText pipeline and `from_pretrained`.","files":["train.py","model.py","data/openwebtext/prepare.py","config/train_gpt2.py","bench.py"],"concepts":["Mixed precision","GradScaler","Gradient accumulation","DDP (DistributedDataParallel)","MFU (model FLOPs utilization)"],"explain":"None of these change what is learned; they change how fast and how big. Each is a few lines: autocast context [[train.py:109-112|ctx = nullcontext() if device_type == 'cpu' else torch.amp.autocast]], DDP detection [[train.py:82-95|ddp = int(os.environ.get('RANK', -1)) != -1]], the accumulation loop [[train.py:292-301|loss = loss / gradient_accumulation_steps]] and the weight import [[model.py:206-261|def from_pretrained(cls, model_type, override_args=None):]].","try":"On a GPU, run `python bench.py --real_data=False` with and without `--compile=False`, and with `--dtype=float32`, and record ms/iter and MFU for each. Then run `python data/shakespeare/prepare.py` and `python train.py config/eval_gpt2.py --dataset=shakespeare` to get GPT-2's untouched loss on BPE Shakespeare, and compare it with what `config/finetune_shakespeare.py` reaches. (Do not compare it with the character model: a loss per BPE token and a loss per character are different units.)"}],"risks":[{"title":"The project is deprecated","severity":"medium","at":"[[README.md:9|It is very likely you meant to use/find nanochat instead]]","why":"Since November 2025 the README points to nanochat and says nanoGPT is kept up for posterity. Expect no new fixes; PyTorch APIs it uses may drift (for example `torch.cuda.amp.GradScaler` [[train.py:196|torch.cuda.amp.GradScaler]], for which PyTorch 2.6 prints a `FutureWarning` asking for `torch.amp.GradScaler('cuda', ...)` instead).","advice":"Use it to learn and as a baseline. If you build on it, pin your PyTorch version and expect to patch warnings yourself."},{"title":"Scripts only work from the repo root","severity":"medium","at":"[[train.py:77|exec(open('configurator.py').read())]]","why":"`configurator.py`, `data/\u003cdataset>/` and `out_dir` are all relative paths [[train.py:115|data_dir = os.path.join('data', dataset)]]. Running `python nanoGPT/train.py` from a parent folder fails with `FileNotFoundError: configurator.py`.","advice":"`cd` into the repo first. If you need to run from elsewhere, build paths from `os.path.dirname(__file__)` as the data scripts do."},{"title":"Defaults assume a CUDA GPU with torch.compile support","severity":"medium","at":"[[train.py:72-74|compile = True # use PyTorch 2.0 to compile the model to be faster]]","why":"`device = 'cuda'` and `compile = True` are the defaults. On a CPU-only machine, a Mac or Windows you must pass `--device=cpu` (or `mps`) and `--compile=False`; the README notes torch.compile was not available on all platforms [[README.md:224|not yet available on all platforms (e.g. Windows)]].","advice":"Start every non-CUDA run with `--device=cpu --compile=False`, as in the README's laptop recipe."},{"title":"best_val_loss is not the best when always_save_checkpoint is on","severity":"medium","at":"[[train.py:274-286|if losses['val'] \u003c best_val_loss or always_save_checkpoint:]]","why":"With the default `always_save_checkpoint = True`, the branch runs after every evaluation and sets `best_val_loss` to the latest value, better or worse. There is one `ckpt.pt`, overwritten each time, so if a run diverges late, the good weights are gone.","advice":"Set `always_save_checkpoint = False` (as both Shakespeare configs do) to keep only improvements, or change the save path to include `iter_num` if you want history."},{"title":"Command-line overrides are strictly typed and naively parsed","severity":"low","at":"[[configurator.py:29-45|assert type(attempt) == type(globals()[key])]]","why":"`--learning_rate=1` is an `int` and fails against the float default with a bare `AssertionError`; you must write `1.0` or `1e0`. `arg.split('=')` breaks on values that contain `=`, so a `--start` prompt like `--start=\"x = 1\"` fails. Config files are not type-checked at all.","advice":"Write floats with a decimal point. Put long or `=`-containing prompts in a file and pass `--start=FILE:prompt.txt`."},{"title":"Character-level sampling crashes on unseen characters","severity":"low","at":"[[sample.py:66-68|stoi[c] for c in s]]","why":"The Shakespeare vocabulary has 65 characters and only one digit, `3` [[data/shakespeare_char/prepare.py:63-66|# vocab size: 65]]. A prompt containing `7`, `é` or `{` raises `KeyError`.","advice":"Check the prompt against `stoi` first, or drop unknown characters in `encode`."},{"title":"No automated tests","severity":"medium","at":"[[model.py:241-259|assert sd_hf[k].shape[::-1] == sd[k].shape]]","why":"The repo has no test files. The only correctness checks are `assert` statements inline, such as the shape checks when importing GPT-2 weights. Bugs like the missing loss scaling under gradient accumulation (`553f949`) and the warmup starting at learning rate 0 (`dc81cb3`) were found by reading and by users.","advice":"Before changing `model.py`, record the loss of a fixed seed on a short Shakespeare run and compare after. Exercise 7 builds a real regression test against Hugging Face's GPT-2."},{"title":"Imported GPT-2 models run with a slightly different GELU","severity":"low","at":"[[model.py:78-92|self.gelu    = nn.GELU()]]","why":"The MLP uses PyTorch's exact `nn.GELU()`. Until `594068e` (\"Use nn.GELU\") the file had its own tanh-approximation `new_gelu`, described as \"identical to OpenAI GPT\". Weights loaded with `from_pretrained` were trained with the approximation, so nanoGPT's outputs differ from OpenAI's by a small numerical amount. Inferred from that diff; no commit discusses the effect.","advice":"It does not matter for finetuning. If you need bit-for-bit agreement with Hugging Face's GPT-2, use `nn.GELU(approximate='tanh')`."},{"title":"The printed loss and MFU are approximations","severity":"low","at":"[[train.py:321-327|approximating the true total loss (exact would have been a sum)]]","why":"The per-iteration loss is the last micro-batch's loss times the number of micro-steps, not the average over all of them. MFU is measured against a hard-coded A100 bfloat16 peak of 312 TFLOPS [[model.py:299-302|flops_promised = 312e12]], so on any other GPU the percentage is not comparable. Iteration time `dt` also includes evaluation time on eval iterations.","advice":"Trust the `step N: train loss … val loss …` lines from `estimate_loss` for comparisons. Change `flops_promised` to your GPU's peak if you care about MFU."},{"title":"bench.py needs CUDA","severity":"low","at":"[[bench.py:96-99|torch.cuda.synchronize()]]","why":"It calls `torch.cuda.synchronize()` and `pin_memory()` unconditionally [[bench.py:42|x, y = x.pin_memory().to(device, non_blocking=True)]], so `--device=cpu` fails. With the default `real_data=True` it also needs the 17 GB OpenWebText `train.bin`.","advice":"Run it only on a GPU, with `--real_data=False` if you have not prepared OpenWebText."},{"title":"DDP requires the GPU count to divide gradient_accumulation_steps","severity":"low","at":"[[train.py:92-95|assert gradient_accumulation_steps % ddp_world_size == 0]]","why":"The default 40 works for 1, 2, 4, 5 or 8 processes. With 3, 6 or 7 GPUs the run stops at start-up with an `AssertionError`.","advice":"Pass a `--gradient_accumulation_steps` that is a multiple of your GPU count, and adjust `batch_size` to keep tokens per step where you want them."},{"title":"OpenWebText preparation needs a lot of disk and time","severity":"low","at":"[[data/openwebtext/prepare.py:21-23|takes 54GB in huggingface .cache dir]]","why":"About 54 GB of Hugging Face cache plus a 17 GB `train.bin`, with tokenization spread over a hard-coded 8 processes.","advice":"Check free disk space first and set `num_proc` to about half your CPU cores, as the comment suggests."},{"title":"A known-unknown warning with tied weights and torch.compile","severity":"low","at":"[[model.py:134-138|TODO investigate]]","why":"The author notes that weight tying under `torch.compile` emits a deprecation warning and that he is \"not 100% sure what this is\".","advice":"Ignore the warning for training; if you upgrade PyTorch and it becomes an error, untie the weights under compile or move the tie after compilation and test."}],"stack":[{"name":"PyTorch","category":"Deep learning framework","role":"Everything numeric: tensors, the layers in `model.py` (`nn.Linear`, `nn.Embedding`), automatic gradients, the AdamW optimizer, mixed-precision autocast, multi-GPU DDP and `torch.compile`.","why":"The de facto research framework, and its 2.0 release brought `torch.compile` and fused attention kernels that nanoGPT uses directly.","where":"[[model.py:14-16|import torch.nn as nn]]","primer":"PyTorch gives you **tensors**: n-dimensional arrays of numbers that can live on a GPU. You build a network by subclassing `nn.Module` and writing a `forward` method that turns input tensors into output tensors. PyTorch records every operation, so calling `loss.backward()` fills each weight's `.grad` with how much the loss would change if that weight moved. An **optimizer** then nudges every weight against its gradient. That is the whole training cycle: forward, backward, step, repeat."},{"name":"NumPy","category":"Array library","role":"Writes token ids to disk as raw `uint16` arrays and reads random windows back with `np.memmap` without loading the whole file.","why":"A `.bin` file of `uint16` values is the simplest dataset format there is: no parsing, no index, and the OS caches it.","where":"[[train.py:120-125|np.memmap(os.path.join(data_dir, 'train.bin'), dtype=np.uint16, mode='r')]]","primer":"NumPy is Python's standard library for arrays of numbers. nanoGPT uses two features: `np.array(ids, dtype=np.uint16).tofile(path)` to dump a list of integers as raw bytes (2 bytes each), and `np.memmap(path, dtype=np.uint16)` to treat that file as if it were an array in memory while only reading the parts you index."},{"name":"tiktoken","category":"Tokenizer","role":"OpenAI's GPT-2 byte-pair encoding: turns text into ids from a 50,257-entry vocabulary for the `shakespeare` and `openwebtext` datasets, and back into text in `sample.py`.","why":"Matching GPT-2's tokenizer exactly is required to reuse GPT-2's weights; tiktoken is OpenAI's fast implementation.","where":"[[data/shakespeare/prepare.py:19-22|enc.encode_ordinary(train_data)]]","primer":"A model cannot read letters; it reads integers. A **tokenizer** chops text into pieces called **tokens** and gives each piece an id. GPT-2's tokenizer uses byte-pair encoding (BPE): frequent chunks like ` the` or `ing` get their own id, rare words are split into several pieces. `enc.encode_ordinary(text)` returns a list of ids; `enc.decode(ids)` returns the text."},{"name":"Hugging Face transformers","category":"Pretrained weights","role":"Used in exactly one place: `GPT.from_pretrained` downloads OpenAI's GPT-2 checkpoints and copies the tensors into nanoGPT's own `GPT` class.","why":"It is the most common host for the GPT-2 weights; nanoGPT borrows only the weights, not the model code.","where":"[[model.py:212|from transformers import GPT2LMHeadModel]]","primer":"`transformers` is a library of ready-made model implementations plus a download service for their weights. nanoGPT imports it lazily inside `from_pretrained`, so you only need it if you start from GPT-2."},{"name":"Hugging Face datasets","category":"Dataset download","role":"Downloads OpenWebText (about 8 million documents) and tokenizes it in parallel with `.map(num_proc=8)`.","why":"Handles the 54 GB download, caching and multiprocessing that a hand-written script would need.","where":"[[data/openwebtext/prepare.py:21-27|load_dataset(]]","primer":"`datasets` downloads public datasets into a local cache (`~/.cache/huggingface`) and lets you transform every row with `.map(fn)`, optionally across several processes. You only need it for the GPT-2 reproduction."},{"name":"torchrun and DistributedDataParallel (NCCL)","category":"Multi-GPU training","role":"`torchrun` starts one Python process per GPU and sets `RANK`, `LOCAL_RANK`, `WORLD_SIZE`; `train.py` wraps the model in `DDP` so gradients are averaged across processes over NCCL.","why":"Data parallelism is the simplest way to use 8 GPUs: each one trains on different batches and they agree on the gradient.","where":"[[train.py:82-95|init_process_group(backend=backend)]]","primer":"With **data parallelism**, every GPU holds a full copy of the model and processes different examples. After the backward pass the GPUs average their gradients (an \"all-reduce\"), so every copy takes the identical optimizer step and the copies never drift apart. PyTorch's `DistributedDataParallel` does the averaging during `backward()`; NCCL is NVIDIA's library that moves the numbers between GPUs."},{"name":"torch.compile and Flash attention","category":"Speed (PyTorch 2.0)","role":"`torch.compile(model)` fuses the model's operations into faster GPU kernels; `F.scaled_dot_product_attention` runs attention with a fused Flash kernel when available.","why":"The README measured iteration time dropping from about 250 ms to 135 ms from the one compile line [[README.md:209|cutting down iteration time from ~250ms / iter to 135ms / iter]].","where":"[[train.py:205-208|model = torch.compile(model) # requires PyTorch 2.0]]","primer":"Normally PyTorch runs each operation as its own GPU call, writing intermediate results to memory in between. `torch.compile` traces your model once (that is the \"takes a ~minute\" at start-up) and generates combined kernels that skip those round-trips. Flash attention does the same for attention specifically, never materialising the full T×T score matrix in GPU memory."},{"name":"Weights & Biases (wandb)","category":"Experiment logging (optional)","role":"If `wandb_log=True`, the main process logs train/val loss, learning rate and MFU at every evaluation.","why":"Off by default, and imported only when enabled, so it is not a hard dependency.","where":"[[train.py:244-247|wandb.init(project=wandb_project, name=wandb_run_name, config=config)]]","primer":"wandb is a hosted dashboard for training runs: you call `wandb.log({...})` with numbers and it draws the curves online."},{"name":"tqdm and requests","category":"Utilities","role":"`tqdm` draws the progress bar while OpenWebText is written to disk; `requests` downloads tiny Shakespeare. `requests` is not in the README's install line; it usually arrives as a dependency of `transformers` or `datasets`.","why":"Small conveniences for the data scripts only.","where":"[[data/shakespeare_char/prepare.py:12-17|requests.get(data_url).text]]","primer":""},{"name":"Jupyter, matplotlib, pandas","category":"Analysis notebooks","role":"Only for `scaling_laws.ipynb` and `transformer_sizing.ipynb`, which do paper-and-pencil maths about model size, FLOPs and compute budgets. Not needed to train.","why":"Notebooks keep the derivations next to their outputs and plots.","where":"[[scaling_laws.ipynb]]","primer":""}],"verification":{"checked_at":"2026-11-06T15:10:22","commit":"3adf61e","citations":496,"verified":496,"auto_fixed":0,"files_cited":18,"errors":0,"warnings":0,"lessons":34}},"scan":{"name":"nanoGPT","summary":{"files":26,"source_files":17,"test_files":0,"lines":2414,"kinds":{"other":3,"doc":4,"asset":2,"source":17}},"languages":[{"lang":"Python","files":15,"lines":1220,"share":50.5},{"lang":"Jupyter","files":2,"lines":1194,"share":49.5}],"entrypoints":[{"path":"bench.py","why":"script with top-level code"},{"path":"data/openwebtext/prepare.py","why":"runs as a script (__main__)"},{"path":"sample.py","why":"script with top-level code"},{"path":"train.py","why":"script with top-level code"}],"modules":[{"name":"(root)","files":7,"lines":2113},{"name":"data","files":3,"lines":182},{"name":"config","files":7,"lines":119}],"module_edges":[],"env_vars":[{"name":"LOCAL_RANK","files":["train.py"]},{"name":"RANK","files":["train.py"]},{"name":"WORLD_SIZE","files":["train.py"]}],"todos":[{"path":"sample.py","line":65,"tag":"TODO","text":"want to make this more general to arbitrary encoder/decoder schemes"}],"external_packages":[{"name":"os","files":6} g/train_gpt2.py","l":"Python","k":"source","n":25,"s":22.2,"c":3,"h":"472695d435f7"},{"p":"config/train_shakespeare_char.py","l":"Python","k":"source","n":37,"s":29.0,"c":5,"h":"5f2464167c82"},{"p":"configurator.py","l":"Python","k":"source","n":47,"s":15.8,"c":1,"h":"49a2c7fefe2f"},{"p":"data/openwebtext/prepare.py","l":"Python","k":"source","n":81,"s":63.6,"c":9,"h":"4c0fe4104a49"},{"p":"data/openwebtext/readme.md","l":"Markdown","k":"doc","n":15,"s":25.1,"c":1,"h":"066e77ed5ff7"},{"p":"data/shakespeare/prepare.py","l":"Python","k":"source","n":33,"s":28.5,"c":5,"h":"c64196595beb"},{"p":"data/shakespeare/readme.md","l":"Markdown","k":"doc","n":9,"s":24.5,"c":1,"h":"8ceefe5790dd"},{"p":"data/shakespeare_char/prepare.py","l":"Python","k":"source","n":68,"s":33.9,"c":6,"h":"f5b90a02005a"},{"p":"data/shakespeare_char/readme.md","l":"Markdown","k":"doc","n":9,"s":24.5,"c":1,"h":"0d051135827f"},{"p":"model.py","l":"Python","k":"source","n":330,"s":100.0,"u":["bench.py","sample.py","train.py"],"c":30,"h":"f2df7c6f7d72"},{"p":"sample.py","l":"Python","k":"source","n":89,"s":69.4,"i":["model.py"],"c":14,"h":"d07671fe7533"},{"p":"scaling_laws.ipynb","l":"Jupyter","k":"source","n":792,"s":51.6,"c":6,"h":"da30a9a35eba"},{"p":"train.py","l":"Python","k":"source","n":336,"s":96.3,"i":["model.py"],"c":57,"h":"109abe15e1a7"},{"p":"transformer_sizing.ipynb","l":"Jupyter","k":"source","n":402,"s":41.8,"c":4,"h":"5dfa44ef9d20"}]},"snippets":{"LICENSE:1-3":{"path":"LICENSE","start":1,"end":3,"from":1,"code":"MIT License\n\nCopyright (c) 2022 Andrej Karpathy\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal","total":21},"README.md:13-13":{"path":"README.md","start":13,"end":13,"from":10,"code":"\n---\n\nThe simplest, fastest repository for training/finetuning medium-sized GPTs. It is a rewrite of [minGPT](https://github.com/karpathy/minGPT) that prioritizes teeth over education. Still under active development, but currently the file `train.py` reproduces GPT-2 (124M) on OpenWebText, running on a single 8XA100 40GB node in about 4 days of training. The code itself is plain and readable: `train.py` is a ~300-line boilerplate training loop and `model.py` a ~300-line GPT model definition, which can optionally load the GPT-2 weights from OpenAI. That's it.\n\n![repro124m](assets/gpt2_124M_loss.png)\n","total":234},"README.md:9-9":{"path":"README.md","start":9,"end":9,"from":6,"code":"\n---\n\n**Update Nov 2025** nanoGPT has a new and improved cousin called [nanochat](https://github.com/karpathy/nanochat). It is very likely you meant to use/find nanochat instead. nanoGPT (this repo) is now very old and deprecated but I will leave it up for posterity.\n\n---\n","total":234},"README.md:22-22":{"path":"README.md","start":22,"end":22,"from":19,"code":"## install\n\n```\npip install torch numpy transformers datasets tiktoken wandb tqdm\n```\n\nDependencies:","total":234},"data/shakespeare_char/prepare.py:48-61":{"path":"data/shakespeare_char/prepare.py","start":48,"end":61,"from":45,"code":"print(f\"train has {len(train_ids):,} tokens\")\nprint(f\"val has {len(val_ids):,} tokens\")\n\n# export to bin files\ntrain_ids = np.array(train_ids, dtype=np.uint16)\nval_ids = np.array(val_ids, dtype=np.uint16)\ntrain_ids.tofile(os.path.join(os.path.dirname(__file__), 'train.bin'))\nval_ids.tofile(os.path.join(os.path.dirname(__file__), 'val.bin'))\n\n# save the meta information as well, to help us encode/decode later\nmeta = {\n    'vocab_size': vocab_size,\n    'itos': itos,\n    'stoi': stoi,\n}\nwith open(os.path.join(os.path.dirname(__file__), 'meta.pkl'), 'wb') as f:\n    pickle.dump(meta, f)\n\n# length of dataset in characters:  1115394\n# all the unique characters:","total":68},"config/train_shakespeare_char.py:17-25":{"path":"config/train_shakespeare_char.py","start":17,"end":25,"from":14,"code":"wandb_run_name = 'mini-gpt'\n\ndataset = 'shakespeare_char'\ngradient_accumulation_steps = 1\nbatch_size = 64\nblock_size = 256 # context of up to 256 previous characters\n\n# baby GPT model :)\nn_layer = 6\nn_head = 6\nn_embd = 384\ndropout = 0.2\n\nlearning_rate = 1e-3 # with baby networks can afford to go a bit higher\nmax_iters = 5000","total":37},"README.md:51-51":{"path":"README.md","start":51,"end":51,"from":48,"code":"python train.py config/train_shakespeare_char.py\n```\n\nIf you peek inside it, you'll see that we're training a GPT with a context size of up to 256 characters, 384 feature channels, and it is a 6-layer Transformer with 6 heads in each layer. On one A100 GPU this training run takes about 3 minutes and the best validation loss is 1.4697. Based on the configuration, the model checkpoints are being written into the `--out_dir` directory `out-shakespeare-char`. So once the training finishes we can sample from the best model by pointing the sampling script at this directory:\n\n```sh\npython sample.py --out_dir=out-shakespeare-char","total":234},"README.md:85-85":{"path":"README.md","start":85,"end":85,"from":82,"code":"**I only have a macbook** (or other cheap computer). No worries, we can still train a GPT but we want to dial things down a notch. I recommend getting the bleeding edge PyTorch nightly ([select it here](https://pytorch.org/get-started/locally/) when installing) as it is currently quite likely to make your code more efficient. But even without it, a simple train run could look as follows:\n\n```sh\npython train.py config/train_shakespeare_char.py --device=cpu --compile=False --eval_iters=20 --log_interval=1 --block_size=64 --batch_size=12 --n_layer=4 --n_head=4 --n_embd=128 --max_iters=2000 --lr_decay_iters=2000 --dropout=0.0\n```\n\nHere, since we are running on CPU instead of GPU we must set both `--device=cpu` and also turn off PyTorch 2.0 compile with `--compile=False`. Then when we evaluate we get a bit more noisy but faster estimate (`--eval_iters=20`, down from 200), our contex ave to note that GPT-2 was trained on (closed, never released) WebText, while OpenWebText is just a best-effort open reproduction of this dataset. This means there is a dataset domain gap. Indeed, taking the GPT-2 (124M) checkpoint and finetuning on OWT directly for a while reaches loss down to ~2.85. This then becomes the more appropriate baseline w.r.t. reproduction.\n\n## finetuning\n","total":234},"README.md:196-201":{"path":"README.md","start":196,"end":201,"from":193,"code":"\nUse the script `sample.py` to sample either from pre-trained GPT-2 models released by OpenAI, or from a model you trained yourself. For example, here is a way to sample from the largest available `gpt2-xl` model:\n\n```sh\npython sample.py \\\n    --init_from=gpt2-xl \\\n    --start=\"What is the answer to life, the universe, and everything?\" \\\n    --num_samples=5 --max_new_tokens=100\n```\n\nIf you'd like to sample from a model you trained, use the `--out_dir` to point the code appropriately. You can also prompt the model with some text from a file, e.g. ```python sample.py --start=FILE:prompt.txt```.\n","total":234},"train.py:126-130":{"path":"train.py","start":126,"end":130,"from":123,"code":"    ix = torch.randint(len(data) - block_size, (batch_size,))\n    x = torch.stack([torch.from_numpy((data[i:i+block_size]).astype(np.int64)) for i in ix])\n    y = torch.stack([torch.from_numpy((data[i+1:i+1+block_size]).astype(np.int64)) for i in ix])\n    if device_type == 'cuda':\n        # pin arrays x,y, which allows us to move them to GPU asynchronously (non_blocking=True)\n        x, y = x.pin_memory().to(device, non_blocking=True), y.pin_memory().to(device, non_blocking=True)\n    else:\n        x, y = x.to(device), y.to(device)\n    return x, y\n\n# init these up here, can override if init_from='resume' (i.e. from a checkpoint)","total":336},"model.py:53-53":{"path":"model.py","start":53,"end":53,"from":50,"code":"                                        .view(1, 1, config.block_size, d better init etc.\n\n## troubleshooting\n","total":234},"configurator.py:20-45":{"path":"configurator.py","start":20,"end":45,"from":17,"code":"import sys\nfrom ast import literal_eval\n\nfor arg in sys.argv[1:]:\n    if '=' not in arg:\n        # assume it's the name of a config file\n        assert not arg.startswith('--')\n        config_file = arg\n        print(f\"Overriding config with {config_file}:\")\n        with open(config_file) as f:\n            print(f.read())\n        exec(open(config_file).read())\n    else:\n        # assume it's a --key=value argument\n        assert arg.startswith('--')\n        key, val = arg.split('=')\n        key = key[2:]\n        if key in globals():\n            try:\n                # attempt to eval it it (e.g. if bool, number, or etc)\n                attempt = literal_eval(val)\n            except (SyntaxError, ValueError):\n                # if that goes wrong, just use the string\n                attempt = val\n            # ensure the types match ok\n            assert type(attempt) == type(globals()[key])\n            # cross fingers\n            print(f\"Overriding: {key} = {attempt}\")\n            globals()[key] = attempt\n        else:\n            raise ValueError(f\"Unknown config key: {key}\")","total":47},"configurator.py:1-15":{"path":"configurator.py","start":1,"end":15,"from":1,"code":"\"\"\"\nPoor Man's Configurator. Probably a terrible idea. Example usage:\n$ python train.py config/override_file.py --batch_size=32\nthis will first run config/override_file.py, then override batch_size to 32\n\nThe code in this file will be run as follows from e.g. train.py:\n>>> exec(open('configurator.py').read())\n\nSo it's not a Python module, it's just shuttling this code away from train.py\nThe code in this script then overrides the globals()\n\nI know people are not going to love this, I just really dislike configuration\ncomplexity and having to prepend config. to every single variable. If someone\ncomes up with ansformers PyTorch implementation:\nhttps://github.com/huggingface/transformers/blob/main/src/transformers/models/gpt2/modeling_gpt2.py\n\"\"\"\n\nimport math\nimport inspect","total":330},"model.py:29-76":{"path":"model.py","start":29,"end":76,"from":26,"code":"    def forward(self, input):\n        return F.layer_norm(input, self.weight.shape, self.weight, self.bias, 1e-5)\n\nclass CausalSelfAttention(nn.Module):\n\n    def __init__(self, config):\n        super().__init__()\n        assert config.n_embd % config.n_head == 0\n        # key, query, value projections for all heads, but in a batch\n        self.c_attn = nn.Linear(config.n_embd, 3 * config.n_embd, bias=config.bias)\n        # output projection\n        self.c_proj = nn.Linear(config.n_embd, config.n_embd, bias=config.bias)\n        # regularization\n        self.attn_dropout = nn.Dropout(config.dropout)\n        self.resid_dropout = nn.Dropout(config.dropout)\n        self.n_head = config.n_head\n        self.n_embd = config.n_embd\n        self.dropout = config.dropout\n        # flash attention make GPU go brrrrr but support is only in PyTorch >= 2.0\n        self.flash = hasattr(torch.nn.functional, 'scaled_dot_product_attention')\n        if not self.flash:\n            print(\"WARNING: using slow attention. Flash Attention requires PyTorch >= 2.0\")\n            # causal mask to ensure that attention is only applied to the left in the input sequence\n            self.register_buffer(\"bias\", torch.tril(torch.ones(config.block_size, config.block_size))\n                                        .view(1, 1, config.block_size, config.block_size))\n\n    def forward(self, x):\n        B, T, C = x.size() # batch size, sequence length, embedding dimensionality (n_embd)\n\n        # calculate query, key, values for all heads in batch and move head forward to be the batch dim\n        q, k, v  = self.c_attn(x).split(self.n_embd, dim=2)\n        k = k.view(B, T, self.n_head, C // self.n_head).transpose(1, "start":363,"end":363,"from":360,"code":"   \"cell_type\": \"markdown\",\n   \"metadata\": {},\n   \"source\": [\n    \"This is not a bad estimate at all. I trained this model and it converged in roughly 4 days. Btw as a good reference for where 6ND comes from and some intuition around it I recommend [Dzmitry's post](https://medium.com/@dzmitrybahdanau/the-flops-calculus-of-language-model-training-3b19c1f025e4).\"\n   ]\n  },\n  {","total":402},"transformer_sizing.ipynb:75-75":{"path":"transformer_sizing.ipynb","start":75,"end":75,"from":72,"code":"    }\n   ],\n   \"source\": [\n    \"def params():\\n\",\n    \"    \\\"\\\"\\\" estimates the number of parameters in the model\\\"\\\"\\\"\\n\",\n    \"    out = OrderedDict()\\n\",\n    \"\\n\",","total":402},"transformer_sizing.ipynb:215-215":{"path":"transformer_sizing.ipynb","start":215,"end":215,"from":212,"code":"    }\n   ],\n   \"source\": [\n    \"def flops():\\n\",\n    \"    # we only count Weight FLOPs, all other layers (LayerNorm, Softmax, etc) are effectively irrelevant\\n\",\n    \"    # we count actual FLOPs, not MACs. Hence 2* all over the place\\n\",\n    \"    # basically for any matrix multiply A (BxC) @ B (CxD) -> (BxD) flops are 2*B*C*D\\n\",","total":402},"transformer_sizing.ipynb:277-283":{"path":"transformer_sizing.ipynb","start":277,"end":283,"from":274,"code":"   \"source\": [\n    \"# now here is an estimate copy pasted from the PaLM paper\\n\",\n    \"# this formula is often used to calculate MFU (model flops utilization)\\n\",\n    \"def palm_flops():\\n\",\n    \"    \\\"\\\"\\\"estimate of the model flops following PaLM paper formula\\\"\\\"\\\"\\n\",\n    \"    # non-embedding model parameters. note that we do not subtract the\\n\",\n    \"    # embedding/token params because those are tied and get used in the last layer.\\n\",\n    \"    N = params()['total'] - params()['emebedding/position']\\n\",\n    \"    L, H, Q, T = n_layer, n_head, n_embd//n_head, block_size\\n\",\n    \"    mf_per_token = 6*N + 12*L*H*Q*T\\n\",\n    \"    mf = mf_per_token * block_size\\n\",\n    \"    return mf\\n\",\n    \"\\n\",","total":402},"scaling_laws.ipynb:8-8":{"path":"scaling_laws.ipynb","start":8,"end":8,"from":5,"code":"   \"cell_type\": \"markdown\",\n   \"metadata\": {},\n   \"source\": [\n    \"Reproducing some scaling laws results from [Chinchilla](https://arxiv.org/pdf/2203.15556.pdf). Can't get the numbers to match exactly, but can still be used as a rough guide to help determine compute-optimal models. Also contains related utilities for calculating flops and param counts.\"\n   ]\n  },\n  {","total":792},"scaling_laws.ipynb:569-569":{"path":"scaling_laws.ipynb","start":569,"end":569,"from":566,"code":"   \"source\": [\n    \"In the plot above, basically the models on the left of best are too small and trained for too long. The models on the right of best are way too large and trained for too little. The model at the red line is just right.\\n\",\n    \"\\n\",\n    \"Now, the Chinchilla paper says that best model size for this flop budget is 400M params and 9.2B tokens (instead of 316M params and 11.65B tokens) so there is some unresolved disagreement here too...\"\n   ]\n  },\n  {","total":792},"scaling_laws.ipynb:50-50":{"path":"scaling_laws.ipynb","start":50,"end":50,"from":47,"code":"    }\n   ],\n   \"source\": [\n    \"def gpt_params(seq_len, vocab_size, d_model, num_heads, num_layers):\\n\",\n    \"    \\\"\\\"\\\" Given GPT config calculate total number of parameters \\\"\\\"\\\"\\n\",\n    \"    ffw_size = 4*d_model # in GPT the number of intermediate features is always 4*d_model\\n\",\n    \"    # token and position embeddings\\n\",","total":792},"scaling_laws.ipynb:178-178":{"path":"scaling_laws.ipynb","start":178,"end":178,"from":175,"code":"   \"metadata\": {},\n   \"outputs\": [],\n   \"source\": [\n    \"def chinchilla_flops(seq_len, vocab_size, d_model, num_heads, num_layers, ffw_size):\\n\",\n    \"    \\\"\\\"\\\" \\n\",\n    \"    Calculate total number of FLOPs, see Chinchilla \\n\",\n    \"    paper Appendix F as reference: https://arxiv.org/pdf/2203.15556.pdf\\n\",","total":792},"scaling_laws.ipynb:462-467":{"path":"scaling_laws.ipynb","start":462,"end":467,"from":459,"code":"    }\n   ],\n   \"source\": [\n    \"def L(N, D):\\n\",\n    \"    \\\"\\\"\\\" \\n\",\n    \"    Approximates loss given N parameters and D dataset size (in tokens),\\n\",\n    \"    per Chinchilla paper.\\n\",\n    \"    \\\"\\\"\\\"\\n\",\n    \"    E = 1.69 # entropy of natural language, limit of infinite model on infinite data\\n\",\n    \"    A = 406.4\\n\",\n    \"    B = 410.7\\n\",\n    \"    alpha = 0.34\\n\",","total":792},"README.md:35-54":{"path":"README.md","start":35,"end":54,"from":32,"code":"-  `wandb` for optional logging \u003c3\n-  `tqdm` for progress bars \u003c3\n\n## quick start\n\nIf you are not a deep learning professional and you just want to feel the magic and get your feet wet, the fastest way to get started is to train a character-level GPT on the works of Shakespeare. First, we download it as a single (1MB) file and turn it from raw text into one large stream of integers:\n\n```sh\npython data/shakespeare_char/prepare.py\n```\n\nThis creates a `train.bin` and `val.bin` in that data directory. Now it is time to train your GPT. The size of it very much depends on the computational resources of your system:\n\n**I have a GPU**. Great, we can quickly train a baby GPT with the settings provided in the [config/train_shakespeare_char.py](config/train_shakespeare_char.py) config file:\n\n```sh\npython train.py config/train_shakespeare_char.py\n```\n\nIf you peek inside it, you'll see that we're training a GPT with a context size of up to 256 characters, 384 feature channels, and it is a 6-layer Transformer with 6 heads in each layer. On one A100 GPU this training run takes about 3 minutes and the best validation loss is 1.4697. Based on the configuration, the model checkpoints are being written into the `--out_dir` directory `out-shakespeare-char`. So once the training finishes we can sample from the best model by pointing the sampling script at this directory:\n\n```sh\npython sample.py --out_dir=out-shakespeare-char\n```\n\nThis generates a few samples, for example:","total":234},"README.md:107-121":{"path":"README.md","start":107,"end":121,"from":104,"code":"\nFinally, on Apple Silicon Macbooks and with a recent PyTorch version make sure to add `--device=mps` (short for \"Metal Performance Shaders\"); PyTorch then uses the on-chip GPU that can *significantly* accelerate training (2-3X) and allow you to use larger networks. See [Issue 28](https://github.com/karpathy/nanoGPT/issues/28) for more.\n\n## reproducing GPT-2\n\nA more serious deep learning professional may be more interested in reproducing GPT-2 results. So here we go - we first tokenize the dataset, in this case the [OpenWebText](https://openwebtext2.readthedocs.io/en/latest/), an open reproduction of OpenAI's (private) WebText:\n\n```sh\npython data/openwebtext/prepare.py\n```\n\nThis downloads and tokenizes the [OpenWebText](https://huggingface.co/datasets/openwebtext) dataset. It will create a `train.bin` and `val.bin` which holds the GPT2 BPE token ids in one sequence, stored as raw uint16 bytes. Then we're ready to kick off training. To reproduce GPT-2 (124M) you'll want at least an 8X A100 40GB node and run:\n\n```sh\ntorchrun --standalone --nproc_per_node=8 train.py config/train_gpt2.py\n```\n\nThis will run for about 4 days using PyTorch Distributed Data Parallel (DDP) and go down to loss of ~2.85. Now, a GPT-2 model just evaluated on OWT gets a val loss of about 3.11, but if you finetune it it will come down to ~2.85 territory (due to an apparent domain gap), making the two models ~match.\n\nIf you're in a cluster environment and you are blessed with multiple GPU nodes you can make GPU go brrrr e.g. across 2 nodes like:\n","total":234},"README.md:222-224":{"path":"README.md","start":222 ss gets a different seed\n    # world_size number of processes will be training simultaneously, so we can scale\n    # down the desired gradient accumulation iterations per process proportionally\n    assert gradient_accumulation_steps % ddp_world_size == 0\n    gradient_accumulation_steps //= ddp_world_size\nelse:\n    # if not ddp, we are running on a single gpu, and one process\n    master_process = True","total":336},"train.py:292-301":{"path":"train.py","start":292,"end":301,"from":289,"code":"\n    # forward backward update, with optional gradient accumulation to simulate larger batch size\n    # and using the GradScaler if data type is float16\n    for micro_step in range(gradient_accumulation_steps):\n        if ddp:\n            # in DDP training we only need to sync gradients at the last micro step.\n            # the official way to do this is with model.no_sync() context manager, but\n            # I really dislike that this bloats the code and forces us to repeat code\n            # looking at the source of that context manager, it just toggles this variable\n            model.require_backward_grad_sync = (micro_step == gradient_accumulation_steps - 1)\n        with ctx:\n            logits, loss = model(X, Y)\n            loss = loss / gradient_accumulation_steps # scale the loss to account for gradient accumulation\n        # immediately async prefetch next batch while model is doing the forward pass on the GPU\n        X, Y = get_batch('train')\n        # backward pass, with gradient scaling if training in fp16","total":336},"configurator.py:29-45":{"path":"configurator.py","start":29,"end":45,"from":26,"code":"        with open(config_file) as f:\n            print(f.read())\n        exec(open(config_file).read())\n    else:\n        # assume it's a --key=value argument\n        assert arg.startswith('--')\n        key, val = arg.split('=')\n        key = key[2:]\n        if key in globals():\n            try:\n                # attempt to eval it i
