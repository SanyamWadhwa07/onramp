/* Onramp guide viewer.
   Concept: a route down an asphalt road, highway-sign green for wayfinding, lane-marking amber
   for "you are here". Label column + content column with hairline rules between rows.
   Type: Hanken Grotesk (headings, labels), Onest (running text), Geist Mono (paths, numbers). */
:root {
  --bg: #eceeec;
  --surface: #f7f8f7;
  --surface-2: #e2e6e3;
  --border: #d0d6d2;
  --border-strong: #a6aea8;
  --ink: #101315;
  --text: #1a1e21;
  --muted: #4b544f;
  --subtle: #6f7873;
  --sign: #0b6b47;
  --sign-ink: #ffffff;
  --accent: #0a6644;
  --accent-dim: rgba(11, 107, 71, 0.1);
  --lane: #b47e00;
  --lane-strong: #e7a619;
  --lane-dim: rgba(196, 138, 0, 0.14);
  --asphalt: #2b2f33;
  --asphalt-edge: #43494f;
  --danger: #b8372b;
  --danger-dim: rgba(184, 55, 43, 0.1);
  --code-bg: #f2f4f2;
  --code-hl: rgba(231, 166, 25, 0.16);
  --grid-dot: rgba(16, 19, 21, 0.12);
  --shadow: 0 1px 0 rgba(16, 19, 21, 0.04), 0 18px 40px -24px rgba(16, 19, 21, 0.35);
  --font-head: "Hanken Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --label-col: 196px;
  --max: 1180px;
  --top-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1012; --surface: #14171a; --surface-2: #1a1e22; --border: #23282d; --border-strong: #353c43;
    --ink: #eeece6; --text: #dcdad3; --muted: #a3a69f; --subtle: #70756f;
    --sign: #0d7550; --sign-ink: #f4f8f5; --accent: #52c893; --accent-dim: rgba(82, 200, 147, 0.12);
    --lane: #f0b43c; --lane-strong: #f6c24f; --lane-dim: rgba(240, 180, 60, 0.14);
    --asphalt: #22262a; --asphalt-edge: #31373c; --danger: #f07164; --danger-dim: rgba(240, 113, 100, 0.12);
    --code-bg: #111417; --code-hl: rgba(240, 180, 60, 0.13); --grid-dot: rgba(238, 236, 230, 0.09);
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 18px 40px -20px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1012; --surface: #14171a; --surface-2: #1a1e22; --border: #23282d; --border-strong: #353c43;
  --ink: #eeece6; --text: #dcdad3; --muted: #a3a69f; --subtle: #70756f;
  --sign: #0d7550; --sign-ink: #f4f8f5; --accent: #52c893; --accent-dim: rgba(82, 200, 147, 0.12);
  --lane: #f0b43c; --lane-strong: #f6c24f; --lane-dim: rgba(240, 180, 60, 0.14);
  --asphalt: #22262a; --asphalt-edge: #31373c; --danger: #f07164; --danger-dim: rgba(240, 113, 100, 0.12);
  --code-bg: #111417; --code-hl: rgba(240, 180, 60, 0.13); --grid-dot: rgba(238, 236, 230, 0.09);
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 18px 40px -20px rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--top-h) + 16px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-weight: 440; font-size: 0.95rem; line-height: 1.62;

:focus-visible { outline: 2px solid var(--lane-strong); outline-offset: 2px; }

h2 { font-weight: 650; font-size: clamp(1.45rem, 2.4vw, 1.9rem); line-height: 1.15; }

p { margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--subtle); }
.muted { color: var(--muted); }
.subtle { color: var(--subtle); }

/* ---------- header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.top-in { max-width: var(--max); margin: 0 auto; height: var(--top-h); display: flex; align-items: center; gap: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-sign { width: 30px; height: 30px; flex: none; border-radius: 6px; background: var(--sign); box-shadow: inset 0 0 0 2px var(--sign), inset 0 0 0 3.2px rgba(255, 255, 255, 0.9); display: grid; place-items: center; }
.brand-sign svg { width: 22px; height: 22px; fill: none; stroke: var(--sign-ink); stroke-width: 3.2; stroke-linecap: round; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand-project { font-family: var(--font-head); font-weight: 700; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-family: var(--font-mono); font-size: 0.66rem; color: var(--subtle); letter-spacing: 0.04em; }
.tabs { display: flex; gap: 2px; margin-left: 12px; }
.tabs a { font-family: var(--font-head); font-weight: 500; font-size: 0.92rem; color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; }
.tabs a:hover { color: var(--ink); background: var(--surface-2); }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tool-btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); cursor: pointer; color: var(--muted); }
.tool-btn:hover { color: var(--ink); border-color: var(--border-strong); }
.tool-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.tool-btn svg .fill { fill: currentColor; stroke: none; }
.trust { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
.trust b { color: var(--ink); font-weight: 600; }

/* ---------- page frame */
main { outline: none; }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 96px; }
.row { display: grid; grid-template-columns: var(--label-col) minmax(0, 1fr); gap: 28px; padding-block: 28px; border-top: 1px solid var(--border); }
.row:first-child { border-top: 0; }
.row > .label { font-family: var(--font-head); font-weight: 500; color: var(--subtle); font-size: 1.02rem; line-height: 1.4; padding-top: 2px; }
.row > .label small { display: block; font-family: var(--font-body); font-size: 0.82rem; color: var(--subtle); margin-top: 4px; font-weight: 440; }
.row > .content { min-width: 0; }

/* ---------- highway sign */
.sign { display: inline-flex; align-items: center; gap: 10px; background: var(--sign); color: var(--sign-ink); border-radius: 7px; padding: 9px 16px; font-family: var(--font-head); font-weight: 650; box-shadow: inset 0 0 0 2px var(--sign), inset 0 0 0 3.5px rgba(255, 255, 255, 0.88); text-decoration: none; border: 0; cursor: pointer; }
.sign:hover { filter: brightness(1.08); }
.sign .arrow { font-family: var(--font-mono); }
.exit-tab { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--subtle); }
.exit-tab .no { background: var(--sign); color: var(--sign-ink); border-radius: 4px; padding: 2px 6px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7); letter-spacing: 0.06em; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; background: var(--surface); white-space: nowrap; }
.pill.core { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.pill.high { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
.pill.medium { color: var(--lane); border-color: color-mix(in srgb, var(--lane) 45%, var(--border)); }
.pill.inferred { color: var(--lane); }
.pill.documented { color: var(--accent); }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); font-family: var(--font-head); font-weight: 600; font-size: 0.92rem; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--border); }

/* ---------- planner */
.hero { padding-block: 8px 34px; display: grid; gap: 18px; }
.hero .one { font-size: clamp(1.05rem, 1.7vw, 1.28rem); color: var(--muted); max-width: 62ch; line-height: 1.5; }
.numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 22px 28px; }
.num b { display: block; font-family: var(--font-head); font-weight: 700; font-size: clamp(1.7rem, 3vw, 2.35rem); line-height: 1.05; color: var(--ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.num span { font-size: 0.88rem; color: var(--muted); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.choice { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 14px 16px; cursor: pointer; display: grid; gap: 3px; transition: border-color 0.15s, background 0.15s; }
.choice:hover { border-color: var(--border-strong); }
.choice b { font-family: var(--font-head); font-weight: 650; font-size: 1.02rem; color: var(--ink); }
.choice span { font-size: 0.86rem; color: var(--muted); line-height: 1.45; }
.choice[aria-pressed="true"] { background: var(--sign); border-color: var(--sign); box-shadow: inset 0 0 0 2px var(--sign), inset 0 0 0 3.5px rgba(255, 255, 255, 0.85); }
.choice[aria-pressed="true"] b, .choice[aria-pressed="true"] span { color: var(--sign-ink); }
.preview { display: grid; gap: 18px; }
.preview-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; }
.preview-head b { font-family: var(--font-head); font-size: 1.5rem; color: var(--ink); font-weight: 700; }
.days { display: grid; gap: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.day-line { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--border); }
.day-line:first-child { border-top: 0; }
.day-line .d { font-family: var(--font-mono); font-size: 0.78rem; color: var(--subtle); text-transform: uppercase; letter-spacing: 0.06em; }
.day-line .t { font-family: var(--font-head); font-weight: 600; color: var(--ink); min-width: 0; }
.day-line .m { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

/* ---------- route */
.route-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px; padding-bottom: 26px; border-bottom: 1px solid var(--border); }
.route-head .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.progress { display: grid; gap: 8px; min-width: min(320px, 100%); }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s; }
.progress small { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }
.road-wrap { position: relative; margin-top: 36px; }
.road-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.road-svg .edge { stroke: var(--asphalt-edge); stroke-width: 44; fill: none; stroke-linecap: round; }
.road-svg .tar { stroke: var(--asphalt); stroke-width: 38; fill: none; stroke-linecap: round; }
.road-svg .lane { stroke: var(--lane-strong); stroke-width: 2.4; fill: none; stroke-dasharray: 12 12; opacity: 0.85; }
.road-svg .lane.done { stroke: var(--accent); stroke-dasharray: none; opacity: 1; stroke-width: 3; }
.road-svg .shoulder { stroke: rgba(255, 255, 255, 0.5); stroke-width: 1.2; fill: none; }
.stops { position: relative; list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; }
.stop { position: relative; display: grid; grid-template-columns: 1fr 120px 1fr; align-items: center; min-height: 92px; }
.stop .card { grid-column: 3; justify-self: start; }
.stop.left .card { grid-column: 1; justify-self: end; }
.stop .marker { transform: translateX(var(--dx, 0)); grid-column: 2; grid-row: 1; justify-self: center; width: 26px; height: 26px; border-radius: 50%; background: var(--asphalt); border: 3px solid #f4f2ec; box-shadow: 0 0 0 1px var(--asphalt-edge); position: relative; z-index: 2; display: grid; place-items: center; }
.stop.done .marker { background: var(--sign); border-color: var(--sign-ink); }
.stop.done .marker::after { content: ""; width: 9px; height: 5px; border: solid var(--sign-ink); border-width: 0 0 2.4px 2.4px; transform: translateY(-1px) rotate(-45deg); }
.stop.here .marker { background: var(--lane-strong); border-color: #fff; box-shadow: 0 0 0 0 rgba(240, 180, 60, 0.55); animation: pulse 2.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(240, 180, 60, 0.55); } 70% { box-shadow: 0 0 0 16px rgba(240, 180, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(240, 180, 60, 0); } }
.here-pill { display: none; color: #1a1406; background: var(--lane-strong); border-color: var(--lane-strong); font-weight: 600; }
.here-tag { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em; background: var(--lane-strong); color: #1a1406; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.card { width: min(420px, 100%); align-content: start; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 13px; cursor: pointer; display: grid; gap: 6px; box-shadow: var(--shadow); transition: transform 0.15s, border-color 0.15s; }
.card:hover { transform: translateY(-2px); border-color: var(--border-strong); }
.card h3 { font-size: 1.04rem; }
.card p { font-size: 0.87rem; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .card-foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
.stop.done .card { opacity: 0.78; }
.stop.here .card { border-color: var(--lane-strong); box-shadow: 0 0 0 3px var(--lane-dim), var(--shadow); }
.rest { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 10px; z-index: 2; }
.rest .sign { grid-column: 2; flex-direction: column; align-items: center; gap: 0; padding: 10px 22px 11px; text-align: center; cursor: default; }
.rest .sign small { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.12em; opacity: 0.85; }
.rest .sign span { font-size: 1.05rem; }
.rest .sign em { font-style: normal; font-family: var(--font-mono); font-size: 0.7rem; opacity: 0.85; }
.endpoint { position: relative; z-index: 2; display: grid; justify-items: center; gap: 10px; padding-block: 6px; text-align: center; }
.finish { border: 1px dashed var(--border-strong); border-radius: 12px; padding: 22px; background: var(--surface); max-width: 520px; display: grid; gap: 10px; justify-items: center; }

/* ---------- lesson */
.lesson-grid { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 48px; align-items: start; }
.rail { position: sticky; top: calc(var(--top-h) + 24px); display: grid; gap: 14px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; border-left: 2px solid var(--border); }
.rail li a { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 6px 0 6px 12px; margin-left: -2px; border-left: 2px solid transparent; text-decoration: none; color: var(--muted); font-size: 0.86rem; line-height: 1.35; }
.rail li a:hover { color: var(--ink); }
.rail li a.on { color: var(--ink); border-left-color: var(--lane-strong); font-weight: 560; }
.rail li a .ck { width: 14px; height: 14px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--border-strong); }
.rail li a.done .ck { background: var(--accent); border-color: var(--accent); }
.lesson { max-width: 760px; display: grid; gap: 22px; }
.lesson-head { display: grid; gap: 12px; }
.lesson-head .meta { display: flex; flex-wrap: wrap; gap: 8px; }
.tldr { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 20px; padding-block: 18px; border-block: 1px solid var(--border); }
.tldr .label { font-family: var(--font-head); font-weight: 500; color: var(--subtle); }
.tldr p { font-size: 1.08rem; color: var(--ink); line-height: 1.5; }
.prose { display: grid; gap: 14px; max-width: 68ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.prose h3, .prose h4 { margin-top: 8px; }
.prose code, .inline-code { font-family: var(--font-mono); font-size: 0.84em; background: var(--surface-2); border-radius: 4px; padding: 1px 5px; color: var(--ink); }
.prose pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-size: 0.82rem; line-height: 1.55; }
.prose pre code { background: none; padding: 0; font-size: inherit; }
.prose strong { color: var(--ink); font-weight: 600; }
.cite { display: inline-flex; justify-self: start; align-items: center; gap: 4px; vertical-align: baseline; font-family: var(--font-mono); font-size: 0.76em; line-height: 1.4; padding: 0 6px; border-radius: 5px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); background: var(--accent-dim); color: var(--accent); cursor: pointer; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.cite:hover { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
.cite.file { border-style: dashed; }
details.deeper { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
details.deeper > summary { cursor: pointer; padding: 12px 16px; font-family: var(--font-head); font-weight: 600; color: var(--ink); list-style: none; display: flex; justify-content: space-between; }
details.deeper > summary::after { content: "+"; font-family: var(--font-mono); color: var(--subtle); }
details.deeper[open] > summary::after { content: "−"; }
details.deeper > .prose { padding: 0 16px 16px; }
.checkpoint { border: 1px solid var(--border); border-radius: 12px; padding: 18px; background: var(--surface); display: grid; gap: 12px; }

<script type="application/json" id="onramp-data">{"guide":{"schema":1,"project":{"name":"nanoGPT","one_liner":"Train or finetune a GPT language model with two short Python files: a 330-line model and a 336-line training loop.","what":"nanoGPT is Andrej Karpathy's minimal code for training GPT-style language models, released under the MIT License [[LICENSE:1-3|Copyright (c) 2022 Andrej Karpathy]]. `model.py` defines the whole GPT, `train.py` trains it, and `sample.py` generates text from the result. The same code trains a baby Shakespeare model in about 3 minutes on one GPU or reproduces GPT-2 (124M) in about 4 days on eight A100s [[README.md:13|reproduces GPT-2 (124M) on OpenWebText]]. Since November 2025 the README sends new users to its successor, nanochat, and keeps this repo up \"for posterity\" [[README.md:9|nanoGPT (this repo) is now very old and deprecated]].","analogy":"nanoGPT is a recipe card, not a bakery. One card (`model.py`) says what the bread is made of, another (`train.py`) says how to knead and bake it, and the same two cards bake a bun (a 10.65M-parameter Shakespeare model in minutes) or a wedding cake (GPT-2 124M over 4 days on 8 GPUs). The comparison stops at everything around the oven: a bakery has quality checks, packaging and delivery, and nanoGPT has no tests, no evaluation suite and no serving code.","audience":"People who want to see every line that turns raw text into a working GPT, from first-time model trainers to researchers who want a small baseline to modify.","author":"Andrej Karpathy","license":"MIT","status":"archived"},"numbers":[{"value":"330","label":"lines in model.py","note":"the entire GPT definition"},{"value":"336","label":"lines in train.py","note":"the entire training loop, single GPU to multi-node"},{"value":"10.65M","label":"parameters in the Shakespeare baby GPT","note":"printed at start-up with config/train_shakespeare_char.py"},{"value":"124M","label":"parameters in GPT-2 small","note":"reproduced in about 4 days on 8× A100 40GB"},{"value":"491,520","label":"tokens per optimizer step in the GPT-2 run","note":"12 sequences × 1024 tokens × 40 accumulation steps"},{"value":"210","label":"commits","note":"163 excluding merges, 28 Dec 2022 to 12 Nov 2025"},{"value":"0","label":"automated tests"}],"quickstart":{"prerequisites":["Python 3 with PyTorch; PyTorch 2.0 or newer for `torch.compile` and Flash attention","An NVIDIA GPU is optional: the Shakespeare example also runs on a laptop CPU or Apple Silicon (`--device=mps`)","About 1 MB of disk for the Shakespeare data; about 54 GB of Hugging Face cache plus 17 GB of output for OpenWebText"],"steps":[{"title":"Install the dependencies","run":"pip install torch numpy transformers datasets tiktoken wandb tqdm","explain":"This is the README's one-line install [[README.md:22|pip install torch numpy transformers datasets tiktoken wandb tqdm]]. `transformers` is only needed to load OpenAI's GPT-2 weights, `datasets` only for OpenWebText, `wandb` only if you turn on logging."},{"title":"Turn Shakespeare into integers","run":"python data/shakespeare_char/prepare.py","explain":"Downloads the 1 MB tiny-Shakespeare text and writes `train.bin`, `val.bin` and `meta.pkl` next to the script [[data/shakespeare_char/prepare.py:48-61|pickle.dump(meta, f)]]."},{"title":"Train a baby GPT (GPU)","run":"python train.py config/train_shakespeare_char.py","explain":"A 6-layer, 6-head, 384-channel model with a 256-character context [[config/train_shakespeare_char.py:17-25|block_size = 256]]. The README reports about 3 minutes on one A100 and a best validation loss of 1.4697 [[README.md:51|the best validation loss is 1.4697]]."},{"title":"Or train a smaller one on a CPU","run":"python train.py config/train_shakespeare_char.py --device=cpu --compile=False --eval_iters=20 --log_interval=1 --block_size=64 --batch_size=12 --n_layer=4 --n_head=4 --n_embd=128 --max_iters=2000 --lr_decay_iters=2000 --dropout=0.0","explain":"The README's laptop recipe [[README.md:85|--device=cpu --compile=False --eval_iters=20]]; it takes about 3 minutes and reaches a loss of about 1.88 [[README.md:88|gets us a loss of only 1.88]]. On Windows keep `--compile=False` [[README.md:224|not yet available on all platforms]]."},{"title":"Generate text","run":"python sample.py --out_dir=out-shakespeare-char","explain":"Loads `out-shakespeare-char/ckpt.pt` and prints 10 samples of 500 characters each by default [[sample.py:12-18|num_samples = 10]]. Add `--device=cpu` if you trained on CPU."}],"env":[{"name":"RANK","purpose":"Global process index. Set by `torchrun`, never by you; its presence is what switches train.py into multi-GPU (DDP) mode.","required":false,"at":"[[train.py:82|ddp = int(os.environ.get('RANK', -1)) != -1]]"},{"name":"LOCAL_RANK","purpose":"Which GPU on this machine the process uses (`cuda:LOCAL_RANK`). Set by `torchrun`.","required":false,"at":"[[train.py:86-88|device = f'cuda:{ddp_local_rank}']]"},{"name":"WORLD_SIZE","purpose":"Total number of processes. Gradient accumulation steps are divided by it. Set by `torchrun`.","required":false,"at":"[[train.py:87-95|gradient_accumulation_steps //= ddp_world_size]]"},{"name":"NCCL_IB_DISABLE","purpose":"Set to 1 for multi-node runs on clusters without InfiniBand, per the README. Not read by the code itself.","required":false,"at":"[[README.md:132|NCCL_IB_DISABLE=1]]"}],"verify":"During training you see lines like `iter 10: loss …, time …ms, mfu …%` and, every 250 steps for the Shakespeare config, `step 250: train loss …, val loss …` [[train.py:265|step {iter_num}: train loss]]. The first validation loss should sit a little above 4.17, which is ln(65): a uniform guess over 65 characters. When `sample.py` prints text with speaker names and line breaks that look like a play, it works."},"architecture":{"summary":"nanoGPT is three scripts that hand files to each other. A `prepare.py` script turns raw text into one long array of token ids on disk. `train.py` reads random windows from that array, trains the `GPT` class from `model.py`, and writes `ckpt.pt`. `sample.py` loads `ckpt.pt` (or OpenAI's GPT-2 weights) and generates text. There is no package, no server and no database: settings are plain global variables at the top of each script [[train.py:33-74|default config values designed to train a gpt2 (124M) on OpenWebText]], overridden by config files and `--key=value` flags through `configurator.py` [[train.py:76-78|exec(open('configurator.py').read())]]. The only shared Python import is `model.py`, used by `train.py`, `sample.py` and `bench.py` [[train.py:30|from model import GPTConfig, GPT]].","diagram":"flowchart LR\n  TXT[\"raw text: input.txt or OpenWebText\"] --> PREP[\"data/*/prepare.py\"]\n  PREP --> BIN[\"train.bin + val.bin: uint16 token ids\"]\n  PREP --> META[\"meta.pkl: char vocab, char-level only\"]\n  CFG[\"config/*.py + --key=value\"] --> CONF[\"configurator.py: exec into globals\"]\n  CONF --> TRAIN[\"train.py: training loop\"]\n  BIN --> TRAIN\n  META --> TRAIN\n  MODEL[\"model.py: class GPT\"] --> TRAIN\n  HF[\"Hugging Face GPT-2 weights\"] -.->|\"init_from=gpt2*\"| MODEL\n  TRAIN --> CKPT[\"out_dir/ckpt.pt\"]\n  CKPT --> SAMPLE[\"sample.py\"]\n  META --> SAMPLE\n  MODEL --> SAMPLE\n  SAMPLE --> OUT[\"generated text\"]\n  MODEL --> BENCH[\"bench.py: speed test\"]","layers":[{"name":"Data preparation","purpose":"Download a corpus, tokenize it, write `train.bin`/`val.bin` (and `meta.pkl` for characters).","paths":["data/shakespeare_char","data/shakespeare","data/openwebtext"]},{"name":"Configuration","purpose":"Override the global defaults of a script from a config file or `--key=value` flags.","paths":["configurator.py","config"]},{"name":"Model","purpose":"The GPT network, GPT-2 weight import, optimizer grouping, FLOP estimate and sampling loop.","paths":["model.py"]},{"name":"Training","purpose":"Batches, mixed precision, gradient accumulation, DDP, learning-rate schedule, evaluation and checkpoints.","paths":["train.py"]},{"name":"Inference","purpose":"Load a checkpoint or GPT-2, encode a prompt, generate and decode text.","paths":["sample.py"]},{"name":"Analysis and benchmarking","purpose":"Measure iteration speed and MFU; work out parameters, FLOPs and compute-optimal sizes on paper.","paths":["bench.py","transformer_sizing.ipynb","scaling_laws.ipynb"]}]},"concepts":[{"term":"Token","plain":"The unit of text the model reads and writes, stored as an integer id.","detail":"In `shakespeare_char` a token is one character (65 of them). In `shakespeare` and `openwebtext` a token is a GPT-2 BPE piece, one of 50,257.","at":"[[data/shakespeare_char/prepare.py:23-31|chars = sorted(list(set(data)))]]"},{"term":"Vocabulary size (vocab_size)","plain":"How many different token ids exist; it sets the size of the embedding table and of the output layer.","detail":"Read from `meta.pkl` when present, otherwise 50304: GPT-2's 50,257 rounded up to a multiple of 64 for speed.","at":"[[train.py:153-155|model_args['vocab_size'] = meta_vocab_size if meta_vocab_size is not None else 50304]]"},{"term":"Context length (block_size)","plain":"The maximum number of previous tokens the model can look at when predicting the next one.","detail":"256 for the Shakespeare baby GPT, 1024 for GPT-2. It sizes the position-embedding table, so a model cannot read past it.","at":"[[model.py:170-174|Cannot forward sequence of length]]"},{"term":"Embedding","plain":"A learned list of numbers (a vector) for each token id, looked up from a table.","detail":"`wte` maps each token id to an `n_embd`-long vector; `wpe` does the same for each position 0..block_size-1. The two vectors are added.","at":"[[model.py:126-129|wte = nn.Embedding(config.vocab_size, config.n_embd)]]"},{"term":"Residual stream","plain":"The running vector for each position that every block reads from and adds its result back into.","detail":"Each block does `x = x + f(x)` twice, so information can pass through unchanged and gradients flow straight back to early layers.","at":"[[model.py:103-106|x = x + self.attn(self.ln_1(x))]]"},{"term":"LayerNorm","plain":"Rescales each vector to mean 0 and variance 1, then applies a learned gain (and optional bias).","detail":"nanoGPT writes its own because, as its docstring says, PyTorch's LayerNorm did not support turning off only the bias.","at":"[[model.py:18-27|PyTorch doesn't support simply bias=False]]"},{"term":"Causal self-attention","plain":"Each position gathers information from earlier positions, weighting them by how relevant they look, and never from later ones.","detail":"Queries, keys and values come from one linear layer; scores are q·k scaled by 1/sqrt(head size); future positions are masked to minus infinity before the softmax.","at":"[[model.py:52-76|is_causal=True]]"},{"term":"Attention head","plain":"One independent attention computation over a slice of the vector; several run side by side.","detail":"With `n_embd=384` and `n_head=6` each head works on 64 numbers; the head outputs are concatenated back to 384.","at":"[[model.py:56-59|C // self.n_head]]"},{"term":"MLP (feed-forward)","plain":"A small two-layer network applied to each position separately, after attention.","detail":"Widens to 4 × n_embd, applies GELU, narrows back to n_embd.","at":"[[model.py:78-92|class MLP(nn.Module):]]"},{"term":"Logits","plain":"One raw score per vocabulary entry; higher means the model thinks that token is more likely next.","detail":"Produced by `lm_head`, a linear layer from n_embd to vocab_size. Softmax turns them into probabilities.","at":"[[model.py:184-187|logits = self.lm_head(x)]]"},{"term":"Cross-entropy loss","plain":"The average of minus the log of the probability the model gave to the correct next token.","detail":"A uniform guess over 65 characters scores ln(65) ≈ 4.17; the README's baby GPT reaches 1.4697 on validation data.","at":"[[model.py:187|F.cross_entropy(logits.view(-1, logits.size(-1)), targets.view(-1), ignore_index=-1)]]"},{"term":"Weight tying","plain":"The input embedding table and the output layer share one weight matrix.","detail":"Saves vocab_size × n_embd parameters (about 38.6M for GPT-2) and is what GPT-2 does.","at":"[[model.py:133-138|self.transformer.wte.weight = self.lm_head.weight]]"},{"term":"AdamW","plain":"The optimizer: it moves each weight against its gradient, scaled by running averages of the gradient and its square, and shrinks large weights slightly (weight decay).","detail":"nanoGPT decays every tensor with 2 or more dimensions and none of the biases or LayerNorm gains.","at":"[[model.py:268-275|if p.dim() >= 2]]"},{"term":"Learning-rate schedule","plain":"How big the optimizer's steps are at each iteration: ramp up, then glide down.","detail":"Linear warmup for `warmup_iters`, cosine decay to `min_lr` by `lr_decay_iters`, then constant.","at":"[[train.py:230-242|def get_lr(it):]]"},{"term":"Gradient accumulation","plain":"Run several small batches, add up their gradients, then take one optimizer step, as if it had been one big batch.","detail":"The GPT-2 default is 40 micro-steps of 12 sequences, about 0.5M tokens per step.","at":"[[train.py:290-305|for micro_step in range(gradient_accumulation_steps):]]"},{"term":"Mixed precision","plain":"Do most of the maths in 16-bit numbers for speed while keeping the weights in 32-bit.","detail":"bfloat16 when the GPU supports it, else float16 with a GradScaler; off on CPU.","at":"[[train.py:109-112|torch.amp.autocast(device_type=device_type, dtype=ptdtype)]]"},{"term":"GradScaler","plain":"Multiplies the loss by a large factor before backward so tiny float16 gradients do not round to zero, then divides it back out.","detail":"Enabled only when `dtype == 'float16'`; otherwise every call is a no-op.","at":"[[train.py:195-196|scaler = torch.cuda.amp.GradScaler(enabled=(dtype == 'float16'))]]"},{"term":"DDP (DistributedDataParallel)","plain":"Several processes, one per GPU, each training a full model copy on different batches and averaging gradients.","detail":"Detected through the `RANK` variable that `torchrun` sets; only rank 0 evaluates, logs and saves.","at":"[[train.py:82-91|master_process = ddp_rank == 0]]"},{"term":"Temperature","plain":"A dial for randomness when sampling: below 1 sharpens the probabilities, above 1 flattens them.","detail":"The logits are divided by it before the softmax; `sample.py` defaults to 0.8.","at":"[[model.py:317-318|logits = logits[:, -1, :] / temperature]]"},{"term":"Top-k sampling","plain":"Only the k most likely next tokens are allowed; the rest get probability zero.","detail":"`sample.py` uses k = 200; the check `min(top_k, vocab)` avoids an error on the 65-character vocab.","at":"[[model.py:319-322|torch.topk(logits, min(top_k, logits.size(-1)))]]"},{"term":"MFU (model FLOPs utilization)","plain":"What fraction of the GPU's peak arithmetic speed the training run is actually using.","detail":"Estimated with the PaLM formula 6N + 12·L·H·Q·T FLOPs per token, against a hard-coded A100 bfloat16 peak of 312 TFLOPS.","at":"[[model.py:289-303|flops_per_token = 6*N + 12*L*H*Q*T]]"},{"term":"Checkpoint","plain":"A snapshot of the model and optimizer saved to disk so training can resume or the model can be sampled.","detail":"One dict in `out_dir/ckpt.pt`, overwritten at each qualifying evaluation.","at":"[[train.py:276-286|torch.save(checkpoint, os.path.join(out_dir, 'ckpt.pt'))]]"},{"term":"Memory-mapped file (memmap)","plain":"A file you index like an array; the operating system reads only the pages you touch.","detail":"Lets `get_batch` pull 12 random windows out of a 17 GB file without loading it.","at":"[[train.py:116-122|We recreate np.memmap every batch to avoid a memory leak]]"},{"term":"Finetuning","plain":"Continue training a model that already learned general language, on your own smaller dataset, with a small learning rate.","detail":"In nanoGPT it is ordinary training with `init_from='gpt2*'`, e.g. GPT-2 XL on Shakespeare at a constant 3e-5.","at":"[[config/finetune_shakespeare.py:10-25|learning_rate = 3e-5]]"}],"data":{"summary":"nanoGPT keeps all state in four kinds of files. **Token files** (`train.bin`, `val.bin`) are raw arrays of 16-bit unsigned integers with no header: one token id after another for the whole corpus [[data/openwebtext/prepare.py:59-74|arr = np.memmap(filename, dtype=dtype, mode='w+', shape=(arr_len,))]]. `train.py` opens them with `np.memmap`, which maps the file into memory so that reading a slice only loads that slice from disk [[train.py:116-125|def get_batch(split):]]. **`meta.pkl`** exists only for the character dataset and holds the vocabulary size and the two lookup tables [[data/shakespeare_char/prepare.py:54-61|'vocab_size': vocab_size,]]. **`ckpt.pt`** is one Python dict saved with `torch.save`, overwritten in `out_dir` at every evaluation that qualifies [[train.py:277-286|'model_args': model_args,]]. Everything else (the model in GPU memory, the optimizer's running averages) lives only in the training process and is gone if it is not checkpointed. All of these files are git-ignored [[.gitignore:6-10|*.bin]].","diagram":"flowchart LR\n  P[\"prepare.py\"] -->|\"np.uint16 tofile or memmap\"| B[\"train.bin + val.bin\"]\n  P -->|\"pickle, char-level only\"| M[\"meta.pkl: vocab_size, stoi, itos\"]\n  B -->|\"np.memmap, random windows\"| G[\"get_batch: x and y, B x T int64\"]\n  G --> T[\"train.py loop\"]\n  M -->|\"vocab_size\"| T\n  T -->|\"torch.save at eval\"| C[\"ckpt.pt dict\"]\n  C -->|\"init_from=resume\"| T\n  C -->|\"torch.load\"| S[\"sample.py\"]\n  M -->|\"stoi, itos\"| S","entities":[{"name":"train.bin / val.bin","purpose":"The whole corpus as one flat sequence of token ids. 1,003,854 + 111,540 tokens for Shakespeare characters; about 9.0 billion + 4.4 million for OpenWebText (about 17 GB + 8.5 MB).","at":"[[data/openwebtext/prepare.py:76-78|train has ~9B tokens (9,035,582,198)]]","fields":["dtype: uint16 (0 to 65535)","no header; OpenWebText separates documents with the end-of-text token 50256, the Shakespeare files have no separators","read with np.memmap(path, dtype=np.uint16, mode='r')"]},{"name":"meta.pkl","purpose":"Vocabulary for the character-level dataset, so `train.py` knows the vocab size and `sample.py` can encode and decode.","at":"[[data/shakespeare_char/prepare.py:54-61|'itos': itos,]]","fields":["vocab_size: int (65 for Shakespeare)","stoi: dict char -> int","itos: dict int -> char"]},{"name":"Batch (x, y)","purpose":"What the model sees each micro-step: `batch_size` random windows of `block_size` tokens, and the same windows shifted one token to the right as targets.","at":"[[train.py:123-125|ix = torch.randint(len(data) - block_size, (batch_size,))]]","fields":["x: int64 tensor (batch_size, block_size)","y: int64 tensor (batch_size, block_size), y[i, t] = x[i, t+1]"]},{"name":"ckpt.pt","purpose":"Everything needed to resume training or sample: weights, optimizer state, architecture and the run's settings. About 1.5 GB for GPT-2 124M because AdamW keeps two extra numbers per weight.","at":"[[train.py:277-284|'optimizer': optimizer.state_dict(),]]","fields":["model: state_dict (keys may start with _orig_mod. after torch.compile)","optimizer: AdamW state_dict","model_args: n_layer, n_head, n_embd, block_size, bias, vocab_size, dropout","iter_num: int","best_val_loss: tensor scalar","config: every simple-typed global, e.g. dataset, learning_rate"]},{"name":"GPTConfig","purpose":"The architecture as a dataclass. `model_args` in the checkpoint is exactly the keyword arguments for it.","at":"[[model.py:108-116|class GPTConfig:]]","fields":["block_size: 1024","vocab_size: 50304","n_layer: 12","n_head: 12","n_embd: 768","dropout: 0.0","bias: True"]}]},"history":{"summary":"The log has 210 commits from 28 Dec 2022 to 12 Nov 2025; 163 are not merges. Andrej Karpathy wrote 115 of those 163; 36 other people contributed the remaining 48 through pull requests, mostly bug fixes and portability. Activity is front-loaded: 150 of the 210 commits land in the first nine weeks (20 in Dec 2022, 90 in Jan 2023, 40 in Feb 2023). The first commit already had the shape of today's repo: `model.py` (267 lines), `train.py` (191 lines), `sample.py` and the OpenWebText `prepare.py` (`fe80428`).","eras":[{"title":"The bones","when":"28 Dec 2022 to 3 Jan 2023","what":"\"first very bad commit\" (`fe80428`) ships the model, training loop, sampler and OpenWebText prep. Within a week come the configurator \"that may be a terrible mistake lol\" (`5d2b480`), a benchmarking script (`70b5d93`), DDP (`dea1507`), proper resume (`682a0ac`) and `torch.compile` by default for \"almost 1.8X\" throughput (`5a725d9`)."},{"title":"Usable by everyone","when":"January 2023","what":"The configurator moves into its own file shared by all scripts (`d562b3e`). Character-level Shakespeare arrives with the baby-GPT config (`d17350a`), followed the next day by \"oh no nanoGPT is trending quickly explain the character-level functionality\" (`bb49751`). Weight tying (`7c82885`, `43b37fd`), gradient accumulation (`cf99914`) and multi-node docs (`9352df2`) land."},{"title":"Speed and fidelity","when":"late January to mid February 2023","what":"Gradient clipping (`3cb3fc0`), the GPT-2 initialisation (`f29a9ff`), optional biases measured \"about 6% faster\" (`e808a67`), Flash attention (`ae06d0b`), fused AdamW (`e170e40`), the GPT-2 training config (`f9348f3`), batch prefetching (`3fd4c0c`), vocab padding to 50304 for \"about 25% faster\" (`77e7e04`), the MFU metric (`ab0718a`) and the transformer sizing notebook (`eae986c`)."},{"title":"Community fixes","when":"March to June 2023","what":"Contributors fix `crop_block_size` with Flash attention (`c3f2548`), out-of-memory on resume (`4ac2e8c`) and bf16 detection (`eb33b8b`, `1eaceae`). Karpathy scales the loss for gradient accumulation (`553f949`), simplifies `configure_optimizers` (`7fe4a09`) and switches DDP to `WORLD_SIZE` (`7339b90`)."},{"title":"Maintenance and retirement","when":"2024 to November 2025","what":"A handful of merged fixes: the `np.memmap` memory leak (`5156fef`), UTF-8 file reading (`f35dc82`) and a non-zero warmup learning rate at step 0 (`dc81cb3`). The last commit adds the README note pointing to nanochat and marking nanoGPT deprecated (`3adf61e`)."}]},"lessons":[{"id":"gist-what-it-is","chapter":"gist","title":"What nanoGPT is and what it is for","tier":"core","minutes":4,"summary":"nanoGPT is two short files that build and train a GPT, plus small scripts that prepare text and generate from the result. The same code trains a 10.65M-parameter Shakespeare model on a laptop or reproduces GPT-2 (124M) on eight GPUs.","body":"By the end of this stop you know what is in the repo and what each part is for.\n\nA **GPT** is a neural network that reads a stretch of text and predicts what comes next. Train it on enough text and it writes plausible new text, one piece at a time. nanoGPT is Andrej Karpathy's minimal version of that idea, written to be fast enough for real runs. The README calls it a rewrite of his teaching repo minGPT that \"prioritizes teeth over education\" [[README.md:13|prioritizes teeth over education]]: simple, but tuned to actually reproduce GPT-2.\n\nThe whole system is four kinds of file:\n\n- `data/\u003cname>/prepare.py` turns raw text into a file of integers.\n- `model.py` (330 lines) defines the network, the class `GPT` [[model.py:118-133|class GPT(nn.Module):]].\n- `train.py` (336 lines) trains it and saves `ckpt.pt`.\n- `sample.py` loads `ckpt.pt` and writes new text.\n\nSettings live in `config/` as tiny Python files. The one this guide uses most is the \"baby GPT\": 6 layers, 6 attention heads, 384 numbers per token [[config/train_shakespeare_char.py:21-25|baby GPT model :)]].\n\nTwo facts frame the rest. It is MIT licensed, copyright Andrej Karpathy [[LICENSE:3|Copyright (c) 2022 Andrej Karpathy]]. And it is retired: since November 2025 the README sends people to its successor, nanochat, and keeps this repo up \"for posterity\" [[README.md:9|nanoGPT (this repo) is now very old and deprecated]]. For a learner that is an advantage: the code you read here will not move under you."},{"id":"gist-next-token","chapter":"gist","title":"The one idea: predict the next token","tier":"core","minutes":5,"summary":"Everything in nanoGPT serves one task: given some tokens, predict the token that follows. The data supplies the answers for free, because the right answer is simply the next number in the file.","body":"By the end of this stop you can say what the model is trained to do, and why no labelling is needed.\n\nTake the text `To be or`. Turn each character into a number, a **token id**. Now, at every position, ask: what comes next? After `T` the answer is `o`; after `To` it is a space; after `To ` it is `b`. One sentence gives you as many training examples as it has characters.\n\n`train.py` builds exactly that, in one function. It picks random starting points in the token file, cuts out windows of `block_size` tokens as the input `x`, and cuts the same windows **shifted one position to the right** as the targets `y` [[train.py:123-125|y = torch.stack([torch.from_numpy((data[i+1:i+1+block_size]).astype(np.int64)) for i in ix])]]. Position 5 of `y` is the token that follows position 5 of `x`.\n\nThe model looks at `x` and outputs, for every position, a score for every possible next token. The **loss** measures how little probability it gave to the real answer from `y`, averaged over all positions [[model.py:184-187|F.cross_entropy(logits.view(-1, logits.size(-1)), targets.view(-1), ignore_index=-1)]]. Training nudges the weights to lower that loss, thousands of times.\n\nGenerating text is the same model in a loop: predict a next token, append it, predict again [[model.py:312-328|idx = torch.cat((idx, idx_next), dim=1)]].\n\nHow to read the loss numbers in this guide: with 65 possible characters, a model that guesses uniformly scores ln 65 ≈ 4.17. The README's baby GPT reaches 1.4697 on held-out text [[README.md:51|the best validation loss is 1.4697]]. Roughly, it gives the right next character a probability of e^−1.47 ≈ 0.23 (a geometric mean over positions), out of 65 options.","checkpoint":{"q":"In a training batch, `x[0]` holds the ids for the text `hello`. What does `y[0]` hold?","choices":["The ids for `hello` again","The ids for `ello` followed by whatever character came next in the file","A single id: the character after `hello`","The ids for `olleh`"],"answer":1,"explain":"`y` is cut from the same file starting one position later [[train.py:124-125|i+1+block_size]], so it is `x` shifted left by one, with one new token at the end."}},{"id":"run-shakespeare-char","chapter":"run","title":"Run it: train and sample a Shakespeare model","tier":"core","minutes":5,"summary":"Three commands give you a working GPT: prepare the data, train with the Shakespeare config, sample. On a GPU it takes minutes; on a laptop add a few flags and shrink the model.","show":[{"view":"quickstart"}],"body":"By the end of this stop you have trained a model and watched it write.\n\n1. **Install**: `pip install torch numpy transformers datasets tiktoken wandb tqdm` [[README.md:22|pip install torch numpy transformers datasets tiktoken wandb tqdm]].\n2. **Prepare**: `python data/shakespeare_char/prepare.py` downloads 1 MB of Shakespeare and writes `train.bin`, `val.bin` and `meta.pkl` into `data/shakespeare_char/`.\n3. **Train**: `python train.py config/train_shakespeare_char.py`. The config file replaces `train.py`'s GPT-2-sized defaults with a 6-layer model, a 256-character context and 5,000 iterations [[config/train_shakespeare_char.py:16-29|max_iters = 5000]]. On an A100 the README reports about 3 minutes.\n4. **Sample**: `python sample.py --out_dir=out-shakespeare-char`.\n\n**No NVIDIA GPU?** The defaults assume CUDA and `torch.compile` [[train.py:72-74|device = 'cuda']], so say otherwise. The README's laptop recipe adds `--device=cpu --compile=False` and shrinks everything: context 64, batch 12, 4 layers of 128 channels, 2,000 iterations [[README.md:85|--block_size=64 --batch_size=12 --n_layer=4 --n_head=4 --n_embd=128]]. It also runs in about 3 minutes and reaches a loss near 1.88. On Apple Silicon use `--device=mps`. On Windows keep `--compile=False` [[README.md:224|try to disable this by adding]]. Pass the same `--device` to `sample.py`.\n\n**What you should see.** Start-up prints the parameter count, `number of parameters: 10.65M` for the GPU config [[model.py:147-148|number of parameters: %.2fM]]. Then come `iter` lines with loss and milliseconds, and every 250 iterations a `step` line with train and val loss. The first val loss sits a little above 4.17. Once it nears 1.5, samples look like a play script: speaker names in capitals, line breaks, invented but plausible words."},{"id":"run-config-overrides","chapter":"run","title":"Changing settings: config files and --key=value","tier":"standard","minutes":5,"goals":["ship","own","rebuild"],"summary":"Every setting is a global variable at the top of the script. A config file is a Python file of assignments that runs over those globals; a `--key=value` flag then overrides one of them, with a strict type check.","body":"By the end you can change any setting without editing code, and you know the two ways it fails.\n\nOpen `train.py`: lines 33–74 are plain assignments such as `batch_size = 12` and `learning_rate = 6e-4` [[train.py:47-60|learning_rate = 6e-4 # max learning rate]]. Line 76 records the name of every global whose value is an int, float, bool or string. Line 77 runs `configurator.py`. Line 78 snapshots the final values into `config`, which is logged and saved in checkpoints [[train.py:76-78|config = {k: globals()[k] for k in config_keys}]].\n\n`configurator.py` is not imported; its text is executed inside `train.py`'s namespace. It walks the command-line arguments:\n\n- An argument without `=` is a config file, executed as Python [[configurator.py:21-28|exec(open(config_file).read())]]. Later assignments win.\n- `--key=value` must name an existing global, or you get `ValueError: Unknown config key` [[configurator.py:46-47|Unknown config key]]. The value goes through `literal_eval`, so `True`, `3e-4` and `64` become a bool, a float and an int; anything else stays a string [[configurator.py:34-40|attempt = literal_eval(val)]].\n- The new value must have exactly the type of the default [[configurator.py:41-42|ensure the types match ok]].\n\nSo `python train.py config/train_shakespeare_char.py --batch_size=32 --device=cpu` applies the file, then the two flags, in that order. `sample.py` and `bench.py` use the same snippet on their own globals [[sample.py:23|exec(open('configurator.py').read())]].\n\nTwo traps. `--learning_rate=1` is an int and trips the type check; write `1.0`. And because `configurator.py` is opened by a relative path, every script must be run from the repo root.","deeper":"Why it is built like this: Karpathy wanted no `config.` prefix on every variable and no configuration framework [[configurator.py:12-14|I just really dislike configuration]]. The cost shows in tooling. Your editor cannot tell that a config file changed `n_layer`; there is no `--help`; and a typo inside a config file (say `n_layers = 8`) silently creates a new, unused global instead of raising, because config files are executed, not checked. Only command-line flags get the unknown-key and type checks.","checkpoint":{"q":"You run `python train.py --dropout=0`. What happens?","choices":["dropout becomes 0.0","An AssertionError: `0` parses as an int and the default `0.0` is a float","ValueError: Unknown config key","The flag is silently ignored"],"answer":1,"explain":"`literal_eval('0')` returns the int 0, and the configurator requires the type of the default `dropout = 0.0` [[train.py:55|dropout = 0.0]] to match exactly [[configurator.py:42|assert type(attempt) == type(globals()[key])]]. Write `--dropout=0.0`."}},{"id":"run-gpt2-scale","chapter":"run","title":"Run it at scale: OpenWebText, 8 GPUs, baselines, finetuning","tier":"deep","minutes":6,"goals":["ship","own","rebuild"],"summary":"Reproducing GPT-2 (124M) is one data command and one torchrun command on an 8×A100 node, about 4 days. The same train.py also evaluates OpenAI's checkpoints and finetunes them.","body":"By the end you know the commands for the big runs and what each one needs.\n\n**Data.** `python data/openwebtext/prepare.py` downloads OpenWebText through Hugging Face `datasets` and writes about 9 billion GPT-2 tokens into a 17 GB `train.bin` [[data/openwebtext/prepare.py:76-78|train.bin is ~17GB, val.bin ~8.5MB]]. The download itself takes about 54 GB of cache.\n\n**Pretraining.** `torchrun --standalone --nproc_per_node=8 train.py config/train_gpt2.py` [[config/train_gpt2.py:1-3|torchrun --standalone --nproc_per_node=8 train.py config/train_gpt2.py]]. `torchrun` starts 8 processes, one per GPU. Each optimizer step covers 12 × 1024 × 40 = 491,520 tokens across them, for 600,000 steps, 300B tokens in total [[config/train_gpt2.py:9-17|this makes total number of tokens be 300B]]. The README reports about 4 days to a loss of about 2.85 [[README.md:121|go down to loss of ~2.85]]. Across two machines you run `torchrun` on each with `--nnodes=2`, a `--node_rank` and the master's address [[train.py:11-16|--nnodes=2 --node_rank=0]].\n\n**Baselines.** `python train.py config/eval_gpt2.py` loads OpenAI's GPT-2 124M, evaluates once and exits, because the config sets `eval_only = True` [[config/eval_gpt2.py:4-8|init_from = 'gpt2']]. OpenAI's model scores about 3.11 on OpenWebText [[README.md:121|gets a val loss of about 3.11]]. The README attributes the gap to 2.85 to the data: GPT-2 was trained on WebText, which was never released, and OpenWebText is only a reproduction of it [[README.md:156|there is a dataset domain gap]].\n\n**Finetuning.** `python data/shakespeare/prepare.py`, then `python train.py config/finetune_shakespeare.py`, starts from GPT-2 XL and trains 20 short iterations at a constant 3e-5 [[config/finetune_shakespeare.py:10-25|init_from = 'gpt2-xl']]. Sample with `python sample.py --out_dir=out-shakespeare`.\n\n**Straight from OpenAI.** `python sample.py --init_from=gpt2-xl --start=\"...\"` generates from the 1.5B-parameter model with no training at all [[README.md:196-201|--init_from=gpt2-xl]]."},{"id":"stack-pytorch-primer","chapter":"stack","title":"PyTorch in eight minutes, using nanoGPT's own lines","tier":"standard","minutes":8,"for":["new"],"show":[{"view":"stack"}],"summary":"Four PyTorch ideas carry the whole repo: tensors, modules with a `forward` method, autograd's `backward`, and an optimizer step. Each appears in a handful of lines you can point at.","body":"By the end you can read `model.py` and `train.py` without tripping over PyTorch itself.\n\n**Tensors.** A tensor is an array of numbers with a shape, living on the CPU or a GPU. nanoGPT's batches are integer tensors of shape `(batch_size, block_size)`, moved to the device with `.to(device)` [[train.py:126-130|x, y = x.to(device), y.to(device)]]. Inside the model, activations are float tensors of shape `(B, T, C)`: batch, time (position in the sequence) and channels [[model.py:53|B, T, C = x.size()]].\n\n**Modules.** A layer is a class that subclasses `nn.Module`, creates its weights in `__init__` and computes in `forward`. `MLP` is the cleanest example: two `nn.Linear` layers with a GELU between [[model.py:78-92|class MLP(nn.Module):]]. Calling `module(x)` runs `forward`. Modules nest: a `Block` holds an attention module and an `MLP`, and `GPT` holds a list of `Block`s [[model.py:126-132|h = nn.ModuleList([Block(config) for _ in range(config.n_layer)])]]. `model.parameters()` then finds every weight in the tree.\n\n**Autograd.** PyTorch records how each tensor was computed. `loss.backward()` walks that record backwards and stores in each weight's `.grad` how the loss would change if the weight grew a little. In `train.py` it is `scaler.scale(loss).backward()` [[train.py:304-305|scaler.scale(loss).backward()]]; the scaler only matters for 16-bit training.\n\n**Optimizer.** `optimizer.step()` moves every weight a small amount against its gradient, and `zero_grad` clears the gradients for the next round [[train.py:310-314|optimizer.zero_grad(set_to_none=True)]]. nanoGPT uses AdamW, built in `GPT.configure_optimizers`.\n\nTwo switches you will meet: `model.eval()` and `model.train()` turn dropout off and on [[train.py:218-227|model.eval()]], and `@torch.no_grad()` skips the autograd record when you only need outputs [[train.py:215-216|@torch.no_grad()]]."},{"id":"stack-tokenizers","chapter":"stack","title":"Tokens and tokenizers: characters versus GPT-2's BPE","tier":"standard","minutes":6,"for":["new"],"summary":"A tokenizer turns text into integer ids and back. nanoGPT uses two: one id per character (65 ids for Shakespeare) and GPT-2's byte-pair encoding (50,257 ids, through tiktoken).","body":"By the end you can say what a token is in each dataset and why it sets the model's vocabulary size.\n\n**Character level.** `data/shakespeare_char/prepare.py` collects every distinct character in the text, sorts them and numbers them [[data/shakespeare_char/prepare.py:23-31|stoi = { ch:i for i,ch in enumerate(chars) }]]. The result is 65 tokens: newline, space, punctuation, one digit and both cases of the alphabet [[data/shakespeare_char/prepare.py:63-68|# vocab size: 65]]. `encode` maps each character through `stoi`; `decode` maps back through `itos`. Simple, but the model must spell every word letter by letter, so a 500-token sample is only 500 characters.\n\n**Byte-pair encoding (BPE).** GPT-2's tokenizer starts from bytes and repeatedly merges the most frequent neighbouring pair into a new token, until it has 50,257 of them. Common words become one token; rare words become several. nanoGPT uses OpenAI's `tiktoken` library for it [[data/shakespeare/prepare.py:19-22|enc = tiktoken.get_encoding(]]. The same 1,115,394 characters of Shakespeare become 301,966 + 36,059 BPE tokens instead of 1,003,854 + 111,540 characters [[data/shakespeare/prepare.py:32-33|train.bin has 301,966 tokens]]: about 3.3 characters per token.\n\n**Why uint16.** Both vocabularies have fewer than 65,536 ids, so every id fits in 2 bytes; GPT-2's largest is 50,256 [[data/openwebtext/prepare.py:62|enc.max_token_value == 50256]]. That halves the 9-billion-token OpenWebText file compared with 32-bit integers.\n\n**End of text.** OpenWebText appends GPT-2's special `\u003c|endoftext|>` token (id 50256) after every document, so the model sees where documents end [[data/openwebtext/prepare.py:43-46|ids.append(enc.eot_token)]].\n\nThe vocabulary size flows straight into the model: it is the number of rows in the embedding table and the width of the output layer [[model.py:127-133|nn.Embedding(config.vocab_size, config.n_embd)]].","checkpoint":{"q":"Why can nanoGPT store token ids as uint16?","choices":["PyTorch requires 16-bit inputs","Every id in both vocabularies is below 65,536, the largest uint16","uint16 compresses the text","The model trains in 16-bit precision"],"answer":1,"explain":"The comment says it outright: GPT-2's largest id is 50,256, below 2^16 [[data/openwebtext/prepare.py:62|dtype = np.uint16]]. The ids are converted to int64 only when a batch is built."}},{"id":"stack-mixed-precision","chapter":"stack","title":"Mixed precision: bfloat16, float16 and the GradScaler","tier":"standard","minutes":6,"for":["new"],"summary":"Most of the arithmetic runs in 16-bit floats, which GPUs do much faster, while the weights stay 32-bit. bfloat16 needs nothing else; float16 needs a GradScaler so small gradients do not round to zero.","body":"By the end you know what `dtype`, `ctx` and `scaler` do in `train.py`.\n\nA normal float has 32 bits. GPUs do 16-bit matrix maths far faster: an A100 is rated at 312 TFLOPS in bfloat16, the figure `estimate_mfu` uses [[model.py:301|flops_promised = 312e12]], against 19.5 TFLOPS in plain float32. 16-bit tensors also take half the memory. There are two 16-bit formats. **float16** keeps more precision but has a small range: values below about 6e-8 become zero. **bfloat16** keeps float32's range with less precision. `train.py` picks bfloat16 when the GPU supports it, otherwise float16 [[train.py:73|dtype = 'bfloat16' if torch.cuda.is_available() and torch.cuda.is_bf16_supported() else 'float16']].\n\n**Autocast.** You do not convert the model yourself. `torch.amp.autocast` is a context in which PyTorch runs each operation in 16-bit where that is safe (matrix multiplies) and in 32-bit where it is not (softmax, sums). On CPU nanoGPT uses an empty context instead [[train.py:109-112|ctx = nullcontext() if device_type == 'cpu' else torch.amp.autocast(device_type=device_type, dtype=ptdtype)]]. Every forward pass sits inside `with ctx:` [[train.py:299-300|with ctx:]].\n\n**GradScaler.** In float16, many gradients are smaller than the format can hold. The scaler multiplies the loss by a large factor before `backward`, so the gradients are big enough to survive, and divides them back before the update. It has to unscale before clipping, or the clip threshold would apply to inflated numbers [[train.py:306-312|scaler.unscale_(optimizer)]]. If the scaled gradients overflow, `scaler.step` skips that update and lowers the factor. For bfloat16 and float32 the scaler is created disabled, and every call on it does nothing [[train.py:195-196|enabled=(dtype == 'float16')]].\n\n**TF32.** Two more lines allow TensorFloat-32, a mode on NVIDIA Ampere and newer GPUs that runs float32 matrix multiplies faster with slightly fewer mantissa bits [[train.py:107-108|torch.backends.cuda.matmul.allow_tf32 = True]].","checkpoint":{"q":"You train on a GPU without bfloat16 support. Which line keeps tiny gradients from rounding to zero?","choices":["`torch.backends.cuda.matmul.allow_tf32 = True`","`scaler.scale(loss).backward()`","`model.eval()`","`torch.manual_seed(1337 + seed_offset)`"],"answer":1,"explain":"Without bf16, `dtype` falls back to float16, which enables the GradScaler [[train.py:196|GradScaler(enabled=(dtype == 'float16'))]]; scaling the loss before `backward` scales every gradient up with it [[train.py:305|scaler.scale(loss).backward()]]."}},{"id":"stack-ddp","chapter":"stack","title":"Many GPUs: torchrun, DDP and gradient accumulation","tier":"standard","minutes":6,"for":["new"],"summary":"Gradient accumulation fakes a big batch on one GPU by adding up gradients over several small ones. DDP runs one process per GPU and averages their gradients. nanoGPT combines the two so 1 GPU and 8 GPUs take the same 491,520-token step.","body":"By the end you can explain what changes when you launch with `torchrun`.\n\n**The big-batch problem.** GPT-2-style training wants about half a million tokens per optimizer step, far more than fits in one GPU's memory at once. The default micro-batch is 12 sequences of 1,024 tokens, tuned in commit `9f95aca` \"for gpt2 124M model on A100 40GB\". So `train.py` runs `gradient_accumulation_steps` forward/backward passes before each update, and the gradients add up in `.grad` between them [[train.py:290-305|for micro_step in range(gradient_accumulation_steps):]]. Each loss is divided by the number of micro-steps, so the sum is an average [[train.py:301|loss = loss / gradient_accumulation_steps]]. The default is 5 × 8 = 40 micro-steps [[train.py:48|gradient_accumulation_steps = 5 * 8]].\n\n**DDP.** `torchrun --nproc_per_node=8 train.py` starts 8 copies of the script and gives each the environment variables `RANK`, `LOCAL_RANK` and `WORLD_SIZE`. `train.py` sees `RANK`, joins the process group and claims GPU number `LOCAL_RANK` [[train.py:82-91|init_process_group(backend=backend)]]. Each process gets its own random seed, so each draws different batches [[train.py:106|torch.manual_seed(1337 + seed_offset)]]. The model is wrapped in `DDP` [[train.py:210-212|model = DDP(model, device_ids=[ddp_local_rank])]], which averages gradients across processes during `backward`, so all 8 copies take the identical step.\n\n**Together.** With 8 processes, each runs 40 / 8 = 5 micro-steps [[train.py:92-95|gradient_accumulation_steps //= ddp_world_size]], and tokens per step stay at 5 × 8 × 12 × 1,024 = 491,520 [[train.py:101-102|tokens_per_iter = gradient_accumulation_steps * ddp_world_size * batch_size * block_size]]. Averaging across GPUs after every micro-step would waste bandwidth, so the sync is switched on only for the last one [[train.py:298|model.require_backward_grad_sync = (micro_step == gradient_accumulation_steps - 1)]].\n\n**One boss.** Only rank 0, the `master_process`, evaluates, prints and saves checkpoints [[train.py:263|if iter_num % eval_interval == 0 and master_process:]].","checkpoint":{"q":"You launch on 4 GPUs with the default settings. How many micro-steps does each process run per iteration, and how many tokens does one optimizer step see?","choices":["40 each; 4 × 491,520 tokens","10 each; 491,520 tokens","5 each; 245,760 tokens","1 each; 49,152 tokens"],"answer":1,"explain":"40 is divided by the world size of 4 [[train.py:95|gradient_accumulation_steps //= ddp_world_size]], and tokens per step are 10 × 4 × 12 × 1,024 = 491,520, the same as on 8 GPUs or 1."}},{"id":"map-overview","chapter":"map","title":"The map: three scripts that pass files along","tier":"core","minutes":4,"show":[{"view":"architecture"}],"summary":"Data scripts write token files; `train.py` turns them into `ckpt.pt` using the GPT from `model.py`; `sample.py` turns `ckpt.pt` back into text. Files on disk are the only interface between the stages.","body":"By the end you can place every file in the repo on the pipeline.\n\nPicture an assembly line with three stations and a box passed between them.\n\n1. **Prepare** (`data/\u003cname>/prepare.py`): raw text in, `train.bin` and `val.bin` out, each the whole corpus as one long row of 16-bit integers. The character dataset also writes `meta.pkl`, its vocabulary.\n2. **Train** (`train.py`): reads `data/\u003cdataset>/train.bin` [[train.py:114-120|data_dir = os.path.join('data', dataset)]], builds a `GPT` from `model.py` [[train.py:30|from model import GPTConfig, GPT]], trains it and writes `out_dir/ckpt.pt` [[train.py:285-286|torch.save(checkpoint, os.path.join(out_dir, 'ckpt.pt'))]].\n3. **Sample** (`sample.py`): reads `out_dir/ckpt.pt` [[sample.py:35-38|ckpt_path = os.path.join(out_dir, 'ckpt.pt')]], rebuilds the same `GPT` and prints generated text.\n\nTwo side doors. `train.py` and `sample.py` can start from OpenAI's GPT-2 weights instead (`init_from='gpt2'` and its larger siblings). And `bench.py` uses `model.py` alone to time training steps.\n\nWhat is *not* here matters as much: no package to install, no command-line parser, no server, no classes outside `model.py`. Each script runs top to bottom as plain Python, configured by global variables that `configurator.py` overwrites. `model.py` is the only file other files import, so it is the one place where a change reaches everything.\n\nWhere the assembly-line picture stops working: the box is not generic. A checkpoint belongs to its dataset. `sample.py` decodes with the vocabulary of the dataset named inside the checkpoint, so a character model and a GPT-2-token model are not interchangeable.","checkpoint":{"q":"You change the MLP's width in `model.py`. Which scripts are affected?","choices":["Only train.py","train.py, sample.py and bench.py, because all three import model.py","Only the prepare scripts","None until you rerun prepare.py"],"answer":1,"explain":"All three scripts start with the same import [[train.py:30|from model import GPTConfig, GPT]] [[sample.py:9|from model import GPTConfig, GPT]] [[bench.py:9|from model import GPTConfig, GPT]]. Old checkpoints also stop loading, because the weight shapes no longer match."}},{"id":"map-model-anatomy","chapter":"map","title":"Inside class GPT: the module tree and where the parameters live","tier":"standard","minutes":5,"goals":["gist","own","rebuild"],"summary":"A GPT is an embedding table, a stack of identical blocks, a final LayerNorm and an output layer that shares the embedding's weights. Nearly all parameters sit in the blocks and the token embedding.","body":"By the end you can sketch the model and estimate its size on paper.\n\n`GPT.__init__` builds one `ModuleDict` called `transformer`, plus `lm_head` [[model.py:126-133|self.transformer = nn.ModuleDict(dict(]]:\n\n- `wte`: the token embedding, `vocab_size` × `n_embd`.\n- `wpe`: the position embedding, `block_size` × `n_embd`.\n- `drop`: dropout on their sum.\n- `h`: a list of `n_layer` `Block`s.\n- `ln_f`: a final LayerNorm.\n- `lm_head`: a linear layer from `n_embd` to `vocab_size`, without bias, whose weight *is* `wte`'s weight [[model.py:138|self.transformer.wte.weight = self.lm_head.weight]].\n\nEvery shape comes from `GPTConfig`, seven fields whose defaults describe GPT-2 small [[model.py:108-116|n_embd: int = 768]].\n\n**Where the parameters are.** Each block holds about 12 × n_embd² weights: the query/key/value projection is n_embd × 3·n_embd, attention's output projection n_embd × n_embd, and the MLP's two layers n_embd × 4·n_embd each. For the baby GPT that is 12 × 384² ≈ 1.77M per block, and 6 blocks make about 10.6M. The 65-row token embedding adds only 25K. Hence `number of parameters: 10.65M` at start-up. For GPT-2 small, 12 blocks × 12 × 768² ≈ 85M, and the 50,257 × 768 token embedding adds 38.6M, for about 124M in all.\n\nThe printed count leaves out `wpe` but keeps `wte`, because the tied matrix also serves as the output layer [[model.py:150-160|The token embeddings would too, except due to the parameter sharing]].\n\n**Initialisation.** `_init_weights` draws every linear and embedding weight from a normal distribution with standard deviation 0.02 [[model.py:162-168|torch.nn.init.normal_(module.weight, mean=0.0, std=0.02)]]. The concepts chapter explains the one exception."},{"id":"concepts-embeddings","chapter":"concepts","title":"Embeddings: turning ids into vectors","tier":"standard","minutes":5,"goals":["gist","rebuild"],"summary":"Each token id picks a row from a learned table, and each position picks a row from a second table. Their sum is the vector that enters the first block.","body":"By the end you know exactly what the model sees at its input.\n\nAn integer like 46 says nothing about meaning; 46 is not \"close\" to 47 in any useful way. So the model keeps a table, `wte`, with one row of `n_embd` learned numbers per token id. Looking up row 46 gives a vector of 384 numbers in the baby GPT, 768 in GPT-2 [[model.py:127|wte = nn.Embedding(config.vocab_size, config.n_embd)]]. Training moves the rows until tokens that behave alike get similar vectors.\n\nAttention, as the next lessons show, treats its inputs as an unordered set. To tell \"dog bites man\" from \"man bites dog\" the model must know where each token sits. nanoGPT uses the simplest fix: a second table, `wpe`, with one learned row per position up to `block_size` [[model.py:128|wpe = nn.Embedding(config.block_size, config.n_embd)]]. In `forward`, positions are just `0..t-1`; both lookups happen and the vectors are added [[model.py:174-179|x = self.transformer.drop(tok_emb + pos_emb)]]. Shapes: `(b, t, n_embd)` plus `(t, n_embd)` broadcasts to `(b, t, n_embd)`.\n\nTwo consequences follow.\n\n- The model cannot read more than `block_size` tokens, because there is no row for position 256 in the baby GPT. `forward` asserts it [[model.py:173|Cannot forward sequence of length]], and `generate` crops its input to the last `block_size` tokens [[model.py:313-314|idx_cond = idx if idx.size(1) \u003c= self.config.block_size]].\n- `crop_block_size` can shorten a trained model's context by slicing `wpe` [[model.py:195-201|self.transformer.wpe.weight = nn.Parameter(self.transformer.wpe.weight[:block_size])]], but nothing in the repo can lengthen it.\n\nThe same `wte` matrix is reused at the very end to score the next token (weight tying), so a token's input vector and its output score are tied together."},{"id":"concepts-block","chapter":"concepts","title":"The transformer block: attention, MLP, two residual adds","tier":"core","minutes":5,"summary":"A block refines every position's vector in two steps: attention mixes in information from earlier positions, then a small MLP processes each position on its own. Each step's output is added to its input rather than replacing it.","body":"By the end you can explain the two lines of `Block.forward`.\n\n```python\nx = x + self.attn(self.ln_1(x))\nx = x + self.mlp(self.ln_2(x))\n```\n\nThat is the whole block [[model.py:103-106|x = x + self.attn(self.ln_1(x))]]. Read it as a meeting followed by desk work.\n\n1. **LayerNorm** rescales each position's vector to mean 0 and variance 1, then applies a learned gain [[model.py:26-27|F.layer_norm(input, self.weight.shape, self.weight, self.bias, 1e-5)]]. It keeps the numbers in a steady range however deep the stack gets.\n2. **Attention** is the meeting: each position looks back at earlier positions and pulls in what is relevant. It is the only place where positions exchange information. The next lesson takes it apart.\n3. **The MLP** is the desk work: each position, alone, goes through a two-layer network that widens to 4 × `n_embd` (1,536 in the baby GPT), applies GELU, and narrows back [[model.py:80-92|self.c_fc    = nn.Linear(config.n_embd, 4 * config.n_embd, bias=config.bias)]]. GELU is a smooth version of \"keep positives, zero out negatives\".\n4. **Residual adds.** Each sub-layer's output is *added* to `x`. Think of `x` as a shared notebook that every block writes notes into rather than rewriting. Gradients flow straight back through the additions, which is what lets 12 or 48 blocks train at all.\n\nWhere the analogy stops: in a real meeting people speak in turn. Here every position attends at the same moment, and all of it is one batch of matrix maths.\n\nNormalising *before* each sub-layer (\"pre-norm\") is GPT-2's arrangement; the original 2017 transformer normalised after. Because of pre-norm, the stack needs one last LayerNorm, `ln_f`, before the output layer [[model.py:182|x = self.transformer.ln_f(x)]].\n\nA GPT is this block repeated: 6 times in the baby GPT, 12 in GPT-2 small, 48 in GPT-2 XL [[model.py:216-221|'gpt2-xl':      dict(n_layer=48, n_head=25, n_embd=1600)]]. Every copy has the same shape and its own weights.","checkpoint":{"q":"Which part of a block is the only place where one position can use information from another?","choices":["LayerNorm","The MLP","Attention","The residual add"],"answer":2,"explain":"LayerNorm and the MLP act on each position separately. Only attention multiplies across the time dimension, producing a T × T table per head [[model.py:61|(B, nh, T, hs) x (B, nh, hs, T) -> (B, nh, T, T)]]."}},{"id":"concepts-attention","chapter":"concepts","title":"Causal self-attention, line by line","tier":"core","minutes":7,"summary":"Each position asks a question (query); every earlier position offers a label (key) and some content (value). The position takes an average of the values, weighted by how well each key matches its query. Heads let it ask several questions at once.","body":"By the end you can follow `CausalSelfAttention.forward` and say what each shape means.\n\nAnalogy: a library search. Your **query** is what you are looking for; each book has a **key** (its catalogue entry) and a **value** (its contents). You score every key against your query, turn the scores into weights that sum to 1, and read a blend of the contents. Where it breaks: here you are also a book, and you may only search books shelved before you.\n\n**1. Project.** One linear layer turns each position's vector into query, key and value at once, `3 × n_embd` numbers, then splits them [[model.py:56|q, k, v = self.c_attn(x).split(self.n_embd, dim=2)]].\n\n**2. Split into heads.** Each of q, k, v is reshaped from `(B, T, C)` to `(B, n_head, T, C / n_head)` [[model.py:57-59|C // self.n_head).transpose(1, 2)]]. The baby GPT has 6 heads of 64 numbers; each head searches independently.\n\n**3. Score.** Every query is compared with every key by dot product, scaled by 1/√64, giving a `(T, T)` table per head [[model.py:67|att = (q @ k.transpose(-2, -1)) * (1.0 / math.sqrt(k.size(-1)))]].\n\n**4. Mask the future.** Entries where the key comes after the query are set to −∞, using a lower-triangular matrix [[model.py:68|att.masked_fill(self.bias[:,:,:T,:T] == 0, float('-inf'))]]. This is what \"causal\" means: position 5 cannot peek at token 6, the one it is meant to predict.\n\n**5. Weights.** Softmax turns each row into weights that sum to 1; −∞ becomes exactly 0 [[model.py:69|att = F.softmax(att, dim=-1)]].\n\n**6. Blend.** Multiply by the values, so each position gets a weighted average of earlier values [[model.py:71|y = att @ v]].\n\n**7. Reassemble.** The heads are laid side by side again and mixed by one more linear layer, `c_proj` [[model.py:72-75|y = self.resid_dropout(self.c_proj(y))]].\n\nOn PyTorch 2.0 and later, steps 3 to 6 run as one fused call with `is_causal=True` [[model.py:62-64|is_causal=True]]. It computes the same result without storing the T × T table, which is why it is faster. The manual path stays in the file as the readable version.","deeper":"**Why divide by √(head size)?** For random vectors of length d, a dot product has variance about d. Dividing by √d keeps scores near unit scale, so the softmax does not collapse into picking a single key at initialisation.\n\n**Dropout.** In the manual path, dropout is applied to the attention weights [[model.py:70|att = self.attn_dropout(att)]]. In the fused path it is passed as `dropout_p`, and only while training [[model.py:64|dropout_p=self.dropout if self.training else 0]]. A late fix (`7399dfe`, \"dont always dropout!\") added the `if self.training` part, so evaluation and sampling of models trained with dropout used to be noisier than intended.\n\n**The mask buffer.** The lower-triangular matrix is registered as a buffer named `bias` only when Flash attention is missing [[model.py:46-50|self.register_buffer(]]. That name collides with the idea of a bias parameter, which is why `from_pretrained` filters keys ending in `.attn.bias`.","checkpoint":{"q":"You delete the `masked_fill` line from the manual attention path and train. What goes wrong?","choices":["Nothing; softmax already ignores the future","Training loss falls far lower than normal, but generation is poor, because each position could see the very token it was asked to predict","A shape error on the first batch","Attention becomes slower"],"answer":1,"explain":"The mask is the only thing hiding later positions [[model.py:68|masked_fill]]. Without it, predicting `y[t] = x[t+1]` becomes copying, which works in training (where x[t+1] is present) and fails in sampling (where it is not yet written)."}},{"id":"concepts-adamw","chapter":"concepts","title":"AdamW and weight decay, as nanoGPT sets them up","tier":"standard","minutes":6,"goals":["own","rebuild"],"for":["new"],"summary":"AdamW moves each weight against a smoothed version of its gradient, with a step size adapted to that weight, and shrinks weights slightly every step. nanoGPT applies that shrinking (weight decay 0.1) only to matrices, never to biases or LayerNorm gains.","body":"By the end you can read `configure_optimizers` and the `beta1`, `beta2` and `weight_decay` settings.\n\nPlain gradient descent subtracts `learning_rate × gradient` from each weight. **Adam** keeps two running averages per weight: the average gradient (momentum, controlled by `beta1 = 0.9`) and the average squared gradient (controlled by `beta2 = 0.95`) [[train.py:57-62|beta2 = 0.95]]. The step is the first divided by the square root of the second. A weight with consistently large gradients takes a normal-sized step, not a huge one; a weight with tiny, noisy gradients still moves. The cost is
